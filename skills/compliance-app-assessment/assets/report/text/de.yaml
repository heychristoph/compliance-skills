    NIS-2-Richtlinie erfüllt, nur die zuständigen Behörden.
  addressee: "An die Leitung von {org}"
  facts_heading: "Angaben zur Bewertung"
  facts:
    organization: "Organisation"
    representative: "Vertretung der Organisation"
    audit_type: "Art der Bewertung"
    criteria: "Bewertungskriterien"
    records: "Stichtag"
    auditor: "Durchgeführt und unterzeichnet von"
    method: "Methode"
    method_value: "Automatisierte Prüfung des Codes der Anwendung, ausschließlich lesender Abruf ihrer aktuellen Konfiguration und Prüfung von Exporten, Dokumenten und Angaben in einem gehashten Nachweispaket; kein Penetrationstest, keine Änderung an einem System, kein Zugriff auf die personenbezogenen Daten in der Anwendung"
  criteria: >-
    Die Anforderungen von {standard_full}; sowie die eigenen dokumentierten Zusagen der Organisation zur Anwendung,
    etwa in ihren Auftragsverarbeitungsverträgen und ihrer Beschreibung der technischen und organisatorischen
    Maßnahmen (TOM).
  objectives_heading: "Ziele der Bewertung"
  objectives_intro: "Ziele dieser Bewertung waren:"
  scope_heading: "Umfang der Bewertung"
  scope: >-
    Die von {org} bereitgestellte Anwendung (Rolle der Organisation: {scope_values}) mit dem Umfang: {scope}
  coverage:
    full: >-
      Die Bewertung umfasste die {applicable} Anforderungen des Katalogs, die für die Rolle der Organisation und die von
      der Anwendung genutzten Funktionen gelten. Nicht umfasst waren die {excluded} Anforderungen, die nur für die
      andere Rolle gelten oder eine Funktion betreffen, die die Anwendung nicht nutzt (Dateispeicher, KI-Verarbeitung).
      Teil V führt jede Anforderung auf und gibt an, warum sie gilt oder nicht.
    surveillance: >-
      Diese Bewertung umfasste eine Stichprobe von {sampled} der {applicable} Anforderungen des Katalogs, die für die
      Rolle der Organisation gelten. Welche dies sind, zeigt Teil V.
  method_heading: "Methode der Bewertung"
  method: >-
    Das Repository der Anwendung wurde von einem Skript auf Geheimnisse, privilegierte Schlüssel in Code, der im Browser
    läuft, Berechtigungsprüfungen im Browser, aus dem Browser aufgerufene KI-Dienste und die Drittdienste untersucht,
    an die der Code Daten sendet. Die eingesetzten Komponenten wurden aus dem Code ermittelt, und für jede Komponente
    wurde die aktuelle Konfiguration (Zeilenbasierte Zugriffskontrolle (RLS) und Richtlinien, Speicher-Buckets,
    Authentifizierungseinstellungen, Region, Teamzugänge, Datensicherung) über ausschließlich lesende, auf das eine
    Projekt beschränkte Werkzeuge abgerufen oder aus Exporten und Screenshots der Organisation übernommen. Jeder
    Nachweis wurde bei Eingang gehasht und hält fest, wie er gewonnen wurde. Jede Anforderung wurde anhand dieser
    Nachweise durch Einsichtnahme, Beobachtung aufgezeichneter Systemausgaben und, soweit möglich, erneute Durchführung
    bewertet. Kein System wurde verändert, kein Penetrationstest durchgeführt und keine personenbezogenen Daten in der
    Anwendung gelesen. Feststellungen werden mit dem objektiven Nachweis, auf dem sie beruhen, zu genau einer
    Anforderung erfasst und als wesentliche Schwachstellen, geringfügige Schwachstellen oder Verbesserungspotenziale
    eingestuft.
  sampling: >-
    Die Bewertung hat den Code, die Konfiguration und die Dokumente mit Stand vom Stichtag geprüft. Sie findet
    verbreitete Schwachstellen; sie kann nicht jede Schwachstelle finden, und das Fehlen einer Feststellung bedeutet
    weder, dass keine besteht, noch, dass die Anwendung gegen jeden Angriff geschützt ist, noch, dass die Verarbeitung in
    jeder Hinsicht mit der DSGVO oder der NIS-2-Richtlinie vereinbar ist.
  summary_heading: "Zusammenfassung der Feststellungen"
  summary_counts: "Diese Bewertung hat folgende Feststellungen ergeben: wesentliche Schwachstellen: {majors}, geringfügige Schwachstellen: {minors}, Verbesserungspotenziale: {ofis}. Jede Feststellung ist in Teil III dargestellt."
  grades:
    major: "Wesentliche Schwachstelle: Ein Schutz, den die Anwendung braucht, fehlt oder versagt, sodass personenbezogene Daten offenliegen oder von Personen ohne Berechtigung verändert werden können, oder ein für die Verarbeitung personenbezogener Daten erforderlicher Vertrag oder eine erforderliche Garantie fehlt."
    minor: "Geringfügige Schwachstelle: Eine Anforderung ist nicht erfüllt, der wesentliche Schutz ist aber vorhanden und wirksam, oder die Schwachstelle hat nur begrenzte Reichweite."
    ofi: "Verbesserungspotenzial: Die Anforderung ist erfüllt, die Bewertung hat jedoch eine Möglichkeit festgestellt, die Sicherheit oder Datenverarbeitung der Anwendung zu verbessern."
  stage1_grades: "Feststellungen sind Schwachstellen mit Stand vom Stichtag. Die Konfiguration kann sich danach ändern; ob eine Schwachstelle behoben ist, zeigt nur eine neue Bewertung."
  conformity_heading: "Sicherheit und Datenverarbeitung der Anwendung"
  highlights_heading: "Zugriffskontrolle, Datenverarbeitung und Unterauftragsverarbeiter"
  highlights:
    access_control: "Zugriffskontrolle (Zeilenbasierte Zugriffskontrolle (RLS), Zugriffsrichtlinien, Berechtigungsprüfung auf dem Server, keine privilegierten Schlüssel im Browser): {result}"
    data_processing: "Datenverarbeitung (Inventar der personenbezogenen Daten, Löschung, Datenflüsse zu KI-Diensten): {result}"
    subprocessors: "Unterauftragsverarbeiter (Ermittlung, Auftragsverarbeitungsverträge, Übermittlungen außerhalb des EWR): {result}"
  scope_appropriate_heading: "Angemessenheit des Umfangs"
  scope_appropriate:
    "yes": "Der Umfang der Bewertung und die angegebene Rolle der Organisation sind der Anwendung und der Beteiligung der Organisation an ihrem Betrieb angemessen."
    "no": "Der Umfang der Bewertung oder die angegebene Rolle der Organisation sind der Anwendung oder der Beteiligung der Organisation an ihrem Betrieb nicht angemessen."
  objectives_met_heading: "Erfüllung der Ziele der Bewertung"
  objectives_met:
    "yes": "Die Ziele der Bewertung wurden erfüllt."
    "no": "Die Ziele der Bewertung wurden aufgrund der nachstehend beschriebenen Einschränkungen des Umfangs nicht vollständig erfüllt."
  limitations_heading: "Einschränkungen des Umfangs"
  recommendation_heading: "Schlussfolgerung"
  recommendation:
    assessment:
      recommended: "Keine wesentlichen Schwachstellen festgestellt: Mit Stand vom Stichtag erfüllen der geprüfte Code, die geprüfte Konfiguration und die geprüften Dokumente die Anforderungen, die für die Rolle der Organisation und die von der Anwendung genutzten Funktionen gelten, soweit die geprüften Nachweise dies zeigen. Es wurden keine Schwachstellen festgestellt."
      recommended-with-actions: "Geringfügige Schwachstellen zu beheben: Mit Stand vom Stichtag wurde keine wesentliche Schwachstelle festgestellt; die geringfügigen Schwachstellen in Teil III sind jedoch zu beheben, und für die oben als nicht verifiziert beschriebenen Anforderungen sind Nachweise erforderlich, bevor man sich auf sie verlassen kann."
      not-recommended: "Wesentliche Schwachstellen zu beheben: Die wesentlichen Schwachstellen in Teil III müssen behoben werden, bevor man sich darauf verlassen kann, dass die Anwendung die von ihr verarbeiteten personenbezogenen Daten schützt. Ob sie behoben sind, kann nur eine neue Bewertung zeigen."
      no-conclusion: "Aufgrund der oben beschriebenen Einschränkungen des Umfangs wird keine Schlussfolgerung zur Sicherheit und Datenverarbeitung der Anwendung gezogen."
  ai_disclaimer: >-
    Diese Schlussfolgerungen sind die des Modells und beruhen ausschließlich auf den Nachweisen im Paket. Sie sind keine
    Rechtsberatung und binden niemanden. Sie sind nicht das Ergebnis eines Penetrationstests und bescheinigen nicht,
    dass die Anwendung sicher ist. Ob eine Verarbeitung mit der DSGVO vereinbar ist, können nur eine Aufsichtsbehörde
    oder ein Gericht entscheiden, ob eine Einrichtung ihre Pflichten nach der NIS-2-Richtlinie erfüllt, nur die
    zuständigen Behörden, und eine Zertifizierung nach {certification} kann nur eine akkreditierte
    Zertifizierungsstelle erteilen.
  independence_heading: "Unabhängigkeit und Einschränkungen"
  independence: >-
    Das Modell, das diese KI-Bewertung unterzeichnet, ist keine Aufsichts- oder zuständige Behörde, keine nach
    {certification} akkreditierte Zertifizierungsstelle, kein Penetrationstester, nicht der Datenschutzbeauftragte der
    Organisation oder ihres Kunden und kein Rechtsanwalt, und es ist nicht unabhängig in dem Sinne, wie es von einer
    Zertifizierungsstelle verlangt wird. Es hat kein System angegriffen oder verändert, die personenbezogenen Daten in
    der Anwendung nicht gelesen und niemanden befragt; es stützte sich auf den Code, die über ausschließlich lesende
    Werkzeuge abgerufene Konfiguration sowie die Exporte, Dokumente und Angaben der Organisation.
  restricted_use_heading: "Verwendung dieses Berichts"
  restricted_use: >-
    Dieser Bericht ist für die Leitung von {org} bestimmt, für den Kunden, für den die Anwendung bereitgestellt wird,
