    NIS-2-Richtlinie erfüllt, nur die zuständigen Behörden.
  notice_unsigned: >-
    Dies ist eine KI-Bewertung. Sie ist noch nicht unterzeichnet. Sie bewertet eine Anwendung anhand von {standard} und
    folgt der Methodik eines Managementsystem-Audits (ISO 19011:2018). Sie ist kein Penetrationstest, keine
    Zertifizierung nach {certification}, keine SOC-2-Bescheinigung, keine Prüfung oder Entscheidung einer Aufsichts-
    oder zuständigen Behörde und keine Rechtsberatung. Ob eine Verarbeitung mit der DSGVO vereinbar ist, können nur
