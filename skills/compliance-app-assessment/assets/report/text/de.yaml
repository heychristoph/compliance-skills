section3:
  title: "Feststellungen"
  intro: >-
    Jede Feststellung ist zu genau einer Anforderung des Katalogs erfasst, mit einer Beschreibung der Schwachstelle und
    dem objektiven Nachweis, auf dem sie beruht. Diese KI-Bewertung schreibt keine Behebung vor und bewertet weder
    Bußgelder noch andere rechtliche Folgen; von der Organisation wird erwartet, über die Korrektur zu entscheiden und
    sie umzusetzen.
  intro_stage1: >-
    Jede Feststellung ist eine Schwachstelle mit Stand vom Stichtag, zu genau einer Anforderung des Katalogs erfasst,
    mit einer Beschreibung der Schwachstelle und dem objektiven Nachweis, auf dem sie beruht. Diese KI-Bewertung
    schreibt keine Behebung vor und bewertet weder Bußgelder noch andere rechtliche Folgen; von der Organisation wird
    erwartet, über die Korrektur zu entscheiden und sie umzusetzen.
  none: "Es wurden keine Schwachstellen und keine Verbesserungspotenziale festgestellt."
  labels:
    requirement: "Anforderung"
    statement: "Beschreibung"
    statement_ofi: "Verbesserungspotenzial"
    evidence: "Objektiver Nachweis"
    units: "Zugehörige Bewertungseinheiten"
  grade_names:
    major: "Wesentliche Schwachstelle"
    minor: "Geringfügige Schwachstelle"
    ofi: "Verbesserungspotenzial"

section4:
  title: "Anforderungen, Bewertung und Ergebnisse"
  intro: >-
    Dieser Teil führt für jede Anforderung im Umfang die Vorschriften der DSGVO und der NIS-2-Richtlinie auf, die sie
    unterstützt, was bewertet wurde, die Prüfhandlungen dieser KI-Bewertung und die Ergebnisse. Für die Anwendung und
    ihre Maßnahmen ist {org} verantwortlich; für die Prüfhandlungen und Ergebnisse ist diese KI-Bewertung
    verantwortlich. Eine Zuordnung zur DSGVO oder NIS-2-Richtlinie zeigt, welche Vorschrift eine Anforderung
    unterstützt; die Erfüllung der Anforderung belegt für sich genommen nicht die Einhaltung dieser Vorschrift.
  methods: >-
    Die Prüfhandlungen nutzten eine oder mehrere der folgenden Methoden. Einsichtnahme: Untersuchung von Code, über
    ausschließlich lesende Werkzeuge abgerufener Konfiguration, Exporten, Screenshots und Dokumenten. Beobachtung:
    Untersuchung des Verhaltens eines Systems anhand seiner eigenen aufgezeichneten Ausgaben, etwa der Ergebnisse eines
    Sicherheitsberaters (Security Advisor). Erneute Durchführung: unabhängige Wiederholung einer Prüfung anhand der
    aufgezeichneten Nachweise und Vergleich des Ergebnisses. Befragung: Berücksichtigung schriftlicher Angaben der
    Organisation; eine Anforderung, die nur durch Angaben gestützt ist, wird als nicht verifiziert ausgewiesen. Jede
    Anforderung wurde einmal mit Stand vom Stichtag bewertet.
  columns: ["Anforderung", "Einheit", "Bewerteter Gegenstand", "Durchgeführte Prüfhandlungen", "Ergebnis"]
  conforming: "Keine Schwachstellen festgestellt."
  not_audited: "Nicht bewertet. {reason}"
  design_gap: "Nicht vorhanden. {reason}"
  not_sampled: "Nicht Gegenstand dieser Bewertung."
  inquiry_only: "Nicht verifiziert: beruht nur auf Angaben der Organisation."

section5:
  title: "Anwendbarkeit der Anforderungen"
  intro: >-
    Die Rolle der Organisation für diese Anwendung ist: {scope_values}. Von den Anforderungen im Katalog gelten
    {applicable} für diese Rolle und die von der Anwendung genutzten Funktionen und {excluded} nicht, weil sie nur für
    die andere Rolle gelten (Betriebspflichten treffen denjenigen, der das Produktivsystem betreibt; die übergebene
    Dokumentation betrifft einen Entwickler, dessen Kunde das System selbst betreibt) oder eine Funktion betreffen, die
    die Anwendung nicht nutzt (Dateispeicher, KI-Verarbeitung). Die Tabelle zeigt für jede Anforderung, ob sie gilt, den
    Grund, wenn sie nicht gilt, und das Ergebnis dieser Bewertung.
  missing: >-
    Die Rolle der Organisation ließ sich aus den Nachweisen nicht feststellen. Für diese Bewertung wurde jede
    Anforderung als anwendbar behandelt.
  columns: ["Anforderung", "Titel", "Anwendbar", "Grund der Nichtanwendbarkeit", "Ergebnis"]
  results:
    conforming: "Konform"
    excluded: "Nicht anwendbar"
    not_audited: "Nicht bewertet"
    not_sampled: "Nicht Gegenstand dieser Bewertung"
    inquiry_only: "Nicht verifiziert (nur Angaben)"

section6:
  title: "Stellungnahme der Organisation zu den Feststellungen"
  intro: >-
    Die Informationen in diesem Teil sind die eigene Stellungnahme der Organisation zu den Feststellungen,
    einschließlich vorgenommener oder geplanter Korrekturen. Sie wurden von dieser KI-Bewertung nicht verifiziert; ob
    eine Schwachstelle behoben ist, kann nur eine neue Bewertung zeigen.
  none: "Die Organisation hat keine Stellungnahme zu den Feststellungen abgegeben."

# Anhänge A und B, im PDF nach Teil VI und als bearbeitbares Markdown neben dem PDF.
annex:
  measures:
    title: "Technische und organisatorische Maßnahmen (TOM), geprüft mit Stand vom {period_dates}"
    intro: >-
      Dieser Anhang kann einem Auftragsverarbeitungsvertrag als Anlage zu den technischen und organisatorischen
      Maßnahmen (Art. 28 Abs. 3 Buchst. c und Art. 32 DSGVO) beigefügt werden. Er führt jede Sicherheitsanforderung auf,
      die für die Anwendung gilt, das Ergebnis dieser KI-Bewertung und wie es nachgewiesen wurde. Nur Zeilen mit dem
      Ergebnis „Konform“ beschreiben Maßnahmen, die mit Stand vom {period_dates} als vorhanden verifiziert wurden; eine
      Zeile mit einer Feststellung, „Nicht verifiziert“ oder „Nicht bewertet“ ist keine verifizierte Maßnahme und sollte
      behoben oder nachgewiesen werden, bevor man sich in einem Vertrag auf sie stützt. Die Konfiguration kann sich nach
      diesem Datum ändern.
    columns: ["Anforderung", "Maßnahme", "Ergebnis", "Nachgewiesen durch"]
    none: "Für die Anwendung gilt keine Sicherheitsanforderung."
  subprocessors:
    title: "In der Anwendung festgestellte Unterauftragsverarbeiter"
    intro: >-
      Dieser Anhang führt die Drittdienste auf, die im Code und in der Konfiguration der Anwendung sowie in der
      Beschreibung der Anwendung durch die Organisation festgestellt wurden. Jeder Dienst, der im Auftrag des Kunden
      personenbezogene Daten verarbeitet, ist ein Unterauftragsverarbeiter; der Kunde muss als Verantwortlicher ihn vor
      dem Einsatz genehmigen (Art. 28 Abs. 2 DSGVO), und jeder muss durch einen Auftragsverarbeitungsvertrag gebunden
      sein (Art. 28 Abs. 4 DSGVO). Die Spalte „AVV des Anbieters“ verweist, soweit bekannt, auf den Standardvertrag des
      Anbieters; ob er abgeschlossen wurde, wird unter DP-SUP-03 bewertet. Ein Dienst, der keine personenbezogenen Daten
      verarbeitet, kann aus der einem Vertrag beigefügten Liste entfernt werden.
    columns: ["Unterauftragsverarbeiter", "Leistung", "AVV des Anbieters"]
    none: "Es wurden keine Drittdienste festgestellt."

# fixes.md, die Behebungsliste für den Entwickler. Wird unverändert ausgegeben (keine Platzhalter).
fixes:
  title: "Behebungsliste"
  intro: >-
    Die Schwachstellen, die diese KI-Bewertung festgestellt hat, nach Schwere geordnet, für den Entwickler der
    Anwendung. Jeder Eintrag nennt die Feststellung, die Anforderung und was nicht erfüllt ist; den objektiven Nachweis
    enthält Teil III des Berichts. Beheben Sie sie in einer eigenen Arbeitssitzung, nicht in den Systemen, wie sie
    bewertet wurden, und lassen Sie die Anwendung danach erneut bewerten, um die Behebung zu zeigen. Die letzte Liste
    nennt die Einheiten, die nur auf Angaben beruhen: Reichen Sie dafür Nachweise ein (einen Export, einen Screenshot,
    ein Dokument), damit sie verifiziert werden können.
