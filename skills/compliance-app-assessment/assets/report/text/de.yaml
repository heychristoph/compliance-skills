# Berichtstext für eine KI-Bewertung der Sicherheit und Datenverarbeitung einer Anwendung.
#
# Kriterien sind die Anforderungen des App-Katalogs (assets/frameworks/app.yaml):
# Sicherheit (SEC-*) und Datenverarbeitung (DP-*), jeweils mit den Vorschriften der
# DSGVO und der NIS-2-Richtlinie, die sie unterstützen. Der Aufbau folgt den Inhalten
# eines Auditberichts für Managementsysteme (ISO 19011:2018, 6.5.1). Das Dokument ist
# eine KI-Bewertung. Es ist kein Penetrationstest, keine Zertifizierung (ISO/IEC 27001,
# Art. 42 DSGVO) und keine SOC-2-Bescheinigung, keine Prüfung oder Entscheidung einer
# Aufsichts- oder zuständigen Behörde und keine Rechtsberatung.
#
# Die Schlüssel sind dieselben wie in en.yaml (siehe dort). „KI-Bewertung“ ist der
# durchgehend verwendete Name des Dokuments.
#
# Platzhalter: {org} {scope} {model} {type_label} {period} {period_dates}
# {standard} {standard_full} {certification} {scope_values} {applicable} {excluded}
# {sampled} {majors} {minors} {ofis} {representative}; in labels.strength zusätzlich
# {direct} {captured} {client} {inquiry} {none}. fixes.* wird unverändert ausgegeben.

standards:
  full: "der App-Bewertungskatalog der Compliance-Skills, „Sicherheit und Datenverarbeitung einer Anwendung“: Anforderungen an Zugriffskontrolle, Authentifizierung, Datenschutz bei Speicherung und Übertragung, sicheren Code, Betrieb, Dateninventar, Unterauftragsverarbeiter, Aufbewahrung und Löschung, Sicherheitsvorfälle und KI-Verarbeitung, jeweils mit den Vorschriften der Verordnung (EU) 2016/679 (DSGVO) und der Richtlinie (EU) 2022/2555 (NIS-2-Richtlinie), die sie unterstützen"
  short: "der App-Bewertungskatalog (Sicherheit und Datenverarbeitung)"
  certification: "ISO/IEC 27001 oder Art. 42 DSGVO"
  auditing: "ISO 19011:2018"

audit_types:
  assessment:
    label: "Bewertung zum Stichtag (Code, Konfiguration und Dokumente)"
    period_heading: "Bewertet mit Stand vom"
    objectives:
      - "Feststellung der bewerteten Anwendung, ihrer Architektur und der von ihr genutzten Dienste sowie der Frage, ob die Organisation das Produktivsystem für ihren Kunden betreibt oder die Anwendung nur entwickelt hat;"
      - "Bewertung, ob der Zugriff auf die Daten der Anwendung dort kontrolliert wird, wo er durchgesetzt wird: Zeilenbasierte Zugriffskontrolle (RLS) und Zugriffsrichtlinien in der Datenbank, Serverfunktionen, Speicher-Buckets und Authentifizierungseinstellungen;"
      - "Bewertung des Codes und seiner Konfiguration auf privilegierte Schlüssel und Geheimnisse, bekannte Schwachstellen und Berechtigungsprüfungen, die nur im Browser stattfinden;"
      - "Bewertung der Verarbeitung personenbezogener Daten: was die Anwendung speichert, an welche Unterauftragsverarbeiter und KI-Dienste sie Daten übermittelt, welche Verträge und Übermittlungsgrundlagen diese abdecken, Aufbewahrung und Löschung sowie, wenn die Organisation das Produktivsystem betreibt, Datensicherung, Protokollierung und Meldung von Datenschutzverletzungen;"
      - "Angabe, wie jede Anforderung nachgewiesen wurde, und Ermittlung der zu behebenden Schwachstellen."

cover:
  kicker: "KI-Bewertung"
  disclaimer: "Kein Penetrationstest. Keine Zertifizierung oder Bescheinigung. Keine Prüfung oder Entscheidung einer Aufsichts- oder zuständigen Behörde. Keine Rechtsberatung. Auf Grundlage dieses Berichts wird kein Zertifikat, Siegel oder Prüfzeichen erteilt, und es kann auch keines erteilt werden."
  title: "KI-Bewertung der Sicherheit und Datenverarbeitung der von {org} bereitgestellten Anwendung"
  restricted: "Diese KI-Bewertung ist weder ein Penetrationstest noch eine Zertifizierung noch eine Feststellung einer Behörde noch eine Rechtsberatung und darf nicht als eines davon dargestellt werden."

