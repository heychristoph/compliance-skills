# Copied from shared/frameworks/app.yaml by tools/sync.py. Edit that file, not this copy.
# App assessment: security and data processing of one application or system.
#
# This catalog is written for a point-in-time assessment of a single app, typically
# a web app built by a developer or agency on a backend-as-a-service (Supabase,
# Firebase), a hosting platform (Vercel, Netlify) or an AI app builder (Lovable,
# Bolt), often calling AI APIs. It answers the supplier questions that customers
# working under GDPR and NIS2 ask about such an app. All wording is our own.
#
# Every entry can be verified from configuration, code or exports; `question` is the
# fallback when nothing can be checked and the user has to answer.
#
# kind: requirement - an assessable statement about the app or its operation.
# group:        - SEC-* groups cover security, DP-* groups cover data processing.
# roles:        - who the entry applies to:
#   processor  - the supplier runs the production system for the client and
#                processes personal data on its behalf. All entries apply.
#   developer  - the client runs production; the supplier only built the app. Only
#                design, code and configuration as delivered and the handed-over
#                documentation apply. Operating duties (backups, log monitoring,
#                breach notice, sub-processor contracts) are processor-only.
# optional: true - applies only when a feature is in use: file storage (SEC-AC-06)
#                 and AI processing (the whole DP-AI group). Left out unless listed
#                 in `include_optional`; stack detection lists them.
# plan:         - [frequency, nature]. Most entries are [continuous, automated]
#                 (configuration read at the assessment date) or [annual, manual]
#                 (documents and procedures).
# evidence:     - what proves the entry, named generically across stacks.
# refs.asvs:    - OWASP Application Security Verification Standard 5.0 requirement
#                 IDs, checked against the 5.0 sources in the OWASP/ASVS repository.
#                 Only the IDs are referenced; the ASVS text (CC BY-SA 4.0) is not
#                 copied here.
# maps:         - related requirement IDs in the other catalogs of this folder
#                 (gdpr, nis2, iso27001, soc2). A mapping marks a real relationship,
#                 not equivalence. NIS2 mappings point to the obligations of the
#                 client (an essential or important entity) that the supplier's app
#                 supports, mostly supply chain and Art. 21(2) measures.

framework: {id: app, name: App assessment, title: "Security and data processing of an application", reference: "compliance-skills app catalog"}

groups:
  "SEC-AC": Access control and authorization
  "SEC-AUTH": Authentication and sessions
  "SEC-DATA": Data protection at rest and in transit
  "SEC-CODE": Secure code, secrets and dependencies
  "SEC-OPS": "Operations: logging, backups, environments, change"
  "DP-INV": Data inventory and purposes
  "DP-SUP": Sub-processors, contracts and transfers
  "DP-LIFE": Retention, deletion and return
  "DP-INC": Incidents and breach notice
  "DP-AI": AI and automated processing

requirements:
  # SEC-AC Access control and authorization
  - {id: "SEC-AC-01", kind: requirement, group: "SEC-AC", roles: [processor, developer], plan: [continuous, automated], title: "Row-level security is enabled on every exposed table", summary: "Every table, view or collection that the client API can reach (anonymous or signed-in role, Firestore, Realtime Database) has row-level security or security rules switched on. No table holding user data is open by default.", evidence: "RLS status per table in the exposed schemas from the database security advisor or `pg_tables.rowsecurity`; list of tables with RLS off and the reason; Firestore, Realtime Database and Storage security rules as deployed", question: "Do all tables that the app's client API can reach have row-level security (or Firebase security rules) switched on?", refs: {asvs: ["V8.2.2"]}, maps: {gdpr: ["Art.32(1)(b)", "Art.25(1)"], nis2: ["Art.21(2)(i)", "IR.11.1"], iso27001: ["A.8.3", "A.5.15"], soc2: ["CC6.1"]}}
  - {id: "SEC-AC-02", kind: requirement, group: "SEC-AC", roles: [processor, developer], plan: [continuous, automated], title: "Access policies limit rows to their owner, team or tenant", summary: "Each row-level policy or security rule ties reads and writes to the signed-in user, their team or their tenant. No policy grants access with an always-true condition, and a signed-in user cannot read or change other users' or other tenants' rows.", evidence: "Policy definitions from `pg_policies` or migrations (USING and WITH CHECK clauses based on `auth.uid()` or a membership table); Firebase rules without `if true` or a bare `request.auth != null`; test with two accounts showing one cannot read or update the other's rows; tenant column and policy on each multi-tenant table", question: "Do the access policies restrict each user to their own rows (or their team's or tenant's), for reading and writing, with no policy that allows everyone?", refs: {asvs: ["V8.2.2", "V8.2.3", "V8.4.1"]}, maps: {gdpr: ["Art.32(1)(b)", "Art.25(1)"], nis2: ["Art.21(2)(i)", "IR.11.2"], iso27001: ["A.8.3", "A.5.15"], soc2: ["CC6.1", "CC6.3"]}}
  - {id: "SEC-AC-03", kind: requirement, group: "SEC-AC", roles: [processor, developer], plan: [continuous, automated], title: "Authorization is enforced on the server, not only in the interface", summary: "Roles and permissions (admin, staff, customer) are checked by database policies or server code on every request. Hiding buttons, routes or pages in the frontend is not the only protection, and a role the user can edit (such as user metadata or local storage) is not trusted.", evidence: "Policies and server code reading roles from a server-controlled source (roles table, custom claims, `app_metadata`) and not from `user_metadata` or browser storage; admin routes and their server-side checks; test calling an admin function or table directly with a normal user's token", question: "If a normal user called the admin functions or tables directly, bypassing the interface, would the server refuse?", refs: {asvs: ["V8.3.1", "V8.2.1"]}, maps: {gdpr: ["Art.32(1)(b)", "Art.25(1)"], nis2: ["Art.21(2)(i)", "IR.11.2"], iso27001: ["A.8.3", "A.8.26"], soc2: ["CC6.1", "CC6.3"]}}
  - {id: "SEC-AC-04", kind: requirement, group: "SEC-AC", roles: [processor, developer], plan: [continuous, automated], title: "Server functions, API routes and webhooks authenticate the caller", summary: "Every edge function, serverless function and API route either verifies the user's token or checks a signature or shared secret for machine callers such as payment webhooks and scheduled jobs. Functions with the platform's token check switched off carry their own check.", evidence: "Function configuration (for example `verify_jwt` in `supabase/config.toml`); route code verifying tokens with the platform SDK rather than only decoding them; webhook signature verification; list of intentionally public endpoints with the reason", question: "Does every server function and API endpoint check who is calling it, including webhooks and scheduled jobs?", refs: {asvs: ["V8.2.1", "V9.1.1"]}, maps: {gdpr: ["Art.32(1)(b)"], nis2: ["Art.21(2)(i)", "IR.11.6"], iso27001: ["A.8.5", "A.8.26"], soc2: ["CC6.1"]}}
  - {id: "SEC-AC-05", kind: requirement, group: "SEC-AC", roles: [processor, developer], plan: [continuous, automated], title: "Database functions, views and exposed schemas do not bypass access rules", summary: "Views, database functions and RPC endpoints that run with elevated rights (security definer) are not callable by anonymous or ordinary users unless they enforce the same checks. The auto-generated API exposes only the schemas the app needs.", evidence: "Database security advisor findings (security definer views, mutable function search path, exposed auth tables); `EXECUTE` grants on functions for the anonymous and signed-in roles; views with `security_invoker`; exposed schemas setting; GraphQL endpoint and introspection setting", question: "Are there views or database functions that run with elevated rights and could show users data the row-level policies would block?", refs: {asvs: ["V8.2.2", "V15.2.3"]}, maps: {gdpr: ["Art.32(1)(b)"], nis2: ["Art.21(2)(i)", "IR.6.3"], iso27001: ["A.8.3", "A.8.9"], soc2: ["CC6.1"]}}
  - {id: "SEC-AC-06", kind: requirement, group: "SEC-AC", roles: [processor, developer], optional: true, plan: [continuous, automated], title: "Storage buckets are private and access-controlled", summary: "Buckets holding user files are private, with storage policies that tie each object to its owner. Public buckets hold only content meant for everyone, and private files are shared through short-lived signed URLs.", evidence: "Bucket list with the public flag (Supabase Storage, Firebase Storage, S3, Vercel Blob and similar); storage policies or rules per bucket; signed URL lifetime in the code; check that a public bucket cannot be listed to reveal user files", question: "Are all buckets that hold user files private, with access limited to the file's owner?", refs: {asvs: ["V8.2.2"]}, maps: {gdpr: ["Art.32(1)(b)", "Art.25(2)"], nis2: ["Art.21(2)(i)"], iso27001: ["A.8.3"], soc2: ["CC6.1", "C1.1"]}}
  - {id: "SEC-AC-07", kind: requirement, group: "SEC-AC", roles: [processor], plan: [continuous, automated], title: "Team access to production is named, minimal and current", summary: "Only named people who need it are members of the production project, hosting team, database, repository and AI builder workspace, each with the lowest role that works. Shared logins are not used, and people who left or changed role have been removed. Support access to production data is limited and traceable.", evidence: "Member and role exports of the BaaS organization, hosting team, cloud project, repository and AI builder workspace; list of people with dashboard or direct database access to production data and the reason; date of the last access review; offboarding records", question: "Who on your side can access the production data or its admin consoles, and is that list current and limited to people who need it?", maps: {gdpr: ["Art.32(4)", "Art.29"], nis2: ["Art.21(2)(i)", "IR.11.2", "IR.11.3"], iso27001: ["A.8.2", "A.5.18", "A.5.15"], soc2: ["CC6.2", "CC6.3"]}}

  # SEC-AUTH Authentication and sessions
  - {id: "SEC-AUTH-01", kind: requirement, group: "SEC-AUTH", roles: [processor, developer], plan: [continuous, automated], title: "Email addresses are confirmed before an account is active", summary: "New accounts must confirm their email address or phone number before they can sign in or reach user data, so nobody can register with another person's address. A change of email address is confirmed as well.", evidence: "Auth provider settings (Supabase email confirmation and secure email change; Firebase `email_verified` checked in rules or code); sign-up test with an unconfirmed address", question: "Do new users have to confirm their email address before they can use the app?", maps: {gdpr: ["Art.32(1)(b)"], nis2: ["IR.11.5"], iso27001: ["A.5.16", "A.8.5"], soc2: ["CC6.2"]}}
  - {id: "SEC-AUTH-02", kind: requirement, group: "SEC-AUTH", roles: [processor, developer], plan: [continuous, automated], title: "The password policy follows current guidance", summary: "Passwords have a minimum length of at least 8 characters (longer is better), long passwords are allowed, and new passwords are checked against known breached passwords. Forced composition rules and periodic changes are not required.", evidence: "Auth provider password settings (minimum length, required characters, leaked password protection); Firebase password policy; custom validation in the sign-up code", question: "What minimum password length does the app enforce, and does it reject passwords known from data breaches?", refs: {asvs: ["V6.2.1", "V6.2.4", "V6.2.12"]}, maps: {gdpr: ["Art.32(1)(b)"], nis2: ["IR.11.6"], iso27001: ["A.5.17", "A.8.5"], soc2: ["CC6.1"]}}
  - {id: "SEC-AUTH-03", kind: requirement, group: "SEC-AUTH", roles: [processor, developer], plan: [continuous, automated], title: "Sign-in, sign-up and password reset are rate-limited", summary: "Sign-in, sign-up, password reset, magic link and one-time code endpoints limit attempts per account and per IP address. Where sign-up is open to the public, bot protection such as a CAPTCHA is in place.", evidence: "Auth rate limit settings; CAPTCHA or bot protection configuration (Turnstile, hCaptcha, reCAPTCHA, Firebase App Check); custom rate limiting in API routes", question: "Does the app limit repeated sign-in, sign-up and password reset attempts?", refs: {asvs: ["V6.3.1", "V6.6.3", "V2.4.1"]}, maps: {gdpr: ["Art.32(1)(b)"], nis2: ["IR.11.6"], iso27001: ["A.8.5"], soc2: ["CC6.6"]}}
  - {id: "SEC-AUTH-04", kind: requirement, group: "SEC-AUTH", roles: [processor, developer], plan: [continuous, automated], title: "Administrators of the app use multi-factor authentication", summary: "Users with admin or staff roles inside the app must use a second factor (authenticator app, passkey or security key) to reach admin functions, and the server checks the authentication level before granting them.", evidence: "MFA settings of the auth provider; server checks of the authentication level (for example the `aal2` claim in policies or route handlers); list of admin users with their MFA enrollment", question: "Must users with admin rights in the app sign in with a second factor?", refs: {asvs: ["V6.3.3"]}, maps: {gdpr: ["Art.32(1)(b)"], nis2: ["Art.21(2)(j)", "IR.11.7", "IR.11.3"], iso27001: ["A.8.5", "A.8.2"], soc2: ["CC6.1"]}}
  - {id: "SEC-AUTH-05", kind: requirement, group: "SEC-AUTH", roles: [processor], plan: [continuous, automated], title: "Accounts on hosting and admin consoles use multi-factor authentication", summary: "Every account that can reach the production system (BaaS dashboard, hosting, cloud console, repository, AI builder, domain registrar and DNS) has multi-factor authentication switched on, enforced at organization level where the platform allows it.", evidence: "Organization MFA enforcement settings or member MFA status per platform; single sign-on configuration where used", question: "Do all accounts with access to the production consoles, repository and DNS use multi-factor authentication?", maps: {gdpr: ["Art.32(1)(b)"], nis2: ["Art.21(2)(j)", "IR.11.7", "IR.11.4"], iso27001: ["A.8.5", "A.8.2"], soc2: ["CC6.1"]}}
  - {id: "SEC-AUTH-06", kind: requirement, group: "SEC-AUTH", roles: [processor, developer], plan: [continuous, automated], title: "Sessions expire and can be revoked", summary: "Access tokens are short-lived, refresh tokens are rotated with reuse detection and have a maximum lifetime, and sign-out, password change and account deletion end the sessions concerned.", evidence: "Auth settings for access token expiry, refresh token rotation and reuse interval, inactivity and maximum session time; sign-out code and its scope; flags on session cookies", question: "How long do user sessions last, and are they ended on sign-out, password change and account deletion?", refs: {asvs: ["V7.3.1", "V7.3.2", "V7.4.1", "V7.4.2", "V10.4.5"]}, maps: {gdpr: ["Art.32(1)(b)"], nis2: ["IR.11.6"], iso27001: ["A.8.5"], soc2: ["CC6.1"]}}
  - {id: "SEC-AUTH-07", kind: requirement, group: "SEC-AUTH", roles: [processor, developer], plan: [continuous, automated], title: "Only needed sign-in methods are enabled and redirect URLs are restricted", summary: "Sign-in providers, anonymous sign-in and default or test accounts that the app does not use are disabled in production. OAuth redirect and site URLs are an exact list of the app's own domains, without broad wildcards.", evidence: "Enabled providers in the auth settings; anonymous sign-in setting; redirect URL allow list and site URL; authorized domains in Firebase; production user list checked for default and test accounts", question: "Are unused sign-in methods and test accounts switched off, and are redirect URLs limited to your own domains?", refs: {asvs: ["V6.3.2", "V6.3.4", "V10.4.1"]}, maps: {gdpr: ["Art.32(1)(b)"], nis2: ["IR.11.5", "IR.6.3"], iso27001: ["A.8.5", "A.8.9"], soc2: ["CC6.1"]}}

  # SEC-DATA Data protection at rest and in transit
  - {id: "SEC-DATA-01", kind: requirement, group: "SEC-DATA", roles: [processor, developer], plan: [continuous, automated], title: "Personal data are stored and processed in the EU", summary: "The database, file storage, serverless functions, backups and logs that hold personal data run in an EU or EEA region. Any component outside the EEA is documented and covered by a transfer mechanism.", evidence: "Region in the BaaS and hosting settings (database region, function region, storage and Firestore location); log and backup location from the provider documentation; list of components outside the EEA with the transfer basis", question: "In which region do the database, storage, functions and backups run?", maps: {gdpr: ["Art.44", "Art.46(1)"], iso27001: ["A.5.23", "A.5.31"]}}
  - {id: "SEC-DATA-02", kind: requirement, group: "SEC-DATA", roles: [processor, developer], plan: [continuous, automated], title: "Data in transit are encrypted and the database is not openly reachable", summary: "The app is served only over HTTPS with HSTS and TLS 1.2 or higher. Connections to the database and between services use TLS, and direct database access is limited to the networks or clients that need it.", evidence: "TLS scan of the app domains; HSTS header; database SSL enforcement setting; database network restrictions or IP allow list; connection strings requiring TLS", question: "Is all traffic to the app and to the database encrypted, and is direct database access restricted?", refs: {asvs: ["V12.1.1", "V12.2.1", "V12.3.1", "V3.4.1"]}, maps: {gdpr: ["Art.32(1)(a)"], nis2: ["Art.21(2)(h)", "IR.9.2", "IR.6.7"], iso27001: ["A.8.24", "A.8.20"], soc2: ["CC6.7", "CC6.6"]}}
  - {id: "SEC-DATA-03", kind: requirement, group: "SEC-DATA", roles: [processor, developer], plan: [continuous, automated], title: "Data at rest are encrypted", summary: "The database, file storage and backups are encrypted at rest by the provider. Especially sensitive fields (health data, identity documents, tokens for other services) get additional column or application-level encryption where the risk calls for it.", evidence: "Provider documentation or settings confirming encryption at rest for database, storage and backups; list of sensitive columns and how they are protected (for example a vault extension or encrypted columns); who holds the keys", question: "Are the database, files and backups encrypted at rest, and are especially sensitive fields protected further?", maps: {gdpr: ["Art.32(1)(a)"], nis2: ["Art.21(2)(h)", "IR.9.2"], iso27001: ["A.8.24"], soc2: ["CC6.1", "C1.1"]}}
  - {id: "SEC-DATA-04", kind: requirement, group: "SEC-DATA", roles: [processor, developer], plan: [continuous, automated], title: "The client receives only the data it needs", summary: "Queries and API responses return only the fields a screen needs, not whole records or other users' data. Personal data are kept out of URLs and query strings, and browser storage holds no sensitive data beyond the session token.", evidence: "Client queries (`select('*')` on tables with personal data, whole-document reads); network trace of key screens; URL patterns; contents of localStorage, sessionStorage and IndexedDB after sign-in", question: "Does the frontend load only the fields it shows, and does it keep personal data out of URLs and browser storage?", refs: {asvs: ["V15.3.1", "V14.2.6", "V14.2.1", "V14.3.3"]}, maps: {gdpr: ["Art.5(1)(c)", "Art.25(2)", "Art.32(1)(b)"], nis2: ["Art.21(2)(e)"], iso27001: ["A.8.12", "A.8.28"], soc2: ["C1.1"]}}
  - {id: "SEC-DATA-05", kind: requirement, group: "SEC-DATA", roles: [processor, developer], plan: [continuous, automated], title: "Third-party scripts and trackers receive no undocumented personal data", summary: "Analytics, session replay, error tracking and advertising scripts receive only the personal data that are documented and, where required, consented to. Session replay masks form inputs, and no tracker loads before consent where consent is needed.", evidence: "Third-party scripts loaded by the app (network trace, tag manager); analytics and replay settings (input masking, IP truncation, EU hosting); error tracker data scrubbing; behavior of the consent banner before consent", question: "Which analytics, replay or tracking tools run in the app, and what personal data do they receive?", refs: {asvs: ["V14.2.3"]}, maps: {gdpr: ["Art.5(1)(c)", "Art.25(2)"], iso27001: ["A.8.12", "A.5.34"], soc2: ["P6.1", "C1.1"]}}

  # SEC-CODE Secure code, secrets and dependencies
  - {id: "SEC-CODE-01", kind: requirement, group: "SEC-CODE", roles: [processor, developer], plan: [continuous, automated], title: "No privileged keys in frontend code", summary: "The frontend bundle and mobile app contain only keys meant to be public, such as the anonymous or publishable key and the Firebase web configuration. Service-role keys, admin SDK credentials, secret API keys and AI provider keys are used only on the server.", evidence: "Search of the source and the built bundle for service-role keys, secret key patterns, admin credentials and AI API keys; environment variables with public prefixes (`NEXT_PUBLIC_`, `VITE_`, `EXPO_PUBLIC_`) and what they hold; where the admin SDK is initialized", question: "Is any service-role, admin or secret API key used in code that runs in the browser or the mobile app?", refs: {asvs: ["V13.3.1"]}, maps: {gdpr: ["Art.32(1)(b)"], nis2: ["Art.21(2)(e)", "IR.6.2"], iso27001: ["A.8.28", "A.5.17"], soc2: ["CC6.1"]}}
  - {id: "SEC-CODE-02", kind: requirement, group: "SEC-CODE", roles: [processor, developer], plan: [continuous, automated], title: "Secrets are kept in a secret store, not in the repository", summary: "API keys, database passwords and signing secrets live in the platform's environment or secret store, separately per environment, and never in the repository or its history. Secret scanning is on, and any secret that was ever committed has been rotated.", evidence: "Secret scan of the repository including its history (for example gitleaks or trufflehog); secret scanning and push protection settings; `.gitignore` covering `.env` files; environment variables per environment on the hosting and BaaS platform; rotation record for exposed secrets", question: "Have any keys or passwords ever been committed to the repository, and if so, were they rotated?", refs: {asvs: ["V13.3.1", "V13.3.2"]}, maps: {gdpr: ["Art.32(1)(b)"], nis2: ["Art.21(2)(e)", "IR.6.2", "IR.9.2"], iso27001: ["A.8.28", "A.5.17", "A.8.4"], soc2: ["CC6.1"]}}
  - {id: "SEC-CODE-03", kind: requirement, group: "SEC-CODE", roles: [processor, developer], plan: [continuous, automated], title: "Dependencies have no known critical or high vulnerabilities", summary: "At the assessment date the app's direct and transitive dependencies show no known critical or high vulnerabilities without a documented reason, a committed lockfile pins the versions, and no framework or runtime is past its end of support.", evidence: "Output of `npm audit`, `pnpm audit`, `pip-audit` or a software composition scan against the lockfile; lockfile in the repository; framework and runtime versions against their support status", question: "When did you last check the app's libraries for known vulnerabilities, and are any critical or high findings open?", refs: {asvs: ["V15.2.1"]}, maps: {gdpr: ["Art.32(1)(b)"], nis2: ["Art.21(2)(e)", "IR.6.10", "IR.6.6"], iso27001: ["A.8.8"], soc2: ["CC7.1"]}}
  - {id: "SEC-CODE-04", kind: requirement, group: "SEC-CODE", roles: [processor], plan: [continuous, automated], title: "Vulnerability alerts are monitored and fixed within set times", summary: "Automated dependency and security alerts are switched on, a named person triages them, and fixes follow defined time frames by severity. Platform security notices and advisor findings are reviewed as well.", evidence: "Dependabot or Renovate configuration and alert history; remediation time frames by severity; closed alerts with dates; review of the BaaS security advisor", question: "Who receives dependency and security alerts for the app, and how quickly are critical ones fixed?", refs: {asvs: ["V15.1.1"]}, maps: {gdpr: ["Art.32(1)(b)", "Art.32(1)(d)"], nis2: ["Art.21(2)(e)", "IR.6.6", "IR.6.10"], iso27001: ["A.8.8"], soc2: ["CC7.1"]}}
  - {id: "SEC-CODE-05", kind: requirement, group: "SEC-CODE", roles: [processor, developer], plan: [continuous, automated], title: "Input is validated on the server and output is encoded", summary: "Server code and database functions validate input against expected types and limits, build queries with parameters instead of string concatenation, and render user content without injecting raw HTML. Server-side requests to user-supplied URLs are restricted.", evidence: "Validation schemas in API routes and functions; raw SQL built from strings; use of `dangerouslySetInnerHTML`, `v-html` or `innerHTML` with user data; HTML sanitizer for rich text; allow list for server-side fetches; static analysis results", question: "Does the server validate all input, and is user content displayed without raw HTML?", refs: {asvs: ["V2.2.2", "V1.2.4", "V1.3.1", "V1.3.6", "V3.2.2"]}, maps: {gdpr: ["Art.32(1)(b)"], nis2: ["Art.21(2)(e)", "IR.6.2"], iso27001: ["A.8.28", "A.8.26"]}}
  - {id: "SEC-CODE-06", kind: requirement, group: "SEC-CODE", roles: [processor, developer], plan: [continuous, automated], title: "The production configuration is hardened", summary: "Production responses carry security headers (a Content-Security-Policy with frame-ancestors, X-Content-Type-Options), CORS admits only the app's own origins on endpoints that use credentials, debug modes are off, and errors shown to users reveal no stack traces or internals.", evidence: "Response headers of the main pages and API (header scan); CORS headers of functions and API routes (no wildcard origin on authenticated endpoints); hosting header configuration; production error responses; no `.git`, `.env` or secret-bearing source maps on the public site", question: "Does the production site send security headers, restrict CORS to your own domains and hide internal error details?", refs: {asvs: ["V3.4.2", "V3.4.3", "V3.4.4", "V3.4.6", "V13.4.1", "V13.4.2", "V16.5.1"]}, maps: {gdpr: ["Art.32(1)(b)"], nis2: ["Art.21(2)(e)", "IR.6.3"], iso27001: ["A.8.9"], soc2: ["CC6.6"]}}
  - {id: "SEC-CODE-07", kind: requirement, group: "SEC-CODE", roles: [processor, developer], plan: [annual, manual], title: "The app was security-tested before release", summary: "Before go-live and after major changes the app was tested for security, at least with the platform's security advisor and an automated scan, and with a penetration test where it holds sensitive data. Findings are fixed or accepted with a reason.", evidence: "Security advisor or linter output; static analysis or dynamic scan reports; penetration test report with dates; list of findings with their status", question: "Has the app been security-tested with a scan or a penetration test, and what happened to the findings?", maps: {gdpr: ["Art.32(1)(d)"], nis2: ["Art.21(2)(f)", "IR.6.5"], iso27001: ["A.8.29"], soc2: ["CC4.1", "CC7.1"]}}

  # SEC-OPS Operations: logging, backups, environments, change
  - {id: "SEC-OPS-01", kind: requirement, group: "SEC-OPS", roles: [processor], plan: [continuous, automated], title: "Backups and point-in-time recovery are enabled", summary: "The production database is backed up automatically with a retention that meets the agreed recovery point, using point-in-time recovery where the plan offers it. Stored files and auth users, which database backups may not cover, are backed up too.", evidence: "Backup and point-in-time recovery settings and the list of recent backups; retention period; backup approach for storage buckets and auth data; Firestore scheduled exports or point-in-time recovery; agreed recovery point and recovery time objectives", question: "How is production data backed up, how long are backups kept, and do they include uploaded files?", maps: {gdpr: ["Art.32(1)(c)", "Art.32(1)(b)"], nis2: ["Art.21(2)(c)", "IR.4.2"], iso27001: ["A.8.13"], soc2: ["A1.2"]}}
  - {id: "SEC-OPS-02", kind: requirement, group: "SEC-OPS", roles: [processor], plan: [annual, manual], title: "Restoring from backup has been tested", summary: "A restore of the database and files into a separate project was carried out within the last twelve months, the time it took was recorded, and the steps are written down.", evidence: "Record of the last restore test with date, scope, duration and result; restore runbook", question: "When did you last restore the app from a backup, and how long did it take?", maps: {gdpr: ["Art.32(1)(c)", "Art.32(1)(d)"], nis2: ["Art.21(2)(c)", "IR.4.1", "IR.4.2"], iso27001: ["A.8.13", "A.5.30"], soc2: ["A1.3", "CC7.5"]}}
  - {id: "SEC-OPS-03", kind: requirement, group: "SEC-OPS", roles: [processor], plan: [continuous, automated], title: "Security events are logged and someone is alerted", summary: "Authentication events, API and function errors and administrative changes are logged, kept for a defined period and protected from change. Alerts on errors, unusual sign-in activity and quota limits reach a named person.", evidence: "Log settings and retention of the BaaS, hosting and functions (auth logs, API logs, database audit logs such as pgAudit); log drain or export; alert rules and recipients; who can read the logs", question: "Which logs does the app keep, for how long, and who is alerted when something unusual happens?", refs: {asvs: ["V16.3.1", "V16.4.2"]}, maps: {gdpr: ["Art.32(1)(b)"], nis2: ["Art.21(2)(b)", "IR.3.2"], iso27001: ["A.8.15", "A.8.16"], soc2: ["CC7.2"]}}
  - {id: "SEC-OPS-04", kind: requirement, group: "SEC-OPS", roles: [processor, developer], plan: [continuous, automated], title: "Logs contain no secrets and no unnecessary personal data", summary: "Application and function logs do not record passwords, tokens, API keys or full request bodies with personal data. Personal data in logs are limited to what the purpose needs and are deleted with the logs after their retention period.", evidence: "Search of the code for logging of request bodies, user objects, tokens and headers; sample of production log entries; log retention setting; data scrubbing in the error tracker", question: "Could the app's logs contain passwords, tokens or personal data such as names, email addresses or message content?", refs: {asvs: ["V16.2.5"]}, maps: {gdpr: ["Art.5(1)(c)", "Art.5(1)(e)", "Art.32(1)(b)"], nis2: ["IR.3.2"], iso27001: ["A.8.15", "A.8.11"], soc2: ["C1.1"]}}
  - {id: "SEC-OPS-05", kind: requirement, group: "SEC-OPS", roles: [processor, developer], plan: [continuous, automated], title: "Production is separated from development and test", summary: "Development, preview and test environments use their own projects and databases, not production. Production personal data are not copied into them unless anonymized, and preview deployments and local setups hold no production keys.", evidence: "List of environments with their BaaS project and database; environment variables of preview and development deployments; source of seed and test data; any copies of production data and how they were anonymized", question: "Do development and test use a database separate from production, and does any production data reach them?", maps: {gdpr: ["Art.32(1)(b)", "Art.25(1)"], nis2: ["Art.21(2)(e)", "IR.6.2"], iso27001: ["A.8.31", "A.8.33"], soc2: ["CC8.1"]}}
  - {id: "SEC-OPS-06", kind: requirement, group: "SEC-OPS", roles: [processor, developer], plan: [continuous, automated], title: "Changes are reviewed and versioned before they reach production", summary: "The main branch is protected: changes arrive by pull request with review and passing checks, and nobody pushes or force-pushes to it directly. Schema and access policies live as migrations in the repository, and production is deployed from the reviewed branch rather than edited by hand or pushed straight from an AI builder.", evidence: "Branch protection or ruleset of the main branch (required reviews, status checks, no force push); merged pull requests with reviews; migrations folder compared with the live schema; deployment source settings on the hosting platform", question: "Is the main branch protected so that changes need a review, and are database changes made through versioned migrations?", maps: {gdpr: ["Art.32(1)(b)", "Art.25(1)"], nis2: ["Art.21(2)(e)", "IR.6.4", "IR.6.2"], iso27001: ["A.8.32", "A.8.25", "A.8.4"], soc2: ["CC8.1"]}}
  - {id: "SEC-OPS-07", kind: requirement, group: "SEC-OPS", roles: [processor], plan: [continuous, automated], title: "The hosting plan and limits support the agreed availability", summary: "The production project runs on a plan without automatic pausing or hard limits that would take the app offline, spend and quota limits are set deliberately, and the providers' uptime commitments match what was promised to the client.", evidence: "Plan of the BaaS and hosting projects; pause and inactivity behavior; quota, spend cap and usage settings; provider service level terms; uptime monitoring", question: "Is the production system on a plan with an uptime commitment, and could usage limits or inactivity pause it?", maps: {gdpr: ["Art.32(1)(b)"], nis2: ["Art.21(2)(c)"], iso27001: ["A.8.6", "A.8.14"], soc2: ["A1.1"]}}
  - {id: "SEC-OPS-08", kind: requirement, group: "SEC-OPS", roles: [processor], plan: [annual, manual], title: "Technical and organizational measures are documented", summary: "A current description of the technical and organizational measures (TOMs) for this app covers access control, encryption, backups, logging, incident handling, sub-processors and testing. It matches the configuration found and is attached to the data processing agreement.", evidence: "TOMs document with date and version; comparison with the configuration checked in this assessment; DPA annex referring to it", question: "Do you have a current TOMs document for this app, and does it describe what is actually configured?", maps: {gdpr: ["Art.32(1)", "Art.28(3)"], nis2: ["Art.21(1)", "IR.1.1"], iso27001: ["A.5.1", "A.5.37"], soc2: ["CC5.3"]}}
  - {id: "SEC-OPS-09", kind: requirement, group: "SEC-OPS", roles: [developer], plan: [annual, manual], title: "Security-relevant documentation was handed over", summary: "The client received what it needs to run the app safely: architecture and data flows, third-party services, environment variables and secrets to rotate, access policies, backup and restore steps, and known limitations or open findings.", evidence: "Handover documentation and its delivery date; README or runbook in the repository; list of open security findings handed over", question: "What documentation did you hand over to the client about the app's architecture, secrets, access rules and operation?", maps: {gdpr: ["Art.32(1)", "Art.25(1)"], nis2: ["Art.21(2)(e)", "IR.6.1"], iso27001: ["A.8.30", "A.5.37"], soc2: ["CC2.3"]}}

  # DP-INV Data inventory and purposes
  - {id: "DP-INV-01", kind: requirement, group: "DP-INV", roles: [processor, developer], plan: [annual, manual], title: "Personal data in the app are inventoried", summary: "A list names the tables, collections, buckets and external services that hold personal data, with the data categories, the data subjects (users, the client's customers, employees) and any special categories such as health data.", evidence: "Data inventory or data map; schema export compared with the inventory (columns with names, email addresses, phone numbers, addresses, free text, files); flags for special categories", question: "Which personal data does the app store, about whom, and where?", refs: {asvs: ["V14.1.1"]}, maps: {gdpr: ["Art.30(2)", "Art.32(2)", "Art.9"], nis2: ["IR.12.4", "IR.12.1"], iso27001: ["A.5.9", "A.5.12", "A.5.34"], soc2: ["C1.1"]}}
  - {id: "DP-INV-02", kind: requirement, group: "DP-INV", roles: [processor, developer], plan: [annual, manual], title: "The data model collects only what the purpose needs", summary: "Forms, tables and tracking collect only the fields the agreed features need, optional fields are marked as such, and no unused columns or spare copies of personal data are kept just in case.", evidence: "Sign-up and profile forms; schema compared with the features and the inventory; unused columns holding personal data; defaults for optional data", question: "Does the app collect any personal data that no feature actually uses?", maps: {gdpr: ["Art.5(1)(c)", "Art.25(2)"], iso27001: ["A.5.34"], soc2: ["P3.1"]}}
  - {id: "DP-INV-03", kind: requirement, group: "DP-INV", roles: [processor], plan: [annual, manual], title: "Data are processed only on the controller's documented instructions", summary: "The supplier uses the client's data only to run the app as instructed, not for its own analytics, demos, tests with real data or model training. Instructions given beyond the contract are recorded.", evidence: "DPA clause on instructions; record of additional instructions; check that no product analytics, demo, test or AI training uses client data; support procedures", question: "Do you use the client's data for anything other than running the app for them, such as demos, testing or your own analytics?", maps: {gdpr: ["Art.28(3)(a)", "Art.29"], iso27001: ["A.5.34"], soc2: ["P4.1"]}}
  - {id: "DP-INV-04", kind: requirement, group: "DP-INV", roles: [processor], plan: [annual, manual], title: "The processor keeps a record of processing activities", summary: "The supplier keeps a record under GDPR Art. 30(2) for the processing it carries out for this client: controller and contacts, categories of processing, transfers to third countries with their safeguards, and a general description of the security measures.", evidence: "Processor record of processing activities with the entry for this client; date of the last update", question: "Do you keep a record of processing activities as a processor, with an entry for this client?", maps: {gdpr: ["Art.30(2)"], iso27001: ["A.5.34"]}}

  # DP-SUP Sub-processors, contracts and transfers
  - {id: "DP-SUP-01", kind: requirement, group: "DP-SUP", roles: [processor, developer], plan: [continuous, automated], title: "Every third-party service the app uses is identified", summary: "All external services that receive or store data from the app are known from the code and configuration: hosting, BaaS, AI builder, AI APIs, email and SMS, payment, analytics, error tracking, maps, fonts and CDNs.", evidence: "SDKs and packages in the manifests; outbound domains in the code and in a network trace; environment variables naming third-party services; webhooks and integrations; the resulting service list with the data each one receives", question: "Which external services does the app send data to or store data with?", refs: {asvs: ["V13.1.1"]}, maps: {gdpr: ["Art.28(2)", "Art.30(2)"], nis2: ["Art.21(2)(d)", "IR.5.2"], iso27001: ["A.5.19", "A.5.21"], soc2: ["CC9.2"]}}
  - {id: "DP-SUP-02", kind: requirement, group: "DP-SUP", roles: [processor], plan: [annual, manual], title: "The controller has authorized the sub-processors", summary: "The list of sub-processors with service, data, location and transfer basis was given to the client and authorized under the DPA, it matches the services actually in use, and the client is told of changes in advance so it can object.", evidence: "Sub-processor list as sent to the client, with date; authorization clause in the DPA (specific or general); comparison with the service list from the code; change notices sent", question: "Has the client received and approved your list of sub-processors, and does it match what the app actually uses?", maps: {gdpr: ["Art.28(2)"], nis2: ["Art.21(2)(d)", "IR.5.2"], iso27001: ["A.5.19", "A.5.22"], soc2: ["CC9.2"]}}
  - {id: "DP-SUP-03", kind: requirement, group: "DP-SUP", roles: [processor], plan: [annual, manual], title: "Each sub-processor is bound by a data processing agreement", summary: "Every sub-processor, including the BaaS, hosting, email and AI providers, is bound by a data processing agreement with the same data protection obligations the supplier owes the client. The supplier has checked their security assurances, such as ISO 27001 certificates or SOC 2 reports.", evidence: "Signed or accepted DPA per sub-processor (often accepted in the account settings); certificates or audit reports on file; date of the last review", question: "Do you have a data processing agreement with each sub-processor, including the hosting, database and AI providers?", maps: {gdpr: ["Art.28(4)"], nis2: ["Art.21(2)(d)", "Art.21(3)", "IR.5.1"], iso27001: ["A.5.20", "A.5.19"], soc2: ["P6.4", "CC9.2"]}}
  - {id: "DP-SUP-04", kind: requirement, group: "DP-SUP", roles: [processor], plan: [annual, manual], title: "Transfers outside the EEA rest on a valid mechanism", summary: "For each sub-processor that processes or can access personal data outside the EEA, the transfer relies on an adequacy decision (for the US, the recipient's current Data Privacy Framework certification) or on standard contractual clauses, with a transfer impact assessment where needed.", evidence: "Transfer basis per sub-processor; Data Privacy Framework list entries checked, with date; standard contractual clauses with module and annexes; transfer impact assessments", question: "Which services process data outside the EU, and on what legal basis are those transfers made?", maps: {gdpr: ["Art.44", "Art.45", "Art.46(2)(c)"], iso27001: ["A.5.14", "A.5.31"]}}
  - {id: "DP-SUP-05", kind: requirement, group: "DP-SUP", roles: [processor], plan: [annual, manual], title: "A data processing agreement with the client covers the app", summary: "The supplier and the client have signed a data processing agreement covering this app with the content GDPR Art. 28(3) requires: subject matter, duration, data and data subjects, instructions, confidentiality, security, sub-processors, assistance, deletion or return, and audits.", evidence: "Signed DPA with the client and its annexes (TOMs, sub-processor list); check against the Art. 28(3) contents", question: "Is there a signed data processing agreement between you and the client for this app?", maps: {gdpr: ["Art.28(3)", "Art.28(3)(h)"], nis2: ["Art.21(2)(d)"], iso27001: ["A.5.20", "A.5.34"], soc2: ["P6.4"]}}
  - {id: "DP-SUP-06", kind: requirement, group: "DP-SUP", roles: [processor], plan: [annual, manual], title: "People with access are bound to confidentiality", summary: "Everyone at the supplier, including freelancers, who can access the client's personal data has committed to confidentiality in writing and has been instructed on how to handle the data.", evidence: "Signed confidentiality agreements or contract clauses for employees and freelancers; records of data protection instruction or training", question: "Has everyone on your side who can access the client's data signed a confidentiality commitment?", maps: {gdpr: ["Art.28(3)(b)", "Art.29", "Art.32(4)"], nis2: ["IR.10.1", "Art.21(2)(g)"], iso27001: ["A.6.6", "A.6.3"], soc2: ["CC2.2"]}}

  # DP-LIFE Retention, deletion and return
  - {id: "DP-LIFE-01", kind: requirement, group: "DP-LIFE", roles: [processor, developer], plan: [continuous, automated], title: "Retention periods are defined and enforced", summary: "Each category of personal data has a retention period agreed with the client, and the app deletes or anonymizes data automatically when it expires, for example inactive accounts, old messages, logs and uploaded files.", evidence: "Retention schedule per data category; scheduled jobs or expiry rules (pg_cron, scheduled functions, Firestore TTL policies, storage lifecycle rules) and their last runs; sample showing expired data removed", question: "How long does the app keep each kind of personal data, and is deletion after that period automated?", refs: {asvs: ["V14.2.7"]}, maps: {gdpr: ["Art.5(1)(e)", "Art.25(2)"], iso27001: ["A.8.10"], soc2: ["P4.2"]}}
  - {id: "DP-LIFE-02", kind: requirement, group: "DP-LIFE", roles: [processor, developer], plan: [annual, manual], title: "A person's data can be erased everywhere", summary: "When a user or other data subject is to be erased, the app removes their data from every place it is held: database rows including dependent rows, the auth user, stored files, search indexes and vector stores, and third-party services such as email lists and analytics.", evidence: "Account or data deletion function and what it touches; foreign keys with cascade or explicit cleanup; storage cleanup; calls to deletion APIs of third-party services; test deleting a test user and checking each store", question: "If a person asks to be deleted, can all their data be removed, including files and data held by third-party services?", maps: {gdpr: ["Art.17(1)", "Art.28(3)(e)"], iso27001: ["A.8.10"], soc2: ["P4.3"]}}
  - {id: "DP-LIFE-03", kind: requirement, group: "DP-LIFE", roles: [processor, developer], plan: [annual, manual], title: "A person's data can be exported", summary: "The client can obtain all personal data about one person in a structured, machine-readable format to answer access and portability requests, without the supplier having to work in the database by hand each time.", evidence: "Export function or documented query covering all tables and files for one person; sample export; procedure for passing requests from the client to the supplier", question: "Can the client get a complete export of one person's data when that person asks for it?", maps: {gdpr: ["Art.15(3)", "Art.20", "Art.28(3)(e)"], iso27001: ["A.5.34"], soc2: ["P5.1"]}}
  - {id: "DP-LIFE-04", kind: requirement, group: "DP-LIFE", roles: [processor], plan: [annual, manual], title: "Data are returned and deleted when the contract ends", summary: "At the end of the contract the supplier returns the data in a usable format if the client wants them, then deletes production data, backups, copies and access within a stated period and confirms the deletion in writing.", evidence: "Exit procedure or DPA clause with format and deadlines; provider backup retention after a project is deleted; deletion confirmation template or past confirmations", question: "What happens to the client's data when the contract ends: how is it returned, and when is everything deleted?", maps: {gdpr: ["Art.28(3)(g)"], iso27001: ["A.8.10"], soc2: ["C1.2", "P4.3"]}}
  - {id: "DP-LIFE-05", kind: requirement, group: "DP-LIFE", roles: [processor], plan: [annual, manual], title: "Deleted data also leave backups, logs and working copies", summary: "Data deleted from production disappear from backups and logs as those expire, within a documented period, and the supplier keeps no stray copies such as CSV exports, database dumps on laptops, screenshots or AI chat histories with client data.", evidence: "Backup and log retention periods; rule on local copies and exports; check of shared drives and developer machines for dumps; AI tool workspaces and chat histories", question: "Do you or your team keep copies of the client's data outside the production system, such as exports, dumps or files on laptops?", maps: {gdpr: ["Art.5(1)(e)", "Art.28(3)(g)", "Art.32(1)(b)"], nis2: ["IR.12.2"], iso27001: ["A.8.10", "A.8.12", "A.7.10"], soc2: ["C1.2", "P4.3"]}}

  # DP-INC Incidents and breach notice
  - {id: "DP-INC-01", kind: requirement, group: "DP-INC", roles: [processor], plan: [annual, manual], title: "Security incidents are handled and recorded", summary: "A short written procedure says how incidents affecting the app are detected, contained and resolved: who decides, how keys are rotated, sessions revoked and sign-ups stopped, and how incidents at sub-processors reach the supplier. Every incident and suspected breach is recorded with its handling.", evidence: "Incident response procedure or runbook with contacts; subscriptions to provider status pages and security notices; incident log with date, description, affected data and actions, including incidents that were not notified", question: "If the app were breached tomorrow, who would do what, and where are incidents recorded?", maps: {gdpr: ["Art.33(2)", "Art.33(5)"], nis2: ["Art.21(2)(b)", "IR.3.1", "IR.3.5", "IR.3.6"], iso27001: ["A.5.24", "A.5.26", "A.5.27"], soc2: ["CC7.3", "CC7.4", "P6.3"]}}
  - {id: "DP-INC-02", kind: requirement, group: "DP-INC", roles: [processor], plan: [event, manual], title: "The controller is notified of a breach without undue delay", summary: "The supplier tells the client without undue delay after becoming aware of a personal data breach, within the time agreed in the contract, with the facts the client needs for its own 72-hour notice to the supervisory authority and, where the client falls under NIS2, its 24-hour early warning.", evidence: "DPA clause on breach notice with deadline and channel; the client's contact for security notices; notice template (nature of the breach, data and people affected, likely consequences, measures taken); past notices with timestamps", question: "How fast and through which channel would you tell the client about a data breach, and is that set out in the contract?", maps: {gdpr: ["Art.33(2)"], nis2: ["Art.21(2)(d)", "IR.5.1", "Art.23(4)(a)"], iso27001: ["A.5.24", "A.5.26", "A.6.8"], soc2: ["P6.5", "CC2.3"]}}

  # DP-AI AI and automated processing (optional: only when the app uses AI)
  - {id: "DP-AI-01", kind: requirement, group: "DP-AI", roles: [processor, developer], optional: true, plan: [continuous, automated], title: "Data flows to AI services are documented", summary: "For each feature that calls an AI model it is documented which provider, model, endpoint and region receive which data, whether personal data are included, and whether outputs or embeddings are stored.", evidence: "Code calling AI APIs or AI gateways and the prompt construction; list of AI features with the data sent, provider, region and storage of outputs or embeddings", question: "Which AI services does the app call, and what data does each feature send to them?", refs: {asvs: ["V13.1.1"]}, maps: {gdpr: ["Art.30(2)", "Art.28(2)"], nis2: ["Art.21(2)(d)", "IR.5.2"], iso27001: ["A.5.19", "A.5.14"], soc2: ["CC9.2"]}}
  - {id: "DP-AI-02", kind: requirement, group: "DP-AI", roles: [processor], optional: true, plan: [annual, manual], title: "AI providers do not train on the data and keep it only briefly", summary: "AI services are used under business API terms where inputs and outputs are not used for training, with the shortest retention available (zero data retention or a short abuse-monitoring window) and EU processing where offered. Consumer AI accounts are not used for client data.", evidence: "Provider terms and organization settings for training use and data retention; zero data retention approval where used; data residency or regional endpoint configuration; files, threads or assistants stored at the provider and their deletion", question: "Do the AI providers use the app's data for training, and how long do they keep it?", maps: {gdpr: ["Art.28(4)", "Art.5(1)(e)", "Art.28(3)(a)"], nis2: ["Art.21(2)(d)"], iso27001: ["A.5.19", "A.5.23"], soc2: ["CC9.2", "P6.4"]}}
  - {id: "DP-AI-03", kind: requirement, group: "DP-AI", roles: [processor], optional: true, plan: [annual, manual], title: "AI providers are covered by a DPA and a transfer mechanism", summary: "Each AI provider that receives personal data is on the sub-processor list, is bound by a data processing agreement, and any transfer outside the EEA rests on an adequacy decision or standard contractual clauses.", evidence: "Provider DPA (often accepted in the account settings) with date; entry on the sub-processor list; Data Privacy Framework entry or standard contractual clauses", question: "Is there a data processing agreement with each AI provider, and is the provider on the sub-processor list given to the client?", maps: {gdpr: ["Art.28(2)", "Art.28(4)", "Art.45", "Art.46(2)(c)"], nis2: ["Art.21(2)(d)", "IR.5.1"], iso27001: ["A.5.20"], soc2: ["P6.4"]}}
  - {id: "DP-AI-04", kind: requirement, group: "DP-AI", roles: [processor, developer], optional: true, plan: [continuous, automated], title: "Only necessary personal data are sent to AI models", summary: "Prompts include only the fields a feature needs. Identifiers are removed or pseudonymized where the task allows, and special categories of data, secrets and other users' data are not sent unless the feature requires it and this is documented.", evidence: "Prompt construction code and sample prompts from logs or test runs; redaction or pseudonymization step; rules for special categories", question: "Do the prompts sent to AI services contain more personal data than the feature needs?", maps: {gdpr: ["Art.5(1)(c)", "Art.25(1)", "Art.32(1)(a)", "Art.9"], iso27001: ["A.8.11", "A.8.12"], soc2: ["P4.1", "C1.1"]}}
  - {id: "DP-AI-05", kind: requirement, group: "DP-AI", roles: [processor, developer], optional: true, plan: [continuous, automated], title: "AI calls run on the server with limits", summary: "AI providers are called from server code with keys held there, never from the browser. Calls are limited per user and for the app as a whole, so abuse cannot run up costs or exhaust quotas.", evidence: "Location of AI API keys and calls (server functions versus client bundle); per-user rate limits or quotas; spend limits at the provider; usage alerts", question: "Are AI services called only from your server, with per-user limits and a spending cap?", refs: {asvs: ["V13.3.1", "V2.4.1"]}, maps: {gdpr: ["Art.32(1)(b)"], nis2: ["Art.21(2)(e)"], iso27001: ["A.8.28", "A.8.6"], soc2: ["CC6.1", "A1.1"]}}
  - {id: "DP-AI-06", kind: requirement, group: "DP-AI", roles: [processor, developer], optional: true, plan: [continuous, automated], title: "Model output and AI tools cannot exceed the user's permissions", summary: "Model output is treated as untrusted: it is sanitized before display and never used directly in queries or commands. Tools and retrieval the model can use act with the signed-in user's permissions, not a service-role key, so a prompt injection cannot reach other users' data.", evidence: "Rendering of model output (Markdown and HTML sanitization); tool or function-calling definitions and the credentials they use; retrieval queries filtered by the user's access; prompt injection tests", question: "When the AI can call tools or read data, is it limited to what the signed-in user may access?", refs: {asvs: ["V8.3.3", "V1.3.5", "V3.2.2"]}, maps: {gdpr: ["Art.32(1)(b)", "Art.25(1)"], nis2: ["Art.21(2)(e)", "IR.6.2"], iso27001: ["A.8.28", "A.8.26"], soc2: ["CC6.1"]}}
  - {id: "DP-AI-07", kind: requirement, group: "DP-AI", roles: [processor, developer], optional: true, plan: [annual, manual], title: "Automated decisions about people are reviewed by a human", summary: "Where AI output leads to decisions with legal or similarly significant effects on a person (approval, rejection, pricing, ranking of applicants), a human reviews the decision, the person can contest it, and the logic is described for the client.", evidence: "Features where AI output affects individuals; human review step in the workflow; description of the logic provided to the client; how affected people can contest a decision", question: "Does the app use AI to make decisions about people, and if so, does a human review them?", maps: {gdpr: ["Art.22(1)", "Art.22(3)", "Art.35(1)"], iso27001: ["A.5.34"]}}
  - {id: "DP-AI-08", kind: requirement, group: "DP-AI", roles: [processor, developer], optional: true, plan: [continuous, automated], title: "AI builders and coding assistants have no access to production personal data", summary: "AI app builders and coding assistants are connected to development projects, not to production data, unless the client agreed and the tool is covered as a sub-processor. Their integrations hold the least privilege needed, and no production data are pasted into prompts.", evidence: "Integrations of the AI builder with the BaaS and the repository (connected projects, scopes, keys); workspace members; database or MCP connections of coding assistants; supplier rule on pasting data into AI tools", question: "Can the AI builder or the coding assistants you use read the production database or other production data?", maps: {gdpr: ["Art.28(2)", "Art.29", "Art.32(1)(b)"], nis2: ["Art.21(2)(d)", "Art.21(2)(i)"], iso27001: ["A.8.31", "A.5.23"], soc2: ["CC6.3", "CC9.2"]}}
