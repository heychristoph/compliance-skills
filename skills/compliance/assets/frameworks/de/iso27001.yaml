language: de
framework: {name: ISO/IEC 27001, title: "ISO/IEC 27001:2022 (mit Änderung 1:2024)"}

groups:
  "4": Kontext der Organisation
  "5": Führung
  "6": Planung
  "7": Unterstützung
  "8": Betrieb
  "9": Bewertung der Leistung
  "10": Verbesserung
  "A.5": "Anhang A: Organisatorische Maßnahmen"
  "A.6": "Anhang A: Personelle Maßnahmen"
  "A.7": "Anhang A: Physische Maßnahmen"
  "A.8": "Anhang A: Technologische Maßnahmen"

items:
  # 4 Kontext der Organisation
  "4.1": {title: "Verstehen der Organisation und ihres Kontextes", summary: "Die Organisation ermittelt die externen und internen Themen, die für ihren Zweck relevant sind und beeinflussen, ob das ISMS seine beabsichtigten Ergebnisse erreichen kann. Sie prüft außerdem, ob der Klimawandel ein relevantes Thema ist."}
  "4.2": {title: "Verstehen der Erfordernisse und Erwartungen interessierter Parteien", summary: "Die Organisation ermittelt, welche interessierten Parteien für das ISMS relevant sind, welche ihrer Anforderungen von Bedeutung sind (auch klimabezogene) und welche dieser Anforderungen das ISMS aufgreift."}
  "4.3": {title: "Festlegen des Anwendungsbereichs des ISMS", summary: "Grenzen und Anwendbarkeit des ISMS werden festgelegt. Dabei werden die ermittelten Themen, die Anforderungen interessierter Parteien sowie Schnittstellen und Abhängigkeiten zu anderen Organisationen berücksichtigt. Der Anwendungsbereich liegt als dokumentierte Information vor."}
  "4.4": {title: "Informationssicherheitsmanagementsystem", summary: "Die Organisation baut ein ISMS auf, setzt es um, erhält es aufrecht und verbessert es fortlaufend, einschließlich der dafür nötigen Prozesse und ihrer Wechselwirkungen."}
  # 5 Führung
  "5.1": {title: "Führung und Verpflichtung", summary: "Die oberste Leitung zeigt Führung: Politik und Ziele passen zur strategischen Ausrichtung, ISMS-Anforderungen sind in die Geschäftsprozesse eingebunden, Ressourcen stehen bereit, die Bedeutung der Informationssicherheit wird vermittelt, die beabsichtigten Ergebnisse werden erreicht, Personen werden angeleitet und unterstützt, und fortlaufende Verbesserung wird gefördert."}
  "5.2": {title: "Politik", summary: "Die oberste Leitung legt eine zum Zweck der Organisation passende Informationssicherheitspolitik fest. Sie enthält Informationssicherheitsziele oder einen Rahmen für deren Festlegung sowie die Verpflichtung, Anforderungen zu erfüllen und das ISMS fortlaufend zu verbessern. Die Politik ist dokumentiert, innerhalb der Organisation bekanntgemacht und interessierten Parteien soweit angemessen zugänglich."}
  "5.3": {title: "Rollen, Verantwortlichkeiten und Befugnisse in der Organisation", summary: "Die oberste Leitung weist die Verantwortlichkeiten und Befugnisse für informationssicherheitsrelevante Rollen zu und macht sie bekannt, auch dafür, dass das ISMS normkonform ist und dass über seine Leistung an die oberste Leitung berichtet wird."}
  # 6 Planung
  "6.1.1": {title: "Maßnahmen zum Umgang mit Risiken und Chancen: Allgemeines", summary: "Bei der Planung des ISMS berücksichtigt die Organisation ihre Themen und Anforderungen, bestimmt die zu behandelnden Risiken und Chancen und plant Maßnahmen dazu, deren Einbindung in die ISMS-Prozesse und die Bewertung ihrer Wirksamkeit."}
  "6.1.2": {title: "Informationssicherheitsrisikobeurteilung", summary: "Ein Prozess zur Risikobeurteilung wird festgelegt und angewendet: Er definiert Kriterien für die Risikoakzeptanz und für die Durchführung von Beurteilungen, liefert konsistente, gültige und vergleichbare Ergebnisse, identifiziert Risiken für Vertraulichkeit, Integrität und Verfügbarkeit samt Risikoeigentümern, analysiert Auswirkungen und Eintrittswahrscheinlichkeit und bewertet und priorisiert die Risiken. Der Prozess ist dokumentiert."}
  "6.1.3": {title: "Informationssicherheitsrisikobehandlung", summary: "Ein Prozess zur Risikobehandlung wählt Behandlungsoptionen aus und bestimmt die notwendigen Maßnahmen, gleicht sie mit Anhang A ab, damit keine übersehen wird, und erstellt eine Erklärung zur Anwendbarkeit. Diese nennt die notwendigen Maßnahmen, die Begründung für ihre Aufnahme, ihren Umsetzungsstand und die Begründung für jeden Ausschluss einer Maßnahme aus Anhang A. Ein Risikobehandlungsplan wird erstellt; die Risikoeigentümer genehmigen ihn und akzeptieren die Restrisiken."}
  "6.2": {title: "Informationssicherheitsziele und Planung zu deren Erreichung", summary: "Informationssicherheitsziele werden für relevante Funktionen und Ebenen festgelegt. Sie stehen im Einklang mit der Politik, sind soweit möglich messbar, werden überwacht, kommuniziert und aktualisiert. Die Planung legt fest, was getan wird, mit welchen Ressourcen, durch wen, bis wann und wie die Ergebnisse bewertet werden."}
  "6.3": {title: "Planung von Änderungen", summary: "Stellt die Organisation fest, dass das ISMS geändert werden muss, werden die Änderungen geplant durchgeführt."}
  # 7 Unterstützung
  "7.1": {title: "Ressourcen", summary: "Die Organisation bestimmt die für das ISMS benötigten Ressourcen und stellt sie bereit."}
  "7.2": {title: "Kompetenz", summary: "Die Kompetenz der Personen, deren Tätigkeit die Informationssicherheitsleistung beeinflusst, wird bestimmt und durch Ausbildung, Schulung oder Erfahrung sichergestellt. Fehlende Kompetenz wird durch Maßnahmen aufgebaut, deren Wirksamkeit bewertet wird. Nachweise der Kompetenz werden aufbewahrt."}
  "7.3": {title: "Bewusstsein", summary: "Personen, die unter der Aufsicht der Organisation arbeiten, kennen die Informationssicherheitspolitik, ihren Beitrag zur Wirksamkeit des ISMS und die Folgen, wenn ISMS-Anforderungen nicht erfüllt werden."}
  "7.4": {title: "Kommunikation", summary: "Die Organisation legt die für das ISMS relevante interne und externe Kommunikation fest: worüber, wann, mit wem und auf welche Weise kommuniziert wird."}
  "7.5.1": {title: "Dokumentierte Information: Allgemeines", summary: "Das ISMS umfasst die von der Norm geforderte dokumentierte Information sowie die dokumentierte Information, die die Organisation für die Wirksamkeit des ISMS als notwendig festlegt."}
  "7.5.2": {title: "Erstellen und Aktualisieren dokumentierter Information", summary: "Beim Erstellen oder Aktualisieren wird dokumentierte Information angemessen gekennzeichnet und beschrieben, in geeignetem Format und auf geeigneten Medien bereitgestellt sowie auf Eignung und Angemessenheit geprüft und freigegeben."}
  "7.5.3": {title: "Lenkung dokumentierter Information", summary: "Dokumentierte Information ist dort und dann verfügbar und geeignet, wo und wann sie gebraucht wird, und ist angemessen geschützt. Geregelt sind Verteilung, Zugriff, Auffinden, Speicherung, Erhaltung, Versionskontrolle, Aufbewahrung und Entsorgung, auch für dokumentierte Information externer Herkunft."}
  # 8 Betrieb
  "8.1": {title: "Betriebliche Planung und Steuerung", summary: "Die Prozesse, die zur Erfüllung der Anforderungen und zur Umsetzung der Maßnahmen aus Abschnitt 6 nötig sind, werden anhand von Kriterien geplant, umgesetzt und gesteuert. Dokumentierte Information belegt, dass sie wie geplant durchgeführt wurden. Geplante Änderungen werden gesteuert, unbeabsichtigte Änderungen überprüft, und für das ISMS relevante extern bereitgestellte Prozesse, Produkte oder Dienstleistungen werden gesteuert."}
  "8.2": {title: "Informationssicherheitsrisikobeurteilung", summary: "Risikobeurteilungen zur Informationssicherheit werden in geplanten Abständen durchgeführt sowie dann, wenn erhebliche Änderungen vorgesehen sind oder eintreten. Ihre Ergebnisse werden aufbewahrt."}
  "8.3": {title: "Informationssicherheitsrisikobehandlung", summary: "Der Risikobehandlungsplan für die Informationssicherheit wird umgesetzt, und die Ergebnisse der Risikobehandlung werden aufbewahrt."}
  # 9 Bewertung der Leistung
  "9.1": {title: "Überwachung, Messung, Analyse und Bewertung", summary: "Die Organisation legt fest, was überwacht und gemessen wird, mit welchen Methoden, wann und durch wen, und wann die Ergebnisse analysiert und bewertet werden. Nachweise der Ergebnisse werden aufbewahrt; die Informationssicherheitsleistung und die Wirksamkeit des ISMS werden bewertet."}
  "9.2.1": {title: "Internes Audit: Allgemeines", summary: "Interne Audits in geplanten Abständen zeigen, ob das ISMS die eigenen Anforderungen der Organisation und die Anforderungen der Norm erfüllt und ob es wirksam umgesetzt und aufrechterhalten wird."}
  "9.2.2": {title: "Internes Auditprogramm", summary: "Ein internes Auditprogramm legt Häufigkeit, Methoden, Verantwortlichkeiten, Planungsanforderungen und Berichterstattung fest und berücksichtigt dabei die Bedeutung der Prozesse und frühere Ergebnisse. Für jedes Audit sind Kriterien und Umfang festgelegt, die Auditoren werden so ausgewählt, dass Objektivität und Unparteilichkeit gewahrt sind, die Ergebnisse gehen an die zuständige Leitung, und Nachweise zu Programm und Ergebnissen werden aufbewahrt."}
  "9.3.1": {title: "Managementbewertung: Allgemeines", summary: "Die oberste Leitung bewertet das ISMS in geplanten Abständen, um seine fortdauernde Eignung, Angemessenheit und Wirksamkeit sicherzustellen."}
  "9.3.2": {title: "Eingaben für die Managementbewertung", summary: "Die Managementbewertung berücksichtigt den Stand der Maßnahmen aus früheren Bewertungen, Veränderungen bei externen und internen Themen, Veränderungen der Erfordernisse und Erwartungen interessierter Parteien, Rückmeldungen zur Informationssicherheitsleistung (einschließlich Nichtkonformitäten und Korrekturmaßnahmen, Ergebnisse von Überwachung und Messung, Auditergebnisse und Zielerreichung), Rückmeldungen interessierter Parteien, Ergebnisse der Risikobeurteilung und den Stand des Risikobehandlungsplans sowie Möglichkeiten zur fortlaufenden Verbesserung."}
  "9.3.3": {title: "Ergebnisse der Managementbewertung", summary: "Die Ergebnisse der Managementbewertung umfassen Entscheidungen zu Verbesserungsmöglichkeiten und zu notwendigen Änderungen am ISMS und werden als dokumentierte Information aufbewahrt."}
  # 10 Verbesserung
  "10.1": {title: "Fortlaufende Verbesserung", summary: "Die Organisation verbessert die Eignung, Angemessenheit und Wirksamkeit des ISMS fortlaufend."}
  "10.2": {title: "Nichtkonformität und Korrekturmaßnahmen", summary: "Tritt eine Nichtkonformität auf, reagiert die Organisation darauf, um sie zu beherrschen und zu korrigieren und mit den Folgen umzugehen. Sie prüft, ob die Ursachen beseitigt werden müssen, setzt die nötigen Maßnahmen um, überprüft deren Wirksamkeit und ändert bei Bedarf das ISMS. Art der Nichtkonformitäten, ergriffene Maßnahmen und deren Ergebnisse werden dokumentiert."}

  # Anhang A 5 Organisatorische Maßnahmen
  "A.5.1": {title: "Informationssicherheitsrichtlinien", summary: "Eine Informationssicherheitspolitik und themenspezifische Richtlinien werden festgelegt, von der Leitung genehmigt, veröffentlicht, dem relevanten Personal und interessierten Parteien bekanntgemacht und von ihnen zur Kenntnis genommen. Sie werden in geplanten Abständen und bei erheblichen Änderungen überprüft."}
  "A.5.2": {title: "Informationssicherheitsrollen und -verantwortlichkeiten", summary: "Rollen und Verantwortlichkeiten für die Informationssicherheit werden entsprechend den Bedürfnissen der Organisation festgelegt und zugewiesen."}
  "A.5.3": {title: "Aufgabentrennung", summary: "Miteinander unvereinbare Aufgaben und Verantwortungsbereiche werden getrennt."}
  "A.5.4": {title: "Verantwortlichkeiten der Leitung", summary: "Die Leitung verlangt von allen Beschäftigten, die Informationssicherheit gemäß der festgelegten Politik, den themenspezifischen Richtlinien und den Verfahren anzuwenden."}
  "A.5.5": {title: "Kontakt mit Behörden", summary: "Der Kontakt zu den zuständigen Behörden wird hergestellt und gepflegt."}
  "A.5.6": {title: "Kontakt mit speziellen Interessengruppen", summary: "Der Kontakt zu speziellen Interessengruppen, Fachforen zur Sicherheit und Berufsverbänden wird hergestellt und gepflegt."}
  "A.5.7": {title: "Informationen über die Bedrohungslage", summary: "Informationen über Bedrohungen der Informationssicherheit werden gesammelt und analysiert, um daraus Erkenntnisse über die Bedrohungslage (Threat Intelligence) zu gewinnen."}
  "A.5.8": {title: "Informationssicherheit im Projektmanagement", summary: "Informationssicherheit wird in das Projektmanagement eingebunden."}
  "A.5.9": {title: "Inventar der Informationen und anderer zugehöriger Werte", summary: "Ein Inventar der Informationen und anderer zugehöriger Werte einschließlich ihrer Eigentümer wird erstellt und gepflegt."}
  "A.5.10": {title: "Zulässiger Gebrauch von Informationen und anderen zugehörigen Werten", summary: "Regeln für den zulässigen Gebrauch und Verfahren für den Umgang mit Informationen und anderen zugehörigen Werten werden ermittelt, dokumentiert und umgesetzt."}
  "A.5.11": {title: "Rückgabe von Werten", summary: "Beschäftigte und andere interessierte Parteien geben alle Werte der Organisation in ihrem Besitz zurück, wenn sich ihr Beschäftigungsverhältnis, ihr Vertrag oder ihre Vereinbarung ändert oder endet."}
  "A.5.12": {title: "Klassifizierung von Informationen", summary: "Informationen werden nach den Sicherheitsbedürfnissen der Organisation klassifiziert, ausgehend von Vertraulichkeit, Integrität, Verfügbarkeit und den Anforderungen relevanter interessierter Parteien."}
  "A.5.13": {title: "Kennzeichnung von Informationen", summary: "Verfahren zur Kennzeichnung von Informationen werden passend zum Klassifizierungsschema entwickelt und umgesetzt."}
  "A.5.14": {title: "Informationsübertragung", summary: "Für jede Art von Einrichtung zur Informationsübertragung gibt es Regeln, Verfahren oder Vereinbarungen, sowohl innerhalb der Organisation als auch mit anderen Parteien."}
  "A.5.15": {title: "Zugangssteuerung", summary: "Regeln zur Steuerung des physischen und logischen Zugangs zu Informationen und anderen zugehörigen Werten werden auf Grundlage der geschäftlichen und der Informationssicherheitsanforderungen festgelegt und umgesetzt."}
  "A.5.16": {title: "Identitätsmanagement", summary: "Identitäten werden über ihren gesamten Lebenszyklus verwaltet."}
  "A.5.17": {title: "Authentisierungsinformationen", summary: "Vergabe und Verwaltung von Authentisierungsinformationen werden durch einen Managementprozess gesteuert, der auch die Beschäftigten zum sachgemäßen Umgang damit anleitet."}
  "A.5.18": {title: "Zugangsrechte", summary: "Zugangsrechte zu Informationen und anderen zugehörigen Werten werden gemäß der themenspezifischen Richtlinie und den Regeln zur Zugangssteuerung eingerichtet, überprüft, geändert und entzogen."}
  "A.5.19": {title: "Informationssicherheit in Lieferantenbeziehungen", summary: "Prozesse und Verfahren zur Beherrschung der Informationssicherheitsrisiken aus der Nutzung von Produkten oder Dienstleistungen von Lieferanten werden festgelegt und umgesetzt."}
  "A.5.20": {title: "Behandlung der Informationssicherheit in Lieferantenvereinbarungen", summary: "Die relevanten Informationssicherheitsanforderungen werden je nach Art der Lieferantenbeziehung festgelegt und mit jedem Lieferanten vereinbart."}
  "A.5.21": {title: "Management der Informationssicherheit in der IKT-Lieferkette", summary: "Prozesse und Verfahren zur Beherrschung der Informationssicherheitsrisiken in der Lieferkette für IKT-Produkte und -Dienstleistungen werden festgelegt und umgesetzt."}
  "A.5.22": {title: "Überwachung, Überprüfung und Änderungsmanagement von Lieferantendienstleistungen", summary: "Änderungen in den Informationssicherheitspraktiken und in der Leistungserbringung von Lieferanten werden regelmäßig überwacht, überprüft, bewertet und gesteuert."}
  "A.5.23": {title: "Informationssicherheit für die Nutzung von Cloud-Diensten", summary: "Prozesse für Beschaffung, Nutzung, Verwaltung und Beendigung von Cloud-Diensten werden im Einklang mit den Informationssicherheitsanforderungen der Organisation festgelegt."}
  "A.5.24": {title: "Planung und Vorbereitung des Managements von Informationssicherheitsvorfällen", summary: "Das Management von Informationssicherheitsvorfällen wird geplant und vorbereitet, indem Prozesse, Rollen und Verantwortlichkeiten festgelegt, eingerichtet und bekanntgemacht werden."}
  "A.5.25": {title: "Beurteilung von und Entscheidung über Informationssicherheitsereignisse", summary: "Informationssicherheitsereignisse werden beurteilt, und es wird entschieden, ob sie als Informationssicherheitsvorfälle einzustufen sind."}
  "A.5.26": {title: "Reaktion auf Informationssicherheitsvorfälle", summary: "Auf Informationssicherheitsvorfälle wird gemäß dokumentierten Verfahren reagiert."}
  "A.5.27": {title: "Erkenntnisse aus Informationssicherheitsvorfällen", summary: "Das aus Informationssicherheitsvorfällen gewonnene Wissen wird genutzt, um die Maßnahmen zu stärken und zu verbessern."}
  "A.5.28": {title: "Sammeln von Beweismaterial", summary: "Verfahren zur Identifizierung, Sammlung, Erfassung und Sicherung von Beweismaterial zu Informationssicherheitsereignissen werden festgelegt und umgesetzt."}
  "A.5.29": {title: "Informationssicherheit bei Störungen", summary: "Die Organisation plant, wie die Informationssicherheit während einer Störung auf angemessenem Niveau aufrechterhalten wird."}
  "A.5.30": {title: "IKT-Bereitschaft für Business Continuity", summary: "Die IKT-Bereitschaft wird auf Grundlage der Ziele zur Aufrechterhaltung des Geschäftsbetriebs und der IKT-Kontinuitätsanforderungen geplant, umgesetzt, aufrechterhalten und getestet."}
  "A.5.31": {title: "Rechtliche, gesetzliche, regulatorische und vertragliche Anforderungen", summary: "Die für die Informationssicherheit relevanten rechtlichen, gesetzlichen, regulatorischen und vertraglichen Anforderungen sowie das Vorgehen der Organisation zu ihrer Erfüllung werden ermittelt, dokumentiert und aktuell gehalten."}
  "A.5.32": {title: "Geistige Eigentumsrechte", summary: "Geeignete Verfahren zum Schutz geistiger Eigentumsrechte werden umgesetzt."}
  "A.5.33": {title: "Schutz von Aufzeichnungen", summary: "Aufzeichnungen werden vor Verlust, Zerstörung, Fälschung, unbefugtem Zugriff und unbefugter Weitergabe geschützt."}
  "A.5.34": {title: "Privatsphäre und Schutz personenbezogener Daten", summary: "Die Anforderungen an den Schutz der Privatsphäre und personenbezogener Daten aus geltenden Gesetzen, Vorschriften und Verträgen werden ermittelt und erfüllt."}
  "A.5.35": {title: "Unabhängige Überprüfung der Informationssicherheit", summary: "Das Vorgehen der Organisation beim Management der Informationssicherheit und dessen Umsetzung werden in geplanten Abständen oder bei erheblichen Änderungen unabhängig überprüft."}
  "A.5.36": {title: "Einhaltung von Richtlinien, Regeln und Normen für die Informationssicherheit", summary: "Die Einhaltung der Informationssicherheitspolitik, der themenspezifischen Richtlinien, Regeln und Normen wird regelmäßig überprüft."}
  "A.5.37": {title: "Dokumentierte Betriebsabläufe", summary: "Betriebsabläufe für informationsverarbeitende Einrichtungen werden dokumentiert und dem Personal, das sie benötigt, zur Verfügung gestellt."}
  # Anhang A 6 Personelle Maßnahmen
  "A.6.1": {title: "Sicherheitsüberprüfung", summary: "Bewerber werden vor ihrem Eintritt und danach fortlaufend überprüft. Die Überprüfung berücksichtigt geltende Gesetze, Vorschriften und ethische Grundsätze und steht im Verhältnis zu den geschäftlichen Anforderungen, der Klassifizierung der zugänglichen Informationen und den wahrgenommenen Risiken."}
  "A.6.2": {title: "Beschäftigungs- und Vertragsbedingungen", summary: "Arbeitsverträge legen die Verantwortlichkeiten der Beschäftigten und der Organisation für die Informationssicherheit fest."}
  "A.6.3": {title: "Informationssicherheitsbewusstsein, -ausbildung und -schulung", summary: "Beschäftigte und relevante interessierte Parteien erhalten angemessene Sensibilisierung, Ausbildung und Schulung zur Informationssicherheit sowie regelmäßige Aktualisierungen zu den für ihre Tätigkeit relevanten Richtlinien und Verfahren."}
  "A.6.4": {title: "Disziplinarverfahren", summary: "Ein formales Disziplinarverfahren wird festgelegt und bekanntgemacht, um gegen Beschäftigte und andere relevante interessierte Parteien vorzugehen, die gegen die Informationssicherheitspolitik verstoßen haben."}
  "A.6.5": {title: "Verantwortlichkeiten bei Beendigung oder Änderung der Beschäftigung", summary: "Informationssicherheitsverantwortlichkeiten und -pflichten, die nach Beendigung oder Änderung der Beschäftigung fortbestehen, werden festgelegt, durchgesetzt und den betroffenen Beschäftigten und anderen interessierten Parteien mitgeteilt."}
  "A.6.6": {title: "Vertraulichkeits- oder Geheimhaltungsvereinbarungen", summary: "Vertraulichkeits- oder Geheimhaltungsvereinbarungen, die den Schutzbedarf der Organisation für Informationen widerspiegeln, werden ermittelt, dokumentiert, regelmäßig überprüft und von den Beschäftigten und anderen relevanten interessierten Parteien unterzeichnet."}
  "A.6.7": {title: "Remote-Arbeit", summary: "Für Beschäftigte, die außerhalb der Räumlichkeiten der Organisation arbeiten, werden Sicherheitsmaßnahmen umgesetzt, um die dort abgerufenen, verarbeiteten oder gespeicherten Informationen zu schützen."}
  "A.6.8": {title: "Meldung von Informationssicherheitsereignissen", summary: "Ein Verfahren ermöglicht es den Beschäftigten, beobachtete oder vermutete Informationssicherheitsereignisse zeitnah über geeignete Kanäle zu melden."}
  # Anhang A 7 Physische Maßnahmen
  "A.7.1": {title: "Physische Sicherheitsperimeter", summary: "Sicherheitsperimeter werden festgelegt und genutzt, um Bereiche mit Informationen und anderen zugehörigen Werten zu schützen."}
  "A.7.2": {title: "Physischer Zutritt", summary: "Sicherheitsbereiche werden durch geeignete Zutrittskontrollen und Zugangspunkte geschützt."}
  "A.7.3": {title: "Sichern von Büros, Räumen und Einrichtungen", summary: "Die physische Sicherheit von Büros, Räumen und Einrichtungen wird geplant und umgesetzt."}
  "A.7.4": {title: "Physische Sicherheitsüberwachung", summary: "Die Räumlichkeiten werden laufend auf unbefugten physischen Zutritt überwacht."}
  "A.7.5": {title: "Schutz vor physischen und umweltbedingten Bedrohungen", summary: "Schutz vor physischen und umweltbedingten Bedrohungen, etwa Naturkatastrophen und anderen absichtlichen oder unabsichtlichen Bedrohungen der Infrastruktur, wird geplant und umgesetzt."}
  "A.7.6": {title: "Arbeiten in Sicherheitsbereichen", summary: "Sicherheitsmaßnahmen für das Arbeiten in Sicherheitsbereichen werden geplant und umgesetzt."}
  "A.7.7": {title: "Aufgeräumter Arbeitsplatz und Bildschirmsperren", summary: "Regeln für einen aufgeräumten Arbeitsplatz (Clean Desk) bei Papieren und Wechseldatenträgern sowie für leere Bildschirme (Clear Screen) bei informationsverarbeitenden Einrichtungen werden festgelegt und angemessen durchgesetzt."}
  "A.7.8": {title: "Platzierung und Schutz von Geräten und Betriebsmitteln", summary: "Geräte und Betriebsmittel werden sicher aufgestellt und geschützt."}
  "A.7.9": {title: "Sicherheit von Werten außerhalb der Räumlichkeiten", summary: "Werte außerhalb der Räumlichkeiten der Organisation werden geschützt."}
  "A.7.10": {title: "Speichermedien", summary: "Speichermedien werden über ihren Lebenszyklus von Beschaffung, Nutzung, Transport und Entsorgung gemäß dem Klassifizierungsschema und den Handhabungsanforderungen verwaltet."}
  "A.7.11": {title: "Versorgungseinrichtungen", summary: "Informationsverarbeitende Einrichtungen werden vor Stromausfällen und anderen Störungen durch Ausfälle der Versorgungseinrichtungen geschützt."}
  "A.7.12": {title: "Sicherheit der Verkabelung", summary: "Kabel für Strom, Daten oder unterstützende Informationsdienste werden vor Abhören, Störung oder Beschädigung geschützt."}
  "A.7.13": {title: "Instandhaltung von Geräten und Betriebsmitteln", summary: "Geräte und Betriebsmittel werden ordnungsgemäß instand gehalten, um Verfügbarkeit, Integrität und Vertraulichkeit der Informationen sicherzustellen."}
  "A.7.14": {title: "Sichere Entsorgung oder Wiederverwendung von Geräten und Betriebsmitteln", summary: "Geräte mit Speichermedien werden vor Entsorgung oder Wiederverwendung daraufhin geprüft, dass sensible Daten und lizenzierte Software entfernt oder sicher überschrieben wurden."}
  # Anhang A 8 Technologische Maßnahmen
  "A.8.1": {title: "Endgeräte der Benutzer", summary: "Informationen, die auf Endgeräten der Benutzer gespeichert, von ihnen verarbeitet oder über sie zugänglich sind, werden geschützt."}
  "A.8.2": {title: "Privilegierte Zugangsrechte", summary: "Vergabe und Nutzung privilegierter Zugangsrechte werden eingeschränkt und gesteuert."}
  "A.8.3": {title: "Einschränkung des Informationszugangs", summary: "Der Zugang zu Informationen und anderen zugehörigen Werten wird gemäß der themenspezifischen Richtlinie zur Zugangssteuerung eingeschränkt."}
  "A.8.4": {title: "Zugriff auf den Quellcode", summary: "Lese- und Schreibzugriff auf Quellcode, Entwicklungswerkzeuge und Softwarebibliotheken wird angemessen gesteuert."}
  "A.8.5": {title: "Sichere Authentisierung", summary: "Sichere Authentisierungstechnologien und -verfahren werden auf Grundlage der Zugangsbeschränkungen und der themenspezifischen Richtlinie zur Zugangssteuerung umgesetzt."}
  "A.8.6": {title: "Kapazitätsmanagement", summary: "Die Nutzung von Ressourcen wird überwacht und an den aktuellen und erwarteten Kapazitätsbedarf angepasst."}
  "A.8.7": {title: "Schutz gegen Schadsoftware", summary: "Schutz gegen Schadsoftware wird umgesetzt und durch angemessene Sensibilisierung der Benutzer unterstützt."}
  "A.8.8": {title: "Handhabung technischer Schwachstellen", summary: "Informationen über technische Schwachstellen der eingesetzten Informationssysteme werden beschafft, die Gefährdung der Organisation wird bewertet, und geeignete Maßnahmen werden ergriffen."}
  "A.8.9": {title: "Konfigurationsmanagement", summary: "Konfigurationen von Hardware, Software, Diensten und Netzwerken, einschließlich der Sicherheitskonfigurationen, werden festgelegt, dokumentiert, umgesetzt, überwacht und überprüft."}
  "A.8.10": {title: "Löschung von Informationen", summary: "Informationen in Informationssystemen, auf Geräten oder anderen Speichermedien werden gelöscht, sobald sie nicht mehr benötigt werden."}
  "A.8.11": {title: "Datenmaskierung", summary: "Datenmaskierung wird gemäß der themenspezifischen Richtlinie zur Zugangssteuerung, weiteren zugehörigen Richtlinien und den geschäftlichen Anforderungen eingesetzt, unter Berücksichtigung der geltenden Rechtsvorschriften."}
  "A.8.12": {title: "Verhinderung von Datenabfluss", summary: "Maßnahmen gegen Datenabfluss (Data Leakage Prevention) werden auf Systeme, Netzwerke und andere Geräte angewendet, die sensible Informationen verarbeiten, speichern oder übertragen."}
  "A.8.13": {title: "Datensicherung", summary: "Sicherungskopien von Informationen, Software und Systemen werden gemäß der vereinbarten themenspezifischen Richtlinie zur Datensicherung vorgehalten und regelmäßig getestet."}
  "A.8.14": {title: "Redundanz von informationsverarbeitenden Einrichtungen", summary: "Informationsverarbeitende Einrichtungen werden mit so viel Redundanz umgesetzt, dass die Verfügbarkeitsanforderungen erfüllt werden."}
  "A.8.15": {title: "Protokollierung", summary: "Protokolle, die Aktivitäten, Ausnahmen, Fehler und andere relevante Ereignisse aufzeichnen, werden erzeugt, gespeichert, geschützt und ausgewertet."}
  "A.8.16": {title: "Überwachung von Aktivitäten", summary: "Netzwerke, Systeme und Anwendungen werden auf anomales Verhalten überwacht, und es werden geeignete Maßnahmen ergriffen, um mögliche Informationssicherheitsvorfälle zu bewerten."}
  "A.8.17": {title: "Uhrensynchronisation", summary: "Die Uhren der informationsverarbeitenden Systeme werden mit freigegebenen Zeitquellen synchronisiert."}
  "A.8.18": {title: "Gebrauch von privilegierten Hilfsprogrammen", summary: "Die Nutzung von Hilfsprogrammen, die System- und Anwendungskontrollen umgehen können, wird eingeschränkt und streng kontrolliert."}
  "A.8.19": {title: "Installation von Software auf Systemen im Betrieb", summary: "Verfahren und Maßnahmen werden umgesetzt, um die Installation von Software auf Systemen im Betrieb sicher zu steuern."}
  "A.8.20": {title: "Netzwerksicherheit", summary: "Netzwerke und Netzwerkgeräte werden gesichert, verwaltet und gesteuert, um Informationen in Systemen und Anwendungen zu schützen."}
  "A.8.21": {title: "Sicherheit von Netzwerkdiensten", summary: "Sicherheitsmechanismen, Service-Level und Dienstanforderungen von Netzwerkdiensten werden ermittelt, umgesetzt und überwacht."}
  "A.8.22": {title: "Trennung von Netzwerken", summary: "Gruppen von Informationsdiensten, Benutzern und Informationssystemen werden in den Netzwerken der Organisation voneinander getrennt."}
  "A.8.23": {title: "Webfilterung", summary: "Der Zugriff auf externe Websites wird gesteuert, um die Gefährdung durch schädliche Inhalte zu verringern."}
  "A.8.24": {title: "Verwendung von Kryptographie", summary: "Regeln für den wirksamen Einsatz von Kryptographie einschließlich der Verwaltung kryptographischer Schlüssel werden festgelegt und umgesetzt."}
  "A.8.25": {title: "Sicherer Entwicklungslebenszyklus", summary: "Regeln für die sichere Entwicklung von Software und Systemen werden festgelegt und angewendet."}
  "A.8.26": {title: "Anforderungen an die Anwendungssicherheit", summary: "Bei Entwicklung oder Beschaffung von Anwendungen werden Informationssicherheitsanforderungen ermittelt, spezifiziert und genehmigt."}
  "A.8.27": {title: "Grundsätze für sichere Systemarchitektur und Systementwicklung", summary: "Grundsätze für die Entwicklung sicherer Systeme werden festgelegt, dokumentiert, aktuell gehalten und bei allen Entwicklungstätigkeiten für Informationssysteme angewendet."}
  "A.8.28": {title: "Sichere Programmierung", summary: "Bei der Softwareentwicklung werden Grundsätze der sicheren Programmierung angewendet."}
  "A.8.29": {title: "Sicherheitsprüfungen bei Entwicklung und Abnahme", summary: "Prozesse für Sicherheitsprüfungen werden im Entwicklungslebenszyklus festgelegt und umgesetzt."}
  "A.8.30": {title: "Ausgelagerte Entwicklung", summary: "Die Organisation steuert, überwacht und überprüft die Tätigkeiten im Zusammenhang mit ausgelagerter Systementwicklung."}
  "A.8.31": {title: "Trennung von Entwicklungs-, Test- und Produktionsumgebungen", summary: "Entwicklungs-, Test- und Produktionsumgebungen werden voneinander getrennt und gesichert."}
  "A.8.32": {title: "Änderungsmanagement", summary: "Änderungen an informationsverarbeitenden Einrichtungen und Informationssystemen unterliegen Verfahren des Änderungsmanagements."}
  "A.8.33": {title: "Testdaten", summary: "Testdaten werden angemessen ausgewählt, geschützt und verwaltet."}
  "A.8.34": {title: "Schutz der Informationssysteme während Audittests", summary: "Audittests und andere Prüftätigkeiten an Systemen im Betrieb werden zwischen dem Prüfer und der zuständigen Leitung geplant und abgestimmt."}
