  title: "Beschreibung des Systems „{system}“ von {org}"
  unapproved: >-
    Diese Systembeschreibung ist nicht als vom Management genehmigt gekennzeichnet.
  omitted: >-
    Eine Systembeschreibung für die Leser dieses Berichts wurde nicht bereitgestellt. Aus dem Compliance-System
    übernommener Text ist Prüfungsnachweis und wird hier nicht wiedergegeben.
  headings:
    overview: "Überblick über das Unternehmen"
    services: "Erbrachte Dienstleistungen"
    commitments: "Wesentliche Leistungsverpflichtungen und Systemanforderungen"
    components: "Komponenten des Systems"
    boundaries: "Systemgrenzen"
    subservice_organizations: "Subdienstleister und komplementäre Kontrollen bei Subdienstleistern"
    cuecs: "Komplementäre Kontrollen bei Nutzerunternehmen"
    incidents: "Systemvorfälle"
    changes: "Wesentliche Änderungen im Berichtszeitraum"
  component_names:
    infrastructure: "Infrastruktur"
    software: "Software"
    people: "Personal"
    procedures: "Verfahren"
    data: "Daten"

section4:
  title: "Trust Services Criteria, zugehörige Kontrollen und Kontrolltests"
  intro:
    type2: >-
      Dieser Abschnitt führt für jedes anwendbare Kriterium der Trust Services Criteria die von {org}
      eingerichteten Kontrollen, die von diesem KI-Audit {period} durchgeführten Tests und deren Ergebnisse auf.
      Die Kriterien und die darauf ausgerichteten Kontrollen liegen in der Verantwortung der
      Dienstleistungsorganisation; die Tests und Ergebnisse liegen in der Verantwortung dieses KI-Audits.
    type1: >-
      Dieser Abschnitt führt für jedes anwendbare Kriterium der Trust Services Criteria die von {org} {period}
      eingerichteten Kontrollen auf. Die Kriterien und Kontrollen liegen in der Verantwortung der
      Dienstleistungsorganisation. Dieses KI-Audit hat die Angemessenheit ihrer Ausgestaltung beurteilt und
      bestätigt, dass sie eingerichtet waren; die Wirksamkeit wurde nicht getestet.
  methods: >-
    Die Tests stützten sich auf eine oder mehrere der folgenden Methoden. Befragung: Gespräche mit geeigneten
    Mitarbeitern über die Kontrolle. Beobachtung: Beobachtung der Durchführung der Kontrolle. Einsichtnahme:
    Prüfung von Dokumenten, Aufzeichnungen und Systemkonfigurationen auf Nachweise, dass die Kontrolle durchgeführt
    wurde. Nachvollzug: unabhängige erneute Durchführung der Kontrolle und Abgleich der Ergebnisse. Eine Befragung
    allein wurde in keinem Fall als ausreichend angesehen. Wurde eine Kontrolle mehrfach durchgeführt, wurde eine
    Stichprobe zufällig mit einem dokumentierten Startwert (Seed) gezogen; die Stichprobenumfänge richteten sich
    nach der Häufigkeit der Kontrolle und dem Umfang der Grundgesamtheit.
  columns: ["Kontrolle", "Kontrollaktivität", "Durchgeführte Tests", "Ergebnisse"]
  columns_type1: ["Kontrolle", "Kontrollaktivität"]
  no_exceptions: "Keine Abweichungen festgestellt."
  not_tested: "Nicht getestet. {reason}"
  design_deficiency: "Kontrolle nicht angemessen ausgestaltet. {reason}"

section5:
  title: "Sonstige Informationen, bereitgestellt von {org}"
  intro: >-
    Die Informationen in diesem Abschnitt werden von {org} als zusätzliche Informationen dargestellt und sind
    nicht Bestandteil der Beschreibung. Sie waren nicht Gegenstand der in diesem KI-Audit durchgeführten
    Prüfungshandlungen; dementsprechend trifft dieses KI-Audit keine Aussage dazu.
  none: "Das Management hat keine zusätzlichen Informationen bereitgestellt."

