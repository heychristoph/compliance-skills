language: de
framework: {name: NIS2, title: "NIS-2-Richtlinie", reference: "Richtlinie (EU) 2022/2555"}

note: "NIS-2 ist eine Richtlinie. Die Mitgliedstaaten setzen sie in nationales Recht um und ergänzen nationale Einzelheiten: zuständige Behörde, Meldeweg, Registrierungsverfahren, Fristen, Begriffe und teils strengere Regeln. Dieser Katalog folgt der Richtlinie. Wesentliche nationale Abweichungen stehen im Block national am Ende der Basisdatei. Das nationale Recht jedes Mitgliedstaats, dessen Zuständigkeit greift (Art. 26), ist zu prüfen."

groups:
  "SCOPE": Anwendungsbereich und Einstufung
  "GOV": Governance und Leitungsorgane
  "RM": Risikomanagementmaßnahmen im Bereich der Cybersicherheit
  "REP": Berichtspflichten
  "REG": Registrierung und Aufsicht
  "IR": "Durchführungsverordnung (EU) 2024/2690"

items:
  # Anwendungsbereich
  "Art.3": {title: "Wesentliche und wichtige Einrichtungen", summary: "Die Einrichtung hat festgestellt, ob sie eine wesentliche oder wichtige Einrichtung ist, anhand von Sektor und Art der Einrichtung nach Anhang I oder II, ihrer Größe und einer etwaigen Bestimmung durch einen Mitgliedstaat. Die Einstufung ist dokumentiert und wird bei Änderungen des Geschäfts neu bewertet.", evidence: "Einstufungsvermerk mit Sektor, Teilsektor und Art der Einrichtung; Größenberechnung (Mitarbeiterzahl, Umsatz, Bilanzsumme, verbundene und Partnerunternehmen); etwaiger Bescheid der Behörde; Datum der letzten Neubewertung"}
  "Art.26": {title: "Zuständigkeit und Territorialität", summary: "Die Einrichtung weiß, welcher Mitgliedstaat zuständig ist: in der Regel der Staat der Niederlassung, bei digitalen Anbietern der Staat der Hauptniederlassung, bei öffentlichen elektronischen Kommunikationsdiensten der Staat der Diensterbringung. Ein digitaler Anbieter ohne Niederlassung in der Union hat einen Vertreter in der Union benannt.", evidence: "Zuständigkeitsanalyse mit Niederlassungen und Ort der Entscheidungen über Risikomanagementmaßnahmen; Liste der Mitgliedstaaten, in denen Dienste erbracht werden; ggf. Benennung des Vertreters"}

  # Governance
  "Art.20(1)": {title: "Billigung, Überwachung und Verantwortlichkeit der Leitungsorgane", summary: "Die Leitungsorgane billigen die nach Artikel 21 ergriffenen Risikomanagementmaßnahmen im Bereich der Cybersicherheit und überwachen ihre Umsetzung. Sie können für Verstöße gegen Artikel 21 verantwortlich gemacht werden; Billigung und Überwachung müssen daher nachweisbar sein.", evidence: "Beschluss der Geschäftsleitung zur Billigung der Maßnahmen und des Sicherheitskonzepts; Protokolle regelmäßiger Sicherheitsberichte an die Leitungsorgane; dokumentierte Risikoakzeptanz; Zuweisung von Verantwortlichkeiten"}
  "Art.20(2)": {title: "Schulung der Mitglieder der Leitungsorgane", summary: "Die Mitglieder der Leitungsorgane nehmen an Schulungen teil, um ausreichende Kenntnisse und Fähigkeiten zur Erkennung und Bewertung von Risiken sowie von Managementpraktiken im Bereich der Cybersicherheit und deren Auswirkungen auf die Dienste der Einrichtung zu erwerben. Den Mitarbeitern werden regelmäßig entsprechende Schulungen angeboten.", evidence: "Schulungsnachweise und Teilnahmebestätigungen je Mitglied der Leitungsorgane; Inhalte und Termine; Schulungsprogramm und Teilnahmequoten der Mitarbeiter"}

  # Risikomanagementmaßnahmen
  "Art.21(1)": {title: "Geeignete und verhältnismäßige Maßnahmen", summary: "Die Einrichtung ergreift geeignete und verhältnismäßige technische, operative und organisatorische Maßnahmen, um die Risiken für die Sicherheit ihrer Netz- und Informationssysteme zu beherrschen und die Auswirkungen von Sicherheitsvorfällen zu verhindern oder möglichst gering zu halten. Maßgeblich sind Stand der Technik, einschlägige Normen, Umsetzungskosten, Risikoexposition, Größe sowie Wahrscheinlichkeit und Schwere von Sicherheitsvorfällen.", evidence: "Rahmenwerk für Informationssicherheit oder ISMS-Geltungsbereich; Risikobewertung als Grundlage der Maßnahmenauswahl; Zuordnung der Maßnahmen zu Art. 21 Abs. 2; angewandte Normen (z. B. ISO/IEC 27001)"}
  "Art.21(2)(a)": {title: "Konzepte in Bezug auf die Risikoanalyse und Sicherheit für Informationssysteme", summary: "Die Einrichtung hat ein gebilligtes Konzept für die Sicherheit der Informationssysteme und ein dokumentiertes Vorgehen zur Risikoanalyse auf Grundlage eines gefahrenübergreifenden Ansatzes, der auch die physische Umwelt der Systeme einschließt.", evidence: "Sicherheitskonzept mit Datum der Billigung; Methodik des Risikomanagements; aktuelles Risikoregister und Risikobehandlungsplan; Nachweise der Überprüfung"}
  "Art.21(2)(b)": {title: "Bewältigung von Sicherheitsvorfällen", summary: "Die Einrichtung erkennt, analysiert, begrenzt und bewältigt Sicherheitsvorfälle und stellt den Betrieb wieder her, nach einem dokumentierten Verfahren.", evidence: "Konzept und Playbooks zur Bewältigung von Sicherheitsvorfällen; Vorfallsprotokoll oder Ticket-Historie; Bereitschafts- und Eskalationslisten; Test- oder Übungsberichte"}
  "Art.21(2)(c)": {title: "Aufrechterhaltung des Betriebs, wie Backup-Management und Wiederherstellung nach einem Notfall, und Krisenmanagement", summary: "Die Einrichtung stellt die Aufrechterhaltung des Betriebs sicher, einschließlich Backup-Management und Wiederherstellung nach einem Notfall, und verfügt über ein Krisenmanagement.", evidence: "Business-Impact-Analyse; Notfall- und Wiederherstellungspläne; Backup-Konzept und Ergebnisse von Wiederherstellungstests; Krisenmanagementplan und Übungsberichte"}
  "Art.21(2)(d)": {title: "Sicherheit der Lieferkette", summary: "Die Einrichtung beherrscht sicherheitsbezogene Risiken in den Beziehungen zu ihren unmittelbaren Anbietern und Diensteanbietern, einschließlich Sicherheitsanforderungen in Verträgen.", evidence: "Konzept für die Sicherheit der Lieferkette; Verzeichnis der unmittelbaren Anbieter und Diensteanbieter; Risikobewertungen der Anbieter; Vertragsklauseln zu Sicherheit, Meldung von Sicherheitsvorfällen und Auditrechten"}
  "Art.21(2)(e)": {title: "Sicherheitsmaßnahmen bei Erwerb, Entwicklung und Wartung von Netz- und Informationssystemen, einschließlich Management und Offenlegung von Schwachstellen", summary: "Sicherheit ist in Erwerb, Entwicklung und Wartung der Netz- und Informationssysteme verankert; Schwachstellen werden nach einem festgelegten Verfahren behandelt und offengelegt.", evidence: "Anforderungen an sichere Entwicklung und Beschaffung; Nachweise des Änderungsmanagements; Verfahren zum Schwachstellenmanagement und Scan-Ergebnisse; Patch-Nachweise; Richtlinie zur koordinierten Offenlegung von Schwachstellen"}
  "Art.21(2)(f)": {title: "Konzepte und Verfahren zur Bewertung der Wirksamkeit von Risikomanagementmaßnahmen im Bereich der Cybersicherheit", summary: "Die Einrichtung hat Konzepte und Verfahren, um zu bewerten, ob ihre Risikomanagementmaßnahmen im Bereich der Cybersicherheit wirksam sind.", evidence: "Sicherheitskennzahlen oder KPI-Berichte; interne Auditberichte; unabhängige Überprüfungen oder Penetrationstestberichte; Protokolle der Managementbewertung; verfolgte Korrekturmaßnahmen"}
  "Art.21(2)(g)": {title: "Grundlegende Verfahren im Bereich der Cyberhygiene und Schulungen im Bereich der Cybersicherheit", summary: "Die Mitarbeiter wenden grundlegende Verfahren der Cyberhygiene an und erhalten Sensibilisierung und Schulungen im Bereich der Cybersicherheit passend zu ihrer Rolle.", evidence: "Sensibilisierungsprogramm und Materialien; Teilnahmenachweise; Ergebnisse von Phishing-Simulationen; Grundregeln der Cyberhygiene (z. B. Passwort-, Update- und Geräteregeln)"}
  "Art.21(2)(h)": {title: "Konzepte und Verfahren für den Einsatz von Kryptografie und gegebenenfalls Verschlüsselung", summary: "Die Einrichtung hat Konzepte und Verfahren für den Einsatz von Kryptografie und gegebenenfalls Verschlüsselung.", evidence: "Kryptografiekonzept mit zugelassenen Algorithmen und Schlüssellängen; Verfahren zur Schlüsselverwaltung; Konfigurationsnachweise zur Verschlüsselung gespeicherter und übertragener Daten; Zertifikatsinventar"}
  "Art.21(2)(i)": {title: "Sicherheit des Personals, Konzepte für die Zugriffskontrolle und Management von Anlagen", summary: "Die Einrichtung setzt Maßnahmen zur Sicherheit des Personals, Konzepte für die Zugriffskontrolle und ein Management von Anlagen um.", evidence: "Verfahren für Eintritt, Austritt und Zuverlässigkeitsüberprüfung; Zugriffskontrollkonzept; Überprüfungen der Benutzerrechte; Nachweise zu Eintritt, Wechsel und Austritt; Inventar der Anlagen und Werte"}
  "Art.21(2)(j)": {title: "Multi-Faktor-Authentifizierung, gesicherte Kommunikation und gesicherte Notfallkommunikationssysteme", summary: "Soweit angemessen nutzt die Einrichtung Lösungen zur Multi-Faktor-Authentifizierung oder kontinuierlichen Authentifizierung, gesicherte Sprach-, Video- und Textkommunikation sowie gesicherte Notfallkommunikationssysteme.", evidence: "MFA-Erzwingung und Abdeckungsbericht des Identitätsanbieters; Ausnahmeliste; zugelassene sichere Kommunikationswerkzeuge; Notfallkommunikationsplan und Testnachweis"}
  "Art.21(3)": {title: "Berücksichtigungen zur Lieferkette", summary: "Bei der Wahl der Maßnahmen zur Sicherheit der Lieferkette berücksichtigt die Einrichtung die spezifischen Schwachstellen jedes unmittelbaren Anbieters, die Gesamtqualität der Produkte und der Cybersicherheitspraxis ihrer Anbieter einschließlich der Sicherheit ihrer Entwicklungsprozesse sowie die Ergebnisse koordinierter Risikobewertungen kritischer Lieferketten nach Artikel 22 Absatz 1.", evidence: "Anbieterbewertungen zu Schwachstellen, Produktqualität und sicherer Entwicklung; Zertifikate oder Auditberichte der Anbieter; Nachweis, wie koordinierte Risikobewertungen der Union berücksichtigt wurden"}
  "Art.21(4)": {title: "Korrekturmaßnahmen", summary: "Stellt die Einrichtung fest, dass sie den Maßnahmen nach Artikel 21 Absatz 2 nicht nachkommt, ergreift sie unverzüglich alle erforderlichen, angemessenen und verhältnismäßigen Korrekturmaßnahmen.", evidence: "Register der Abweichungen und Feststellungen; Korrekturmaßnahmenpläne mit Verantwortlichen und Fristen; Abschlussnachweise; Berichte an die Leitung über überfällige Maßnahmen"}
  "Art.24": {title: "Nutzung der europäischen Schemata für die Cybersicherheitszertifizierung", summary: "Soweit ein Mitgliedstaat oder ein delegierter Rechtsakt der Kommission es verlangt, nutzt die Einrichtung IKT-Produkte, -Dienste und -Prozesse, die nach europäischen Schemata für die Cybersicherheitszertifizierung (Verordnung (EU) 2019/881) zertifiziert sind. Die Mitgliedstaaten fördern zudem die Nutzung qualifizierter Vertrauensdienste.", evidence: "Prüfung, ob eine nationale oder delegierte Zertifizierungspflicht greift; Inventar der betroffenen IKT-Produkte und -Dienste; Zertifikate nach dem einschlägigen EU-Schema (z. B. EUCC)"}

  # Berichtspflichten
  "Art.23(3)": {title: "Feststellung erheblicher Sicherheitsvorfälle", summary: "Die Einrichtung bewertet jeden Sicherheitsvorfall anhand der Kriterien für Erheblichkeit: schwerwiegende Betriebsstörungen der Dienste oder finanzielle Verluste für die Einrichtung oder erhebliche materielle oder immaterielle Schäden bei anderen. Digitale Anbieter wenden die Kriterien der Artikel 3 bis 14 der Durchführungsverordnung (EU) 2024/2690 an.", evidence: "Klassifizierungsverfahren mit Erheblichkeitskriterien und Schwellenwerten; dokumentierte Einstufung je Sicherheitsvorfall; vierteljährliche Bewertung wiederkehrender Sicherheitsvorfälle bei digitalen Anbietern"}
  "Art.23(4)(a)": {title: "Frühwarnung innerhalb von 24 Stunden", summary: "Unverzüglich, in jedem Fall aber innerhalb von 24 Stunden nach Kenntnisnahme eines erheblichen Sicherheitsvorfalls, übermittelt die Einrichtung dem CSIRT oder der zuständigen Behörde eine Frühwarnung, gegebenenfalls mit Angabe, ob rechtswidrige oder böswillige Handlungen vermutet werden oder grenzüberschreitende Auswirkungen möglich sind.", evidence: "Meldeverfahren mit Kontakten und Meldeweg der Behörde; Zeitstempel von Kenntnisnahme und Übermittlung; übermittelte Frühwarnungen; Nachweise von Meldeübungen"}
  "Art.23(4)(b)": {title: "Meldung über den Sicherheitsvorfall innerhalb von 72 Stunden", summary: "Unverzüglich, in jedem Fall aber innerhalb von 72 Stunden nach Kenntnisnahme eines erheblichen Sicherheitsvorfalls, übermittelt die Einrichtung eine Meldung über den Sicherheitsvorfall, die die Frühwarnung aktualisiert und eine erste Bewertung von Schweregrad und Auswirkungen sowie gegebenenfalls die Kompromittierungsindikatoren enthält. Vertrauensdiensteanbieter melden Sicherheitsvorfälle mit Auswirkungen auf ihre Vertrauensdienste innerhalb von 24 Stunden.", evidence: "Übermittelte Meldungen mit Zeitstempeln; erste Bewertung von Schweregrad und Auswirkungen; übermittelte Kompromittierungsindikatoren"}
  "Art.23(4)(c)": {title: "Zwischenbericht auf Ersuchen", summary: "Auf Ersuchen des CSIRT oder der zuständigen Behörde legt die Einrichtung einen Zwischenbericht über relevante Statusaktualisierungen vor.", evidence: "Ersuchen der Behörde und die darauf übermittelten Zwischenberichte mit Datum"}
  "Art.23(4)(d)": {title: "Abschlussbericht innerhalb eines Monats", summary: "Spätestens einen Monat nach der Meldung über den Sicherheitsvorfall legt die Einrichtung einen Abschlussbericht vor: ausführliche Beschreibung mit Schweregrad und Auswirkungen, Art der Bedrohung bzw. zugrunde liegende Ursache, getroffene und laufende Abhilfemaßnahmen und gegebenenfalls grenzüberschreitende Auswirkungen. Dauert der Sicherheitsvorfall noch an, folgt zunächst ein Fortschrittsbericht und der Abschlussbericht innerhalb eines Monats nach Behandlung des Sicherheitsvorfalls (Art. 23 Abs. 4 Buchst. e).", evidence: "Abschluss- oder Fortschrittsberichte mit Übermittlungsdatum; Ursachenanalyse; Nachweise der Überprüfung nach dem Sicherheitsvorfall"}
  "Art.23(1)": {title: "Unterrichtung der Empfänger über erhebliche Sicherheitsvorfälle", summary: "Gegebenenfalls unterrichtet die Einrichtung die Empfänger ihrer Dienste unverzüglich über erhebliche Sicherheitsvorfälle, die die Erbringung des jeweiligen Dienstes beeinträchtigen könnten.", evidence: "Verfahren und Vorlagen für die Kundenkommunikation; Nachweise versandter Unterrichtungen (Statusseite, E-Mails) mit Zeitstempeln; dokumentierte Entscheidung, wenn keine Unterrichtung erfolgte"}
  "Art.23(2)": {title: "Mitteilung erheblicher Cyberbedrohungen an die Empfänger", summary: "Gegebenenfalls teilt die Einrichtung den potenziell von einer erheblichen Cyberbedrohung betroffenen Empfängern ihrer Dienste unverzüglich mit, welche Maßnahmen oder Abhilfemaßnahmen sie ergreifen können, und informiert sie gegebenenfalls über die Bedrohung selbst.", evidence: "Verfahren zur Mitteilung von Bedrohungen; herausgegebene Sicherheitshinweise oder Kundenmitteilungen; zugrunde liegende Bedrohungsinformationen"}

  # Registrierung
  "Art.3(4)": {title: "Übermittlung der Angaben zur Einrichtung an die zuständige Behörde", summary: "Die Einrichtung übermittelt der zuständigen Behörde Name, Anschrift und aktuelle Kontaktdaten, IP-Adressbereiche, Sektor und Teilsektor sowie die Mitgliedstaaten, in denen sie Dienste im Anwendungsbereich erbringt, und meldet Änderungen unverzüglich, spätestens innerhalb von zwei Wochen.", evidence: "Registrierungsbestätigung der Behörde oder des nationalen Portals; Kopie der übermittelten Angaben; Änderungsprotokoll mit Aktualisierungen innerhalb von zwei Wochen"}
  "Art.27": {title: "Register der Einrichtungen für digitale Anbieter", summary: "DNS-Diensteanbieter, TLD-Namenregister, Anbieter von Domänennamen-Registrierungsdiensten, Cloud-Computing-, Rechenzentrums-, Inhaltszustellnetz-, verwaltete und verwaltete Sicherheitsdienste sowie Online-Marktplätze, Online-Suchmaschinen und Plattformen für Dienste sozialer Netzwerke übermitteln für das ENISA-Register Name, Sektor und Art der Einrichtung, Haupt- und sonstige Niederlassungen in der Union oder den Vertreter, Kontaktdaten, die Mitgliedstaaten der Diensterbringung und IP-Adressbereiche. Änderungen werden innerhalb von drei Monaten gemeldet.", evidence: "Registrierungsbestätigung; übermittelter Datensatz einschließlich Hauptniederlassung und IP-Adressbereichen; Änderungsmeldungen mit Datum"}

  # Durchführungsverordnung (EU) 2024/2690, Anhang
  # 1 Konzept für die Sicherheit von Netz- und Informationssystemen
  "IR.1.1": {title: "Konzept für die Sicherheit von Netz- und Informationssystemen", summary: "Das Sicherheitskonzept legt Vorgehen, Ziele, Verpflichtung zur kontinuierlichen Verbesserung und Ressourcen, Rollen, aufzubewahrende Dokumentation und Aufbewahrungsdauer, themenspezifische Konzepte und Kennzahlen zur Überwachung fest. Es wird von den Leitungsorganen förmlich genehmigt, kommuniziert und mindestens jährlich sowie nach erheblichen Sicherheitsvorfällen oder wesentlichen Änderungen überprüft.", evidence: "Genehmigtes Konzept mit Genehmigungsdatum; Liste der themenspezifischen Konzepte; Kenntnisnahmenachweise; jährlicher Überprüfungsnachweis"}
  "IR.1.2": {title: "Rollen, Verantwortlichkeiten und Weisungsbefugnisse", summary: "Verantwortlichkeiten und Weisungsbefugnisse für die Sicherheit sind Rollen zugeordnet und den Leitungsorganen mitgeteilt. Mindestens eine Person berichtet unmittelbar an die Leitungsorgane, widersprüchliche Aufgaben werden getrennt, und die Rollen werden in geplanten Zeitabständen überprüft.", evidence: "Rollen- und Verantwortlichkeitsmatrix; Benennung der Sicherheitsverantwortlichen mit direkter Berichtslinie; Analyse der Aufgabentrennung; Überprüfungsnachweis"}
  # 2 Konzept für das Risikomanagement
  "IR.2.1": {title: "Risikomanagementrahmen", summary: "Ein dokumentiertes Verfahren für das Cybersicherheitsrisikomanagement legt Risikotoleranz und Risikokriterien fest, ermittelt, analysiert und bewertet Risiken gefahrenübergreifend einschließlich Single Points of Failure und führt zu einem Risikobehandlungsplan. Die Leitungsorgane akzeptieren Restrisiken; Bewertungen werden mindestens jährlich überprüft.", evidence: "Risikomethodik; Risikoregister; Risikobehandlungsplan mit Verantwortlichen und Terminen; Akzeptanz der Restrisiken durch die Leitung; jährlicher Überprüfungsnachweis"}
  "IR.2.2": {title: "Überwachung der Einhaltung", summary: "Die Einhaltung der Sicherheitskonzepte, Regeln und Standards wird in geplanten Zeitabständen überprüft; die Leitungsorgane werden über ein Berichtssystem regelmäßig informiert.", evidence: "Plan und Ergebnisse der Einhaltungsprüfungen; Statusberichte zur Sicherheit an die Leitung"}
  "IR.2.3": {title: "Unabhängige Überprüfung der Netz- und Informationssicherheit", summary: "Vorgehen und Umsetzung der Sicherheit werden unabhängig von Personen mit Prüfkompetenz außerhalb der Weisungslinie des geprüften Bereichs überprüft. Die Ergebnisse gehen an die Leitungsorgane und führen zu Korrekturmaßnahmen oder Risikoakzeptanz.", evidence: "Berichte unabhängiger Überprüfungen oder interner Audits; Nachweise zu Unabhängigkeit und Kompetenz der Prüfer; Berichte an die Leitung; Verfolgung der Korrekturmaßnahmen"}
  # 3 Bewältigung von Sicherheitsvorfällen
  "IR.3.1": {title: "Konzept für die Bewältigung von Sicherheitsvorfällen", summary: "Das Konzept legt Rollen und Verfahren für Erkennung, Analyse, Eindämmung, Wiederherstellung, Dokumentation und Meldung von Sicherheitsvorfällen fest, mit Kategorisierungssystem, Kommunikations- und Eskalationsplänen und Hilfsdokumenten. Es wird in geplanten Zeitabständen getestet und überprüft.", evidence: "Konzept für die Bewältigung von Sicherheitsvorfällen; Kategorisierungsschema; Eskalationspläne und Kontaktlisten; Test- und Überprüfungsnachweise"}
  "IR.3.2": {title: "Überwachung und Protokollierung", summary: "Aktivitäten in Netz- und Informationssystemen werden überwacht und protokolliert, soweit möglich automatisiert, für die im Anhang genannten Protokollarten. Protokolle werden ausgewertet, Alarmschwellen lösen zeitnah eine Reaktion aus, Protokolle sind geschützt und werden aufbewahrt, Zeitquellen sind synchronisiert und die Protokollierungssysteme redundant.", evidence: "Protokollierungsstandard und Liste der protokollierten Anlagen; SIEM-Konfiguration und Alarmregeln; Aufbewahrungs- und Integritätseinstellungen; NTP-Konfiguration; Überwachung der Verfügbarkeit der Protokollierung"}
  "IR.3.3": {title: "Meldung von Ereignissen", summary: "Mitarbeiter, Anbieter und Kunden haben einen einfachen Mechanismus zur Meldung verdächtiger Ereignisse; Mitarbeiter werden regelmäßig in seiner Nutzung geschult.", evidence: "Meldekanal (Postfach, Formular, Hotline); Information an Anbieter und Kunden; Schulungsnachweise"}
  "IR.3.4": {title: "Bewertung und Klassifizierung von Ereignissen", summary: "Verdächtige Ereignisse werden anhand vorab festgelegter Kriterien und einer Triage bewertet, um festzustellen, ob es sich um Sicherheitsvorfälle handelt und wie schwer sie sind. Wiederkehrende Sicherheitsvorfälle werden vierteljährlich bewertet, Protokolle korreliert und Ereignisse bei neuen Informationen neu klassifiziert.", evidence: "Triage-Kriterien; klassifizierte Ereignisse; vierteljährliche Bewertung wiederkehrender Sicherheitsvorfälle; Korrelationsregeln"}
  "IR.3.5": {title: "Reaktion auf Sicherheitsvorfälle", summary: "Sicherheitsvorfälle werden nach dokumentierten Verfahren zu Eindämmung, Beseitigung und Wiederherstellung behandelt, mit Kommunikationsplänen für CSIRT oder Behörde, Mitarbeiter und externe Interessenträger. Reaktionsmaßnahmen werden protokolliert und die Verfahren in geplanten Zeitabständen getestet.", evidence: "Reaktionsverfahren; Vorfallstickets mit Zeitablauf und Nachweisen; Kommunikationsplan; Übungsberichte"}
  "IR.3.6": {title: "Überprüfungen nach Sicherheitsvorfällen", summary: "Soweit angemessen ermitteln Überprüfungen nach Sicherheitsvorfällen die Ursache und dokumentierte Erkenntnisse, die in Sicherheit, Risikobehandlung und Verfahren zur Bewältigung von Sicherheitsvorfällen einfließen. In geplanten Zeitabständen wird geprüft, ob Sicherheitsvorfälle zu Überprüfungen geführt haben.", evidence: "Berichte der Überprüfungen; Erkenntnisse und daraus folgende Änderungen; periodische Prüfung der Abdeckung"}
  # 4 Betriebskontinuitäts- und Krisenmanagement
  "IR.4.1": {title: "Notfallplan für die Aufrechterhaltung und Wiederherstellung des Betriebs", summary: "Ein Notfallplan für die Aufrechterhaltung und Wiederherstellung des Betriebs auf Grundlage der Risikobewertung und einer Business-Impact-Analyse legt Rollen, Kontakte, Aktivierungsbedingungen, Wiederherstellungsreihenfolge und -ziele sowie benötigte Ressourcen fest. Er wird getestet und mit den Erkenntnissen aktualisiert.", evidence: "Business-Impact-Analyse; Notfall- und Wiederherstellungspläne; Wiederherstellungsziele (RTO, RPO); Testberichte und Aktualisierungen"}
  "IR.4.2": {title: "Backup-Sicherungs- und Redundanzmanagement", summary: "Sicherungskopien sind vollständig, getrennt und in ausreichender Entfernung gespeichert, zugriffsgeschützt und nach Anforderungen aufbewahrt; Integrität und Wiederherstellung werden regelmäßig getestet. Systeme, Anlagen, Personal und Kommunikationskanäle sind zumindest teilweise redundant.", evidence: "Backup-Plan und Jobberichte; Nachweis externer oder Offline-Speicherung; Ergebnisse von Integritäts- und Wiederherstellungstests; Redundanzkonzept"}
  "IR.4.3": {title: "Krisenmanagement", summary: "Ein Verfahren für das Krisenmanagement regelt Rollen auch für Anbieter, die Kommunikation mit den zuständigen Behörden und die Sicherheit in Krisensituationen. Informationen von CSIRTs und Behörden werden verarbeitet; der Plan wird getestet und aktualisiert.", evidence: "Krisenmanagementplan; Besetzung des Krisenstabs; Kommunikationswege zu Behörden; Berichte von Krisenübungen; Eingang von CSIRT-Hinweisen"}
  # 5 Sicherheit der Lieferkette
  "IR.5.1": {title: "Konzept für die Sicherheit der Lieferkette", summary: "Das Konzept legt Kriterien für Auswahl und Beauftragung von Anbietern fest (Cybersicherheitspraxis, Erfüllung von Spezifikationen, Produktqualität, Diversifizierung) sowie Vertragsanforderungen wie Meldung von Sicherheitsvorfällen, Auditrechte, Schwachstellenbehandlung, Unterauftragsvergabe und Vertragsende. Anbieter werden überwacht, das Konzept wird überprüft.", evidence: "Konzept für die Sicherheit der Lieferkette; Auswahlkriterien; Verträge und SLAs mit Sicherheitsklauseln; Nachweise der Anbieterüberwachung und -überprüfung"}
  "IR.5.2": {title: "Verzeichnis der Anbieter und Diensteanbieter", summary: "Ein aktuelles Verzeichnis führt die unmittelbaren Anbieter und Diensteanbieter mit Kontaktstellen und den jeweils bereitgestellten IKT-Produkten, -Diensten und -Prozessen.", evidence: "Export des Anbieterverzeichnisses mit Kontaktstellen und bereitgestellten IKT-Produkten und -Diensten; Datum der letzten Aktualisierung"}
  # 6 Sicherheitsmaßnahmen bei Erwerb, Entwicklung und Wartung
  "IR.6.1": {title: "Sicherheitsmaßnahmen beim Erwerb von IKT-Diensten oder IKT-Produkten", summary: "Prozesse beherrschen die Risiken beim Erwerb kritischer IKT-Dienste oder -Produkte über ihren Lebenszyklus: Sicherheitsanforderungen, Sicherheitsupdates oder Ersatz nach Supportende, Angaben zu Komponenten und Sicherheitsfunktionen und Validierung der gelieferten Produkte.", evidence: "Sicherheitsanforderungen in der Beschaffung; Sicherheitsdokumentation der Anbieter; Abnahme- oder Validierungsnachweise; Verfolgung des Supportendes"}
  "IR.6.2": {title: "Sicherer Entwicklungszyklus", summary: "Regeln für die sichere Entwicklung decken alle Phasen ab, intern wie ausgelagert: Analyse der Sicherheitsanforderungen, Grundsätze sicherer Systemgestaltung und Programmierung, sichere Entwicklungsumgebungen, Sicherheitsprüfungen und geschützte, bereinigte Testdaten.", evidence: "Konzept für sichere Entwicklung; Sicherheitsanforderungen in Designdokumenten; Code-Reviews und SAST- oder DAST-Ergebnisse; Regeln für Testdaten"}
  "IR.6.3": {title: "Konfigurationsmanagement", summary: "Sichere Konfigurationen für Hardware, Software, Dienste und Netze werden festgelegt, dokumentiert, mit Prozessen und Werkzeugen durchgesetzt und für neue und laufende Systeme überwacht.", evidence: "Härtungsvorgaben; Werkzeuge des Konfigurationsmanagements; Abweichungs- oder Konformitätsberichte"}
  "IR.6.4": {title: "Änderungsmanagement, Reparatur und Wartung", summary: "Änderungen, Releases und Notfalländerungen werden dokumentiert, getestet und vor der Umsetzung auf ihre Auswirkungen bewertet. Abweichungen im Notfall werden mit Begründung dokumentiert.", evidence: "Verfahren des Änderungsmanagements; Änderungstickets mit Genehmigung, Test und Auswirkungsbewertung; Nachweise zu Notfalländerungen"}
  "IR.6.5": {title: "Sicherheitsprüfung", summary: "Ein Konzept für Sicherheitsprüfungen legt Bedarf, Umfang, Häufigkeit und Art der Prüfungen risikobasiert fest. Prüfungen folgen einer dokumentierten Methodik, Ergebnisse und Kritikalität werden erfasst, kritische Feststellungen werden behoben.", evidence: "Konzept für Sicherheitsprüfungen; Prüfplan; Berichte zu Penetrationstests und Scans; Nachweise der Behebung"}
  "IR.6.6": {title: "Sicherheitspatch-Management", summary: "Sicherheitspatches aus vertrauenswürdigen Quellen werden getestet und innerhalb angemessener Zeit eingespielt. Wird ein Patch nicht eingespielt, werden zusätzliche Maßnahmen ergriffen, Restrisiken akzeptiert und die Entscheidung dokumentiert.", evidence: "Verfahren zum Patch-Management; Patch-Konformitätsberichte; Ausnahmeregister mit Begründung"}
  "IR.6.7": {title: "Netzsicherheit", summary: "Netze sind geschützt durch eine dokumentierte Architektur, Kontrollen für interne Netzbereiche und Fernzugriffe, deaktivierte nicht benötigte Dienste, autorisierte Geräte, zeitlich begrenzte Verbindungen von Diensteanbietern und vertrauenswürdige Kanäle. Es gibt Pläne zur Umstellung auf Netzprotokolle der neuesten Generation und moderne E-Mail-Sicherheitsstandards; bewährte Verfahren für DNS- und Routing-Sicherheit werden angewandt.", evidence: "Netzarchitekturdiagramme; Firewall- und Fernzugriffsregeln; Freigaben für Zugriffe von Diensteanbietern; Umsetzungspläne für IPv6 und E-Mail-Sicherheit (z. B. DMARC, DNSSEC)"}
  "IR.6.8": {title: "Netzsegmentierung", summary: "Systeme sind risikobasiert in Netze oder Zonen segmentiert und von Netzen Dritter getrennt; kritische Systeme liegen in gesicherten Zonen, es gibt eine DMZ, eingeschränkten Verkehr zwischen Zonen, ein separates Verwaltungsnetz und die Trennung der Produktion von Entwicklung und Test.", evidence: "Zonenmodell und Segmentierungsdiagramme; Überprüfungen der Firewall-Regeln; Nachweise zu separatem Verwaltungsnetz und getrennten Umgebungen"}
  "IR.6.9": {title: "Schutz gegen Schadsoftware und nicht genehmigte Software", summary: "Maßnahmen erkennen oder verhindern Schadsoftware und nicht genehmigte Software, gegebenenfalls mit regelmäßig aktualisierter Erkennungs- und Reaktionssoftware.", evidence: "Abdeckungsbericht für EDR oder Virenschutz; Update-Status von Signaturen und Agenten; Konfiguration von Anwendungs-Whitelisting"}
  "IR.6.10": {title: "Behandlung und Offenlegung von Schwachstellen", summary: "Die Einrichtung verfolgt Informationen über Schwachstellen, scannt in geplanten Zeitabständen, behebt kritische Schwachstellen unverzüglich, stimmt die Schwachstellenbehandlung mit Änderungs-, Patch-, Risiko- und Vorfallsmanagement ab und hat ein Verfahren zur Offenlegung im Einklang mit der nationalen Strategie zur koordinierten Offenlegung von Schwachstellen.", evidence: "Verfahren zum Schwachstellenmanagement; Scan-Berichte; Behebungstickets und Fristen; dokumentierte Entscheidungen gegen eine Behebung; Offenlegungsrichtlinie (z. B. security.txt)"}
  # 7 Konzepte und Verfahren zur Bewertung der Wirksamkeit
  "IR.7.1": {title: "Konzept und Verfahren zur Bewertung der Wirksamkeit", summary: "Ein Konzept und Verfahren bewerten, ob die Risikomanagementmaßnahmen im Bereich der Cybersicherheit wirksam umgesetzt und aufrechterhalten werden.", evidence: "Konzept zur Wirksamkeitsbewertung; Bewertungsverfahren"}
  "IR.7.2": {title: "Festlegung von Gegenstand, Methode, Zeitpunkt und Zuständigkeit der Messung", summary: "Unter Berücksichtigung der Risikobewertung und früherer erheblicher Sicherheitsvorfälle bestimmt die Einrichtung, welche Maßnahmen überwacht und gemessen werden, mit welchen Methoden, wann gemessen und ausgewertet wird und wer zuständig ist.", evidence: "Kennzahlenkatalog mit Verantwortlichen, Methoden und Häufigkeiten; Messergebnisse; Auswertungsberichte"}
  "IR.7.3": {title: "Überprüfung des Konzepts zur Wirksamkeitsbewertung", summary: "Konzept und Verfahren zur Wirksamkeitsbewertung werden in geplanten Zeitabständen sowie bei erheblichen Sicherheitsvorfällen oder wesentlichen Änderungen überprüft und aktualisiert.", evidence: "Überprüfungsnachweise und Versionshistorie"}
  # 8 Grundlegende Verfahren im Bereich der Cyberhygiene und Schulungen
  "IR.8.1": {title: "Sensibilisierungsmaßnahmen und grundlegende Verfahren im Bereich der Cyberhygiene", summary: "Mitarbeiter einschließlich der Mitglieder der Leitungsorgane und gegebenenfalls unmittelbare Anbieter durchlaufen ein wiederkehrendes Sensibilisierungsprogramm zu Bedrohungen, bestehenden Maßnahmen und Cyberhygiene. Seine Wirksamkeit wird gegebenenfalls getestet; es wird an die aktuelle Bedrohungslage angepasst.", evidence: "Plan des Sensibilisierungsprogramms; Materialien; Teilnahmenachweise einschließlich Leitung und neuer Mitarbeiter; Wirksamkeitstests wie Phishing-Simulationen"}
  "IR.8.2": {title: "Sicherheitsschulungen", summary: "Rollen mit Bedarf an Sicherheitskompetenz sind ermittelt und erhalten regelmäßig rollenbezogene Schulungen zu sicherer Konfiguration und Betrieb, bekannten Bedrohungen und Verhalten bei sicherheitsrelevanten Ereignissen. Die Wirksamkeit wird bewertet; Mitarbeiter, die in solche Rollen wechseln, werden geschult.", evidence: "Schulungsbedarfsanalyse nach Rollen; Schulungsprogramm; Teilnahme- und Bewertungsnachweise"}
  # 9 Kryptografie
  "IR.9.1": {title: "Konzept und Verfahren in Bezug auf Kryptografie", summary: "Ein Konzept und Verfahren stellen eine angemessene und wirksame Nutzung von Kryptografie zum Schutz von Vertraulichkeit, Authentizität und Integrität der Daten sicher, im Einklang mit der Anlagen- und Werteklassifizierung und der Risikobewertung.", evidence: "Kryptografiekonzept; Zuordnung zur Anlagen- und Werteklassifizierung"}
  "IR.9.2": {title: "Kryptografische Maßnahmen, Protokolle und Schlüsselverwaltung", summary: "Das Konzept legt Art, Stärke und Qualität der kryptografischen Maßnahmen für gespeicherte und übertragene Daten fest, zugelassene Protokolle, Algorithmen und Schlüsselstärken mit Krypto-Agilität sowie die Schlüsselverwaltung von Erzeugung, Verteilung, Speicherung und Wechsel über Kompromittierung, Widerruf, Wiederherstellung und Sicherung bis zu Vernichtung, Protokollierung und Gültigkeitszeiträumen.", evidence: "Liste zugelassener Algorithmen und Protokolle; Verfahren zur Schlüsselverwaltung; KMS- oder HSM-Konfiguration; Nachweise zu Schlüsselwechsel und Zertifikatsablauf"}
  "IR.9.3": {title: "Überprüfung des Kryptografiekonzepts", summary: "Konzept und Verfahren zur Kryptografie werden in geplanten Zeitabständen unter Berücksichtigung des Stands der Technik in der Kryptografie überprüft und aktualisiert.", evidence: "Überprüfungsnachweis; Änderungen aufgrund kryptografischer Entwicklungen"}
  # 10 Sicherheit des Personals
  "IR.10.1": {title: "Sicherheit des Personals", summary: "Mitarbeiter und gegebenenfalls Anbieter verstehen ihre Sicherheitsverantwortung und verpflichten sich darauf; privilegierte Nutzer und Mitglieder der Leitungsorgane handeln gemäß ihrer Rolle; es wird qualifiziertes Personal eingestellt. Rollenzuweisungen werden mindestens jährlich überprüft.", evidence: "Unterzeichnete Sicherheitsverpflichtungen oder Verhaltenskodex; Prüfungen bei der Einstellung; jährliche Überprüfung der Rollenzuweisungen"}
  "IR.10.2": {title: "Zuverlässigkeitsüberprüfung", summary: "Kriterien legen fest, welche Rollen eine Zuverlässigkeitsüberprüfung erfordern; die Überprüfung erfolgt vor Übernahme der Rolle, rechtskonform und risikoangemessen.", evidence: "Konzept zur Zuverlässigkeitsüberprüfung mit Rollenkriterien; Prüfnachweise für Stichproben von Einstellungen"}
  "IR.10.3": {title: "Verfahren zur Beendigung oder Änderung des Beschäftigungsverhältnisses", summary: "Sicherheitspflichten, die nach Beendigung oder Änderung des Beschäftigungsverhältnisses fortgelten, etwa Vertraulichkeit, sind vertraglich festgelegt und werden durchgesetzt.", evidence: "Muster für Arbeitsverträge und Vertraulichkeitsvereinbarungen; Nachweise zu Austritten und Wechseln"}
  "IR.10.4": {title: "Disziplinarverfahren", summary: "Ein Disziplinarverfahren für Verstöße gegen Sicherheitskonzepte ist festgelegt, kommuniziert und wird überprüft.", evidence: "Disziplinarverfahren; Information an die Mitarbeiter; Überprüfungsnachweis"}
  # 11 Zugriffskontrolle
  "IR.11.1": {title: "Konzept für die Zugriffskontrolle", summary: "Konzepte für die logische und physische Zugriffskontrolle regeln den Zugriff durch Personen (Mitarbeiter, Besucher, Anbieter) und durch Systeme und gewähren Zugriff nur angemessen authentifizierten Nutzern.", evidence: "Zugriffskontrollkonzept; Überprüfungsnachweis"}
  "IR.11.2": {title: "Management von Zugangs- und Zugriffsrechten", summary: "Zugriffsrechte werden nach Need-to-know, geringsten Rechten und Aufgabentrennung vergeben, geändert und entzogen, genehmigt, für Dritte begrenzt, in einem Register geführt, protokolliert und in geplanten Zeitabständen überprüft.", evidence: "Antrags- und Genehmigungsnachweise; Register der Zugriffsrechte; Ergebnisse periodischer Rechteüberprüfungen; Nachweise des Entzugs bei Austritt"}
  "IR.11.3": {title: "Privilegierte Konten und Systemverwaltungskonten", summary: "Privilegierte Konten und Systemverwaltungskonten nutzen starke Authentifizierung wie MFA, dienen ausschließlich der Verwaltung, sind personalisiert und beschränkt, werden nur für Verbindungen zu Systemverwaltungssystemen genutzt und in geplanten Zeitabständen überprüft.", evidence: "Konzept für privilegierte Zugriffe; PAM-Konfiguration; Liste der Administratorkonten; Ergebnisse der Überprüfung privilegierter Zugriffe"}
  "IR.11.4": {title: "Systemverwaltungssysteme", summary: "Systemverwaltungssysteme werden nur zur Systemverwaltung genutzt, logisch von anderer Anwendungssoftware getrennt und durch Authentifizierung und Verschlüsselung geschützt.", evidence: "Konzept für Administrationsarbeitsplätze oder Jump-Hosts; Zugriffs- und Verschlüsselungskonfiguration"}
  "IR.11.5": {title: "Identifizierung", summary: "Eindeutige Identitäten werden über ihren Lebenszyklus verwaltet und einer einzelnen Person zugeordnet. Gemeinsam genutzte Identitäten sind nur mit dokumentierter Genehmigung zulässig und im Risikomanagement berücksichtigt; nicht mehr benötigte Identitäten werden unverzüglich deaktiviert.", evidence: "Verfahren zum Identitätslebenszyklus; Export aus Identitätsanbieter oder Verzeichnis; Register gemeinsam genutzter Konten mit Genehmigungen; Berichte zu inaktiven Konten"}
  "IR.11.6": {title: "Authentifizierung", summary: "Die Stärke der Authentifizierung entspricht der Klassifizierung der Anlage; geheime Authentifizierungsinformationen werden vertraulich behandelt, Zugangsdaten anfänglich und bei Kompromittierungsverdacht geändert, Konten nach Fehlversuchen gesperrt, inaktive Sitzungen beendet und für privilegierte Zugriffe gesonderte Zugangsdaten verwendet.", evidence: "Authentifizierungsstandard; Passwort-, Sperr- und Sitzungseinstellungen des Identitätsanbieters; Überprüfungsnachweis"}
  "IR.11.7": {title: "Multifaktor-Authentifizierung", summary: "Nutzer authentifizieren sich, soweit angemessen und entsprechend der Klassifizierung der Anlage, mit mehreren Faktoren oder kontinuierlicher Authentifizierung.", evidence: "MFA-Richtlinien; MFA-Abdeckungsbericht; dokumentierte Ausnahmen"}
  # 12 Anlagen- und Wertemanagement
  "IR.12.1": {title: "Anlagen- und Werteklassifizierung", summary: "Allen Anlagen und Werten im Anwendungsbereich, einschließlich Informationen, werden Klassifizierungsstufen nach Vertraulichkeit, Integrität, Authentizität und Verfügbarkeit zugeordnet, abgestimmt auf die Kontinuitätsziele und periodisch überprüft.", evidence: "Klassifizierungsschema; klassifiziertes Inventar; Überprüfungsnachweis"}
  "IR.12.2": {title: "Behandlung von Anlagen und Werten", summary: "Ein Konzept für den Umgang mit Anlagen und Werten deckt den gesamten Lebenszyklus ab, einschließlich sicherer Nutzung, Lagerung, Transport, sicherer Übertragung und unwiederbringlicher Löschung oder Vernichtung, und ist den Nutzern bekannt gemacht.", evidence: "Konzept für den Umgang mit Anlagen und Werten; Lösch- und Vernichtungsnachweise; Kommunikationsnachweise"}
  "IR.12.3": {title: "Konzept für Wechseldatenträger", summary: "Das Konzept für Wechseldatenträger sperrt deren Anschluss technisch, sofern kein organisatorischer Grund besteht, deaktiviert Autostart und prüft Datenträger auf Schadcode, schützt Datenträger bei Transport und Lagerung und nutzt gegebenenfalls Verschlüsselung.", evidence: "Konzept für Wechseldatenträger; Konfiguration der Gerätekontrolle auf Endgeräten; genehmigte Ausnahmen"}
  "IR.12.4": {title: "Anlagen- und Werteinventar", summary: "Ein vollständiges, genaues und aktuelles Inventar führt Betriebsabläufe und Dienste sowie die sie unterstützenden Systeme und Anlagen, mit nachvollziehbarer Änderungshistorie.", evidence: "Inventar- oder CMDB-Export; Änderungshistorie; Abgleich mit Discovery-Werkzeugen"}
  "IR.12.5": {title: "Abgabe, Rückgabe oder Löschung von Anlagen und Werten bei Beendigung des Beschäftigungsverhältnisses", summary: "Anlagen und Werte im Besitz des Personals werden bei Beendigung des Beschäftigungsverhältnisses abgegeben, zurückgegeben oder gelöscht, und dies wird dokumentiert. Ist das nicht möglich, wird verhindert, dass sie weiter auf die Systeme der Einrichtung zugreifen.", evidence: "Austritts-Checklisten; Rückgabenachweise; Nachweise zu Fernlöschung oder Sperrung"}
  # 13 Sicherheit des Umfelds und physische Sicherheit
  "IR.13.1": {title: "Unterstützende Versorgungsleistungen", summary: "Einrichtungen sind gegen Ausfälle unterstützender Versorgungsleistungen wie Strom, Telekommunikation, Wasser und Klimatisierung geschützt; Redundanz wird erwogen, Versorgungsleitungen werden geschützt und anhand von Schwellenwerten überwacht, Verträge für die Notversorgung bestehen und die Versorgung wird getestet.", evidence: "Testnachweise für USV und Notstromaggregat; Verträge zur Notversorgung mit Kraftstoff; Überwachungs- und Alarmnachweise; Redundanzkonzept"}
  "IR.13.2": {title: "Schutz vor physischen Bedrohungen und Bedrohungen des Umfelds", summary: "Auf Grundlage der Risikobewertung werden Schutzmaßnahmen gegen physische Bedrohungen und Bedrohungen des Umfelds wie Naturkatastrophen geplant und umgesetzt, mit Kontrollschwellenwerten und Überwachung der Umgebungsparameter.", evidence: "Bewertung physischer Risiken; Dokumentation zu Brand-, Wasser- und Klimaschutz; Schwellenwerte der Umgebungsüberwachung und Alarmprotokolle"}
  "IR.13.3": {title: "Perimeter und physische Zutrittskontrolle", summary: "Sicherheitsperimeter mit Zutrittskontrollen schützen Bereiche mit Systemen und Anlagen; Büros, Räume und Einrichtungen sind physisch gesichert und werden kontinuierlich auf unbefugten Zutritt überwacht.", evidence: "Standortsicherheitskonzept; Zutrittsprotokolle und deren Auswertung; Besucherprotokolle; Nachweise zu Videoüberwachung oder Alarmanlage"}
