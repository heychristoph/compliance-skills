# Titel und Fachbegriffe folgen der amtlichen deutschen Fassung der Richtlinie
# (EU) 2022/2555 und der Durchführungsverordnung (EU) 2024/2690 im Amtsblatt der
# EU. Bei Artikeln der Richtlinie ist der Titel der Artikelüberschrift oder dem
# Wortlaut des jeweiligen Buchstabens entnommen; bei IR-Einträgen der Überschrift
# des Anhangabschnitts. Die Abschnitte 7 und 9 des Anhangs haben keine
