# Checks for every pull request and every push to main: shared copies in sync and catalog IDs
# locked, unit tests, and the oracle evals of every skill (SOC 2, ISO 27001, GDPR, NIS2, app
# assessment) in English, plus one German run per engine. The oracle evals are model-free.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skills/*/scripts/requirements.txt

      - name: Install
        run: python -m pip install -r skills/compliance-app-assessment/scripts/requirements.txt -r skills/compliance-soc2-audit/scripts/requirements.txt

      # git is needed by the records and app fixtures (commit dates, repository scan).
      - name: Git identity for fixtures
        run: git config --global user.name "CI" && git config --global user.email "ci@example.invalid"

      - name: Shared copies in sync, catalog IDs locked
        run: python tools/sync.py --check

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Oracle evals
        run: |
          set -e
          run() {
            out=$(python "evals/$1/run.py" --case "$2" --agent oracle ${3:+--language $3})
            echo "$out" | tail -1
            echo "$out" | grep -q "score 1.0 " || { echo "$out"; echo "::error::$1 $2 $3 scored below 1.0"; exit 1; }
          }
          for fw in soc2 iso27001 gdpr nis2 app; do python "evals/$fw/make_fixture.py" > /dev/null; done
          run soc2 type1; run soc2 type2; run soc2 type2 de
          run iso27001 stage1; run iso27001 stage2; run iso27001 stage2 de
          run gdpr assessment; run gdpr audit; run gdpr audit de
          run nis2 assessment; run nis2 audit; run nis2 audit de
          run app processor; run app developer; run app processor de

      - name: Probo connectors against a mock
        run: for fw in soc2 iso27001 gdpr nis2; do python "evals/$fw/test_probo_connector.py" | tail -1; done
