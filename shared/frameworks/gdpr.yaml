# General Data Protection Regulation (EU) 2016/679: auditable obligations, identifiers and short summaries.
#
# The authoritative text is the regulation as published in the Official Journal of
# the European Union (OJ L 119, 4.5.2016, p. 1, with corrigenda), available on
# EUR-Lex. The summaries below are paraphrases for navigation and reporting, not the
# official wording. EU legal texts on EUR-Lex may be reused under Commission Decision
# 2011/833/EU, so a `text:` field may hold the official wording of a requirement;
# the report prints `text` when present and falls back to `summary`.
#
# Titles: an entry for a whole article carries the official article heading. An
# entry for a paragraph or point carries the official article heading, a colon and
# a short descriptor of that paragraph or point.
#
# kind: article - an obligation from an article, paragraph or point of the GDPR.
# group:        - the GDPR chapter (Roman numeral).
# roles:        - who carries the obligation: controller, processor or both.
# optional: true - voluntary mechanism (codes of conduct, certification). In scope
#                 only when the organization adheres to a code or holds or seeks a
#                 certification.
# plan:         - default frequency and nature for a requirement audited directly
#                 (a REQ- unit). The auditor confirms them in testplan.csv.
# evidence:     - typical evidence an auditor asks for.
#
# Articles 1 to 4 (scope and definitions) and 23 (restrictions by Union or Member
# State law) carry no obligation an organization evidences directly and are not
# listed. Member State law (for example the German BDSG) can add to or narrow
# several obligations, such as the DPO designation threshold or the age of consent.

framework: {id: gdpr, name: GDPR, title: "General Data Protection Regulation", reference: "Regulation (EU) 2016/679", url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"}

groups:
  "II": Principles
  "III": Rights of the data subject
  "IV": Controller and processor
  "V": Transfers of personal data to third countries or international organisations

requirements:
  # Chapter II Principles
  - {id: "Art.5(1)(a)", kind: article, group: "II", roles: [controller], plan: [annual, manual], title: "Principles relating to processing of personal data: lawfulness, fairness and transparency", summary: "Personal data are processed lawfully, fairly and in a way the data subject can understand. Each processing activity has a documented lawful basis and is described in a privacy notice.", evidence: "Record of processing activities with lawful basis per activity; published privacy notices"}
  - {id: "Art.5(1)(b)", kind: article, group: "II", roles: [controller], plan: [annual, manual], title: "Principles relating to processing of personal data: purpose limitation", summary: "Personal data are collected for specified, explicit and legitimate purposes and not further processed in a way incompatible with them. Purposes are documented before processing starts.", evidence: "Purposes recorded per processing activity; compatibility assessments for new uses of existing data"}
  - {id: "Art.5(1)(c)", kind: article, group: "II", roles: [controller], plan: [annual, manual], title: "Principles relating to processing of personal data: data minimisation", summary: "Only personal data that are adequate, relevant and limited to what the purpose needs are collected and kept. Data fields are reviewed against their purpose.", evidence: "Data inventory or data map with justification per data category; design reviews of forms and data models"}
  - {id: "Art.5(1)(d)", kind: article, group: "II", roles: [controller], plan: [annual, manual], title: "Principles relating to processing of personal data: accuracy", summary: "Personal data are accurate and kept up to date where necessary, and inaccurate data are corrected or erased without delay.", evidence: "Data quality procedures; self-service profile editing; rectification request log"}
  - {id: "Art.5(1)(e)", kind: article, group: "II", roles: [controller], plan: [monthly, automated], title: "Principles relating to processing of personal data: storage limitation", summary: "Personal data are kept in identifiable form no longer than the purpose needs. Retention periods are defined and data are deleted or anonymized when they expire.", evidence: "Retention schedule; deletion job configuration and run logs; samples showing expired records removed"}
  - {id: "Art.5(1)(f)", kind: article, group: "II", roles: [controller, processor], plan: [annual, manual], title: "Principles relating to processing of personal data: integrity and confidentiality", summary: "Personal data are protected against unauthorized or unlawful processing and against accidental loss, destruction or damage by appropriate technical and organizational measures (detailed in Art. 32).", evidence: "Information security policy; technical and organizational measures (TOMs) document; link to Art. 32 evidence"}
  - {id: "Art.5(2)", kind: article, group: "II", roles: [controller], plan: [annual, manual], title: "Principles relating to processing of personal data: accountability", summary: "The controller is responsible for compliance with the principles and can demonstrate it. A data protection management system assigns ownership and keeps the documentation current.", evidence: "Data protection policy and governance structure; compliance documentation set; internal data protection audit reports"}
  - {id: "Art.6(1)", kind: article, group: "II", roles: [controller], plan: [annual, manual], title: "Lawfulness of processing: legal basis", summary: "Every processing activity rests on at least one legal basis in Art. 6(1)(a) to (f). Where legitimate interests are relied on, a balancing test is documented.", evidence: "Lawful basis per activity in the Art. 30 register; legitimate interest assessments"}
  - {id: "Art.6(4)", kind: article, group: "II", roles: [controller], plan: [event, manual], title: "Lawfulness of processing: compatibility of further processing", summary: "When data are used for a new purpose without consent or a legal obligation, a compatibility assessment considers the link between purposes, context, nature of the data, consequences and safeguards.", evidence: "Compatibility assessments for changed or new purposes"}
  - {id: "Art.7(1)", kind: article, group: "II", roles: [controller], plan: [continuous, automated], title: "Conditions for consent: demonstrating consent", summary: "Where processing is based on consent, the controller can show that each data subject consented: who, when, to what wording and how.", evidence: "Consent records or consent management platform logs with timestamp, version of the consent text and channel"}
  - {id: "Art.7(2)", kind: article, group: "II", roles: [controller], plan: [annual, manual], title: "Conditions for consent: distinguishable request", summary: "A consent request inside a written declaration covering other matters is clearly distinguishable, intelligible and easily accessible, in clear and plain language.", evidence: "Screenshots of consent dialogs and forms; review of consent wording"}
  - {id: "Art.7(3)", kind: article, group: "II", roles: [controller], plan: [annual, manual], title: "Conditions for consent: withdrawal", summary: "Data subjects are told before consenting that they can withdraw, withdrawing is as easy as giving consent, and processing stops when consent is withdrawn.", evidence: "Withdrawal mechanism (preference center, unsubscribe link); test showing withdrawal takes effect"}
  - {id: "Art.7(4)", kind: article, group: "II", roles: [controller], plan: [annual, manual], title: "Conditions for consent: freely given", summary: "Performance of a contract or a service is not made conditional on consent to processing that the contract does not need.", evidence: "Review of sign-up and checkout flows; consent options separate from terms acceptance"}
  - {id: "Art.8", kind: article, group: "II", roles: [controller], plan: [annual, manual], title: "Conditions applicable to child's consent in relation to information society services", summary: "Where an information society service offered directly to children relies on consent, consent of a child under 16 (or the lower national age, not below 13) is given or authorized by the holder of parental responsibility, and reasonable efforts verify this.", evidence: "Age gate and parental consent flow; verification method; applicable national age thresholds"}
  - {id: "Art.9", kind: article, group: "II", roles: [controller], plan: [annual, manual], title: "Processing of special categories of personal data", summary: "Special category data (health, biometric, genetic, racial or ethnic origin, political opinions, religion, trade union membership, sex life or orientation) are processed only under an exception in Art. 9(2), identified and documented per activity.", evidence: "Art. 30 register entries flagging special categories with the Art. 9(2) condition; explicit consent records where used"}
  - {id: "Art.10", kind: article, group: "II", roles: [controller], plan: [annual, manual], title: "Processing of personal data relating to criminal convictions and offences", summary: "Data on criminal convictions and offences are processed only under official authority or where Union or Member State law authorizes it with safeguards, for example background checks permitted by national law.", evidence: "Legal basis analysis for background checks; access restrictions on such records"}
  - {id: "Art.11", kind: article, group: "II", roles: [controller], plan: [annual, manual], title: "Processing which does not require identification", summary: "The controller does not keep or collect extra data only to identify data subjects for GDPR purposes. Where it cannot identify a requester, it informs them where possible and accepts additional information they provide.", evidence: "Procedure for requests on pseudonymous or de-identified data; response templates"}

  # Chapter III Rights of the data subject
  - {id: "Art.12(1)", kind: article, group: "III", roles: [controller], plan: [annual, manual], title: "Transparent information, communication and modalities for the exercise of the rights of the data subject: concise and plain information", summary: "Information and communications to data subjects are concise, transparent, intelligible and easily accessible, in clear and plain language, especially when addressed to children.", evidence: "Privacy notices and their readability review; placement and accessibility of notices"}
  - {id: "Art.12(2)", kind: article, group: "III", roles: [controller], plan: [annual, manual], title: "Transparent information, communication and modalities for the exercise of the rights of the data subject: facilitating rights", summary: "The controller makes it easy to exercise rights under Art. 15 to 22, with documented request channels and an internal procedure for handling requests.", evidence: "Data subject request procedure; request channels (web form, email address); assignment of responsibilities"}
  - {id: "Art.12(3)", kind: article, group: "III", roles: [controller], plan: [event, manual], title: "Transparent information, communication and modalities for the exercise of the rights of the data subject: response time", summary: "Requests are answered without undue delay and within one month of receipt; an extension of up to two further months is justified and communicated to the data subject within the first month.", evidence: "Data subject request log with receipt and response dates; extension notices"}
  - {id: "Art.12(4)", kind: article, group: "III", roles: [controller], plan: [event, manual], title: "Transparent information, communication and modalities for the exercise of the rights of the data subject: refusal", summary: "When the controller does not act on a request, it tells the data subject within one month why, and that they can complain to a supervisory authority and seek a judicial remedy.", evidence: "Refusal letters or templates; request log entries for refused requests"}
  - {id: "Art.12(5)", kind: article, group: "III", roles: [controller], plan: [event, manual], title: "Transparent information, communication and modalities for the exercise of the rights of the data subject: free of charge", summary: "Information and actions on requests are free of charge. A fee or refusal for manifestly unfounded or excessive requests is documented with the reasons.", evidence: "Request log showing no fees charged or documented justification for any fee or refusal"}
  - {id: "Art.12(6)", kind: article, group: "III", roles: [controller], plan: [event, manual], title: "Transparent information, communication and modalities for the exercise of the rights of the data subject: identity verification", summary: "Where there is reasonable doubt about a requester's identity, the controller asks for proportionate additional information to confirm it before disclosing data.", evidence: "Identity verification procedure; samples of verified requests"}
  - {id: "Art.13", kind: article, group: "III", roles: [controller], plan: [annual, manual], title: "Information to be provided where personal data are collected from the data subject", summary: "At the time of collection, data subjects receive the information in Art. 13(1) and (2): identity and contacts, DPO, purposes and legal basis, legitimate interests, recipients, transfers, retention, rights, consent withdrawal, complaint right, whether provision is required and automated decision-making. A new purpose triggers updated information.", evidence: "Privacy notices mapped to the Art. 13 checklist; notice versions and change history; collection points showing the notice"}
  - {id: "Art.14", kind: article, group: "III", roles: [controller], plan: [annual, manual], title: "Information to be provided where personal data have not been obtained from the data subject", summary: "Where data come from other sources, data subjects receive the Art. 14 information, including the categories and source of the data, within a reasonable period and at the latest one month after obtaining them, or at first communication or disclosure. Any exemption under Art. 14(5) is documented.", evidence: "Notices for indirectly collected data; documented Art. 14(5) exemptions"}
  - {id: "Art.15(1)", kind: article, group: "III", roles: [controller], plan: [event, manual], title: "Right of access by the data subject: confirmation and information", summary: "On request, the controller confirms whether it processes the person's data and provides the purposes, categories, recipients, retention, rights, source, automated decision-making details and transfer safeguards.", evidence: "Access request log; sample responses; access response template"}
  - {id: "Art.15(3)", kind: article, group: "III", roles: [controller], plan: [event, manual], title: "Right of access by the data subject: copy of the data", summary: "The controller provides a copy of the personal data undergoing processing, in a commonly used electronic form when the request is made electronically, without adversely affecting the rights of others.", evidence: "Data export procedure or tooling covering all systems; sample copies with third-party data redacted"}
  - {id: "Art.16", kind: article, group: "III", roles: [controller], plan: [event, manual], title: "Right to rectification", summary: "Inaccurate personal data are corrected and incomplete data completed without undue delay on request.", evidence: "Rectification requests in the request log; system change records"}
  - {id: "Art.17(1)", kind: article, group: "III", roles: [controller], plan: [event, manual], title: "Right to erasure (‘right to be forgotten’): erasure on request", summary: "Personal data are erased without undue delay when a ground in Art. 17(1) applies, across all systems including backups within their retention cycle, unless an exception in Art. 17(3) applies and is documented.", evidence: "Erasure procedure covering all systems; erasure request log; deletion confirmations; documented exceptions"}
  - {id: "Art.17(2)", kind: article, group: "III", roles: [controller], plan: [event, manual], title: "Right to erasure (‘right to be forgotten’): data made public", summary: "Where the controller made the data public, it takes reasonable steps to inform other controllers processing the data that erasure of links, copies or replications was requested.", evidence: "Procedure for notifying other controllers; records of notifications sent"}
  - {id: "Art.18", kind: article, group: "III", roles: [controller], plan: [event, manual], title: "Right to restriction of processing", summary: "Where a ground in Art. 18(1) applies, processing is restricted (data stored but not otherwise used), and the data subject is informed before the restriction is lifted.", evidence: "Technical means to flag or block restricted records; restriction requests in the request log"}
  - {id: "Art.19", kind: article, group: "III", roles: [controller], plan: [event, manual], title: "Notification obligation regarding rectification or erasure of personal data or restriction of processing", summary: "Each recipient to whom data were disclosed is told of any rectification, erasure or restriction unless impossible or disproportionate, and the data subject is told who the recipients are on request.", evidence: "Recipient notification procedure; records of notifications to recipients and processors"}
  - {id: "Art.20", kind: article, group: "III", roles: [controller], plan: [event, manual], title: "Right to data portability", summary: "For data the person provided, processed by automated means on the basis of consent or contract, the controller provides them in a structured, commonly used and machine-readable format and, where technically feasible, transmits them to another controller.", evidence: "Export function producing machine-readable formats (JSON, CSV); portability requests in the request log"}
  - {id: "Art.21(1)", kind: article, group: "III", roles: [controller], plan: [event, manual], title: "Right to object: processing based on public or legitimate interests", summary: "When a data subject objects to processing based on Art. 6(1)(e) or (f), processing stops unless compelling legitimate grounds that override the data subject's interests, or legal claims, are demonstrated.", evidence: "Objection handling procedure; objection log with outcome and documented grounds"}
  - {id: "Art.21(3)", kind: article, group: "III", roles: [controller], plan: [continuous, automated], title: "Right to object: direct marketing", summary: "When a data subject objects to direct marketing, including related profiling, their data are no longer processed for that purpose.", evidence: "Suppression or opt-out list and its synchronization with marketing tools; test of opt-out effect"}
  - {id: "Art.21(4)", kind: article, group: "III", roles: [controller], plan: [annual, manual], title: "Right to object: information on the right", summary: "The right to object is explicitly brought to the data subject's attention at the latest at the first communication, presented clearly and separately from other information.", evidence: "Privacy notice section on the right to object; first-contact communications and marketing emails"}
  - {id: "Art.22(1)", kind: article, group: "III", roles: [controller], plan: [annual, manual], title: "Automated individual decision-making, including profiling: permitted grounds", summary: "Decisions based solely on automated processing that produce legal or similarly significant effects are identified, and each rests on an exception in Art. 22(2): contract necessity, authorization by law, or explicit consent.", evidence: "Inventory of automated decision-making and profiling; documented Art. 22(2) ground per use"}
  - {id: "Art.22(3)", kind: article, group: "III", roles: [controller], plan: [annual, manual], title: "Automated individual decision-making, including profiling: safeguards", summary: "For automated decisions based on contract or consent, data subjects can obtain human intervention, express their point of view and contest the decision.", evidence: "Human review procedure; appeal or contest channel; logs of reviewed decisions"}

  # Chapter IV Controller and processor
  - {id: "Art.24(1)", kind: article, group: "IV", roles: [controller], plan: [annual, manual], title: "Responsibility of the controller: appropriate measures", summary: "The controller implements technical and organizational measures appropriate to the nature, scope, context, purposes and risks of the processing, can demonstrate them, and reviews and updates them where necessary.", evidence: "Data protection management system documentation; risk assessment; record of periodic review"}
  - {id: "Art.24(2)", kind: article, group: "IV", roles: [controller], plan: [annual, manual], title: "Responsibility of the controller: data protection policies", summary: "Where proportionate, the controller has data protection policies that are approved, communicated and kept current.", evidence: "Approved data protection policy with version and review date; staff acknowledgement records"}
  - {id: "Art.25(1)", kind: article, group: "IV", roles: [controller], plan: [event, manual], title: "Data protection by design and by default: by design", summary: "When systems and processes are designed or changed, measures such as pseudonymization and minimization are built in to implement the principles, taking into account the state of the art, cost and risk.", evidence: "Privacy review step in the development or change process; completed privacy-by-design checklists for recent projects"}
  - {id: "Art.25(2)", kind: article, group: "IV", roles: [controller], plan: [annual, manual], title: "Data protection by design and by default: by default", summary: "By default only the personal data necessary for each purpose are processed, regarding amount, extent of processing, storage period and accessibility; data are not made accessible to an indefinite number of people without the individual's intervention.", evidence: "Default settings documentation and screenshots (privacy-friendly defaults, profile visibility); review of default retention and access"}
  - {id: "Art.26(1)", kind: article, group: "IV", roles: [controller], plan: [annual, manual], title: "Joint controllers: arrangement", summary: "Where two or more controllers jointly determine purposes and means, a transparent arrangement sets out their respective responsibilities, in particular for data subject rights and information duties.", evidence: "Joint controller agreements; list of joint controllership relationships"}
  - {id: "Art.26(2)", kind: article, group: "IV", roles: [controller], plan: [annual, manual], title: "Joint controllers: essence available to data subjects", summary: "The arrangement reflects the actual roles and relationships, and its essence is made available to the data subject.", evidence: "Privacy notice section summarizing the joint controller arrangement"}
  - {id: "Art.27", kind: article, group: "IV", roles: [controller, processor], plan: [annual, manual], title: "Representatives of controllers or processors not established in the Union", summary: "A controller or processor outside the EU that is subject to the GDPR under Art. 3(2) designates in writing a representative in a Member State where data subjects are, unless an exemption in Art. 27(2) applies.", evidence: "Written mandate of the EU representative; representative named in privacy notices and the Art. 30 register"}
  - {id: "Art.28(1)", kind: article, group: "IV", roles: [controller], plan: [annual, manual], title: "Processor: sufficient guarantees", summary: "The controller uses only processors that provide sufficient guarantees of appropriate technical and organizational measures, assessed before engagement and periodically afterwards.", evidence: "Vendor due diligence or security assessments; list of processors with assessment dates; certifications or audit reports reviewed"}
  - {id: "Art.28(2)", kind: article, group: "IV", roles: [processor], plan: [event, manual], title: "Processor: authorisation of sub-processors", summary: "The processor engages another processor only with the controller's prior specific or general written authorization; under general authorization it informs the controller of intended changes so the controller can object.", evidence: "Sub-processor list; change notifications sent to customers; objection handling records"}
  - {id: "Art.28(3)", kind: article, group: "IV", roles: [controller, processor], plan: [annual, manual], title: "Processor: contract", summary: "Processing by a processor is governed by a contract or legal act that sets out subject matter, duration, nature and purpose, data types, categories of data subjects and the controller's obligations and rights, and contains the clauses in Art. 28(3)(a) to (h).", evidence: "Data processing agreements (DPAs) for each processor, checked against the Art. 28(3) clause list"}
  - {id: "Art.28(3)(a)", kind: article, group: "IV", roles: [processor], plan: [annual, manual], title: "Processor: documented instructions", summary: "The processor processes data only on documented instructions from the controller, including for transfers, and immediately informs the controller if an instruction in its opinion infringes data protection law.", evidence: "Instructions in DPA and service documentation; records of instruction-related notices to customers"}
  - {id: "Art.28(3)(b)", kind: article, group: "IV", roles: [processor], plan: [annual, manual], title: "Processor: confidentiality of authorised persons", summary: "Persons authorized to process the personal data have committed to confidentiality or are under a statutory obligation of confidentiality.", evidence: "Signed confidentiality agreements or employment clauses; list of authorized staff"}
  - {id: "Art.28(3)(e)", kind: article, group: "IV", roles: [processor], plan: [event, manual], title: "Processor: assistance with data subject requests", summary: "The processor assists the controller by appropriate measures in responding to data subject requests, and with Art. 32 to 36 obligations under point (f).", evidence: "Support procedure or tooling for customer data subject requests; records of assistance given"}
  - {id: "Art.28(3)(g)", kind: article, group: "IV", roles: [processor], plan: [event, manual], title: "Processor: deletion or return at end of services", summary: "At the end of the services the processor deletes or returns all personal data at the controller's choice and deletes existing copies unless law requires storage.", evidence: "Offboarding procedure; deletion certificates or logs for terminated customers"}
  - {id: "Art.28(3)(h)", kind: article, group: "IV", roles: [controller, processor], plan: [annual, manual], title: "Processor: audits and information", summary: "The processor makes available all information needed to demonstrate compliance and allows for and contributes to audits and inspections by the controller or its auditor.", evidence: "Audit clause in DPAs; audit reports or questionnaires exchanged; records of customer audits"}
  - {id: "Art.28(4)", kind: article, group: "IV", roles: [processor], plan: [annual, manual], title: "Processor: obligations on sub-processors", summary: "A processor engaging a sub-processor imposes by contract the same data protection obligations as in its contract with the controller and remains fully liable for the sub-processor's performance.", evidence: "Sub-processor contracts with flow-down clauses; sub-processor due diligence"}
  - {id: "Art.29", kind: article, group: "IV", roles: [controller, processor], plan: [annual, manual], title: "Processing under the authority of the controller or processor", summary: "The processor and anyone acting under the authority of the controller or processor with access to personal data process them only on the controller's instructions, unless required by law.", evidence: "Staff instructions and policies; role-based access; onboarding training records"}
  - {id: "Art.30(1)", kind: article, group: "IV", roles: [controller], plan: [annual, manual], title: "Records of processing activities: controller record", summary: "The controller keeps a written record of processing activities with the content listed in Art. 30(1)(a) to (g), keeps it current and makes it available to the supervisory authority on request. The exemption in Art. 30(5) for organizations with fewer than 250 staff rarely applies, as it is lost for non-occasional or risky processing.", evidence: "Record of processing activities (Art. 30 register), current version, with owner and last review date"}
  - {id: "Art.30(2)", kind: article, group: "IV", roles: [processor], plan: [annual, manual], title: "Records of processing activities: processor record", summary: "The processor keeps a written record of all categories of processing carried out on behalf of each controller, with the content in Art. 30(2)(a) to (d), and makes it available to the supervisory authority on request.", evidence: "Processor record of processing activities, current version, listing customers (controllers), processing categories, transfers and security measures"}
  - {id: "Art.31", kind: article, group: "IV", roles: [controller, processor], plan: [event, manual], title: "Cooperation with the supervisory authority", summary: "The controller, processor and their representatives cooperate with the supervisory authority on request, with a defined contact and procedure for authority inquiries.", evidence: "Procedure for supervisory authority inquiries; correspondence log with authorities"}
  - {id: "Art.32(1)", kind: article, group: "IV", roles: [controller, processor], plan: [annual, manual], title: "Security of processing: appropriate measures", summary: "Technical and organizational measures ensure a level of security appropriate to the risk, taking into account the state of the art, costs and the nature, scope, context and purposes of processing.", evidence: "Technical and organizational measures (TOMs) document; information security policy; ISO 27001 or SOC 2 reports where available"}
  - {id: "Art.32(1)(a)", kind: article, group: "IV", roles: [controller, processor], plan: [continuous, automated], title: "Security of processing: pseudonymisation and encryption", summary: "Personal data are pseudonymized and encrypted where appropriate, for example encryption in transit and at rest.", evidence: "Encryption configuration (TLS, storage and database encryption); key management records; pseudonymization approach"}
  - {id: "Art.32(1)(b)", kind: article, group: "IV", roles: [controller, processor], plan: [continuous, automated], title: "Security of processing: confidentiality, integrity, availability and resilience", summary: "Processing systems and services keep their confidentiality, integrity, availability and resilience on an ongoing basis, through access control, monitoring and capacity management.", evidence: "Access control configuration and access reviews; monitoring and alerting; availability metrics"}
  - {id: "Art.32(1)(c)", kind: article, group: "IV", roles: [controller, processor], plan: [quarterly, manual], title: "Security of processing: restoring availability", summary: "Availability of and access to personal data can be restored in a timely manner after a physical or technical incident.", evidence: "Backup configuration and logs; restore test results; business continuity and disaster recovery plan"}
  - {id: "Art.32(1)(d)", kind: article, group: "IV", roles: [controller, processor], plan: [annual, manual], title: "Security of processing: regular testing", summary: "The effectiveness of the security measures is regularly tested, assessed and evaluated.", evidence: "Penetration test reports; vulnerability scan results; security control reviews or internal audits"}
  - {id: "Art.32(2)", kind: article, group: "IV", roles: [controller, processor], plan: [annual, manual], title: "Security of processing: risk assessment", summary: "The appropriate security level is determined by assessing the risks of processing, in particular accidental or unlawful destruction, loss, alteration, unauthorized disclosure of or access to personal data.", evidence: "Information security risk assessment covering personal data; risk register"}
  - {id: "Art.32(4)", kind: article, group: "IV", roles: [controller, processor], plan: [annual, manual], title: "Security of processing: persons acting under authority", summary: "Steps ensure that any person with access to personal data processes them only on instructions, for example through confidentiality commitments and training.", evidence: "Confidentiality agreements; data protection and security awareness training records"}
  - {id: "Art.33(1)", kind: article, group: "IV", roles: [controller], plan: [event, manual], title: "Notification of a personal data breach to the supervisory authority: notification within 72 hours", summary: "A personal data breach is notified to the competent supervisory authority without undue delay and where feasible within 72 hours of awareness, with the content in Art. 33(3), unless it is unlikely to result in a risk; late notifications state the reasons.", evidence: "Breach response procedure; notifications filed with timestamps of awareness and notification; risk assessment per breach"}
  - {id: "Art.33(2)", kind: article, group: "IV", roles: [processor], plan: [event, manual], title: "Notification of a personal data breach to the supervisory authority: processor notifies controller", summary: "The processor notifies the controller without undue delay after becoming aware of a personal data breach.", evidence: "Customer breach notification procedure and contractual notification period; notifications sent to customers"}
  - {id: "Art.33(5)", kind: article, group: "IV", roles: [controller], plan: [continuous, manual], title: "Notification of a personal data breach to the supervisory authority: breach documentation", summary: "All personal data breaches, including those not notified, are documented with the facts, effects and remedial action, so the supervisory authority can verify compliance.", evidence: "Breach register with facts, effects, risk assessment, notification decision and remedial action per breach"}
  - {id: "Art.34", kind: article, group: "IV", roles: [controller], plan: [event, manual], title: "Communication of a personal data breach to the data subject", summary: "When a breach is likely to result in a high risk to individuals, affected data subjects are informed without undue delay in clear and plain language, with the content in Art. 34(2), unless an Art. 34(3) condition applies and is documented.", evidence: "Data subject notification templates; communications sent; documented reasons where no communication was made"}
  - {id: "Art.35(1)", kind: article, group: "IV", roles: [controller], plan: [event, manual], title: "Data protection impact assessment: when required", summary: "Before high-risk processing begins, a data protection impact assessment is carried out. Screening against Art. 35(3) and the supervisory authority's lists decides whether one is needed.", evidence: "DPIA screening records for new or changed processing; completed DPIAs; DPIA register"}
  - {id: "Art.35(2)", kind: article, group: "IV", roles: [controller], plan: [event, manual], title: "Data protection impact assessment: advice of the data protection officer", summary: "Where a DPO is designated, the controller seeks and records the DPO's advice when carrying out a DPIA.", evidence: "DPO opinion documented in each DPIA"}
  - {id: "Art.35(7)", kind: article, group: "IV", roles: [controller], plan: [event, manual], title: "Data protection impact assessment: minimum content", summary: "Each DPIA contains a systematic description of the processing and purposes, an assessment of necessity and proportionality, an assessment of risks to data subjects and the measures envisaged to address them.", evidence: "DPIA template and completed DPIAs checked against the four required elements"}
  - {id: "Art.35(11)", kind: article, group: "IV", roles: [controller], plan: [annual, manual], title: "Data protection impact assessment: review", summary: "DPIAs are reviewed to check that processing follows the assessment, at least when the risk of the processing changes.", evidence: "DPIA review dates and change history"}
  - {id: "Art.36(1)", kind: article, group: "IV", roles: [controller], plan: [event, manual], title: "Prior consultation: consulting the supervisory authority", summary: "Where a DPIA shows high residual risk that the controller cannot mitigate, the supervisory authority is consulted before processing, with the information in Art. 36(3).", evidence: "Prior consultation submissions and authority responses, or DPIA conclusions showing residual risk was mitigated"}
  - {id: "Art.37(1)", kind: article, group: "IV", roles: [controller, processor], plan: [annual, manual], title: "Designation of the data protection officer: when required", summary: "A data protection officer is designated where Art. 37(1) or national law requires it (public body, large-scale regular and systematic monitoring, or large-scale special category or criminal data). Where none is designated, the assessment is documented. The DPO has the expertise required by Art. 37(5).", evidence: "DPO appointment letter or contract; documented assessment of the designation requirement; DPO qualifications"}
  - {id: "Art.37(7)", kind: article, group: "IV", roles: [controller, processor], plan: [annual, manual], title: "Designation of the data protection officer: contact details", summary: "The DPO's contact details are published and communicated to the supervisory authority.", evidence: "Privacy notice listing DPO contact; confirmation of notification to the supervisory authority"}
  - {id: "Art.38(1)", kind: article, group: "IV", roles: [controller, processor], plan: [annual, manual], title: "Position of the data protection officer: involvement", summary: "The DPO is involved properly and in a timely manner in all issues relating to the protection of personal data.", evidence: "DPO participation in project reviews, DPIAs and breach handling; meeting minutes"}
  - {id: "Art.38(2)", kind: article, group: "IV", roles: [controller, processor], plan: [annual, manual], title: "Position of the data protection officer: resources", summary: "The DPO receives the resources, access to personal data and processing operations, and training needed to perform the tasks and maintain expertise.", evidence: "DPO budget and time allocation; training records"}
  - {id: "Art.38(3)", kind: article, group: "IV", roles: [controller, processor], plan: [annual, manual], title: "Position of the data protection officer: independence and reporting", summary: "The DPO receives no instructions on how to perform the tasks, is not dismissed or penalized for performing them and reports directly to the highest management level.", evidence: "Organization chart; DPO reports to management; appointment terms on independence"}
  - {id: "Art.38(6)", kind: article, group: "IV", roles: [controller, processor], plan: [annual, manual], title: "Position of the data protection officer: conflicts of interests", summary: "Other tasks and duties of the DPO do not result in a conflict of interests.", evidence: "Conflict of interest assessment for the DPO role; job description"}
  - {id: "Art.39(1)", kind: article, group: "IV", roles: [controller, processor], plan: [annual, manual], title: "Tasks of the data protection officer", summary: "The DPO informs and advises the organization and staff, monitors compliance including awareness, training and audits, advises on DPIAs and acts as contact point for the supervisory authority.", evidence: "DPO activity or annual report; monitoring and audit records; training plan"}
  - {id: "Art.40", kind: article, group: "IV", roles: [controller, processor], optional: true, plan: [annual, manual], title: "Codes of conduct", summary: "Where the organization adheres to an approved code of conduct, it meets the code's requirements and can show adherence, including binding commitments where the code is used as a transfer safeguard.", evidence: "Declaration of adherence; code compliance self-assessment"}
  - {id: "Art.41", kind: article, group: "IV", roles: [controller, processor], optional: true, plan: [annual, manual], title: "Monitoring of approved codes of conduct", summary: "Where the organization adheres to an approved code, it is monitored by the accredited monitoring body and acts on its findings.", evidence: "Monitoring body reports and findings; corrective actions"}
  - {id: "Art.42", kind: article, group: "IV", roles: [controller, processor], optional: true, plan: [annual, manual], title: "Certification", summary: "Where the organization holds or seeks a GDPR certification, it gives the certification body the information and access needed, the certificate is valid (maximum three years) and its scope matches the processing claimed.", evidence: "Certificate with scope and validity; certification audit reports"}
  - {id: "Art.43", kind: article, group: "IV", roles: [controller, processor], optional: true, plan: [annual, manual], title: "Certification bodies", summary: "Where the organization relies on a certification, the issuing body is accredited under Art. 43 by the supervisory authority or national accreditation body.", evidence: "Accreditation details of the certification body"}

  # Chapter V Transfers of personal data to third countries or international organisations
  - {id: "Art.44", kind: article, group: "V", roles: [controller, processor], plan: [annual, manual], title: "General principle for transfers", summary: "Every transfer of personal data to a third country or international organization, including onward transfers and remote access, is identified and rests on a transfer mechanism in Chapter V.", evidence: "Transfer inventory (from the Art. 30 register and sub-processor list) with mechanism per transfer"}
  - {id: "Art.45", kind: article, group: "V", roles: [controller, processor], plan: [annual, manual], title: "Transfers on the basis of an adequacy decision", summary: "Transfers relying on adequacy go to a country, territory or sector covered by a current Commission adequacy decision, and any conditions such as recipient self-certification under the EU-US Data Privacy Framework are verified.", evidence: "Adequacy decision referenced per transfer; recipient certification checks"}
  - {id: "Art.46(1)", kind: article, group: "V", roles: [controller, processor], plan: [annual, manual], title: "Transfers subject to appropriate safeguards: safeguards and enforceable rights", summary: "Without adequacy, transfers are made only with appropriate safeguards listed in Art. 46(2) or (3), with enforceable data subject rights and effective legal remedies. A transfer impact assessment and supplementary measures address the destination's laws.", evidence: "Safeguard per transfer; transfer impact assessments; supplementary measures"}
  - {id: "Art.46(2)(c)", kind: article, group: "V", roles: [controller, processor], plan: [annual, manual], title: "Transfers subject to appropriate safeguards: standard data protection clauses", summary: "Transfers based on standard contractual clauses use the current Commission clauses with the correct module, completed annexes and no conflicting changes.", evidence: "Executed standard contractual clauses with annexes per recipient"}
  - {id: "Art.47", kind: article, group: "V", roles: [controller, processor], plan: [annual, manual], title: "Binding corporate rules", summary: "Where intra-group transfers rely on binding corporate rules, the rules are approved by the competent supervisory authority, legally binding on group members and applied in practice.", evidence: "BCR approval decision; intra-group agreement; BCR compliance audits"}
  - {id: "Art.48", kind: article, group: "V", roles: [controller, processor], plan: [event, manual], title: "Transfers or disclosures not authorised by Union law", summary: "Requests from third-country courts or authorities to disclose personal data are honored only on the basis of an international agreement such as a mutual legal assistance treaty, under a documented procedure.", evidence: "Government access request procedure; request log; transparency reports"}
  - {id: "Art.49(1)", kind: article, group: "V", roles: [controller, processor], plan: [event, manual], title: "Derogations for specific situations: use of derogations", summary: "Transfers relying on a derogation (explicit consent, contract necessity, public interest, legal claims, vital interests, public register) are occasional, the derogation is documented per transfer, and the residual compelling-legitimate-interest ground is notified to the supervisory authority and data subject.", evidence: "Documented derogation per transfer; explicit consent records where used"}
