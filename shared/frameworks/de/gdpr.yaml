# German text for gdpr.yaml (DSGVO). Keys are the ids in gdpr.yaml; every id there appears here.
#
# Titles use the official German article headings of Verordnung (EU) 2016/679 as
# published in the Official Journal (Amtsblatt der Europäischen Union). An entry for
# a paragraph or point carries the article heading, a colon and a short descriptor.
# Summaries and evidence are paraphrases for navigation, not the official wording.

language: de
framework: {name: DSGVO, title: "Datenschutz-Grundverordnung", reference: "Verordnung (EU) 2016/679"}
groups: {"II": Grundsätze, "III": Rechte der betroffenen Person, "IV": Verantwortlicher und Auftragsverarbeiter, "V": Übermittlungen personenbezogener Daten an Drittländer oder an internationale Organisationen}

items:
  # Kapitel II Grundsätze
  "Art.5(1)(a)": {title: "Grundsätze für die Verarbeitung personenbezogener Daten: Rechtmäßigkeit, Verarbeitung nach Treu und Glauben, Transparenz", summary: "Personenbezogene Daten werden rechtmäßig, nach Treu und Glauben und für die betroffene Person nachvollziehbar verarbeitet. Jede Verarbeitungstätigkeit hat eine dokumentierte Rechtsgrundlage und ist in Datenschutzhinweisen beschrieben.", evidence: "Verzeichnis von Verarbeitungstätigkeiten mit Rechtsgrundlage je Tätigkeit; veröffentlichte Datenschutzhinweise"}
  "Art.5(1)(b)": {title: "Grundsätze für die Verarbeitung personenbezogener Daten: Zweckbindung", summary: "Personenbezogene Daten werden für festgelegte, eindeutige und legitime Zwecke erhoben und nicht in einer damit unvereinbaren Weise weiterverarbeitet. Die Zwecke sind vor Beginn der Verarbeitung dokumentiert.", evidence: "Zwecke je Verarbeitungstätigkeit; Vereinbarkeitsprüfungen für neue Nutzungen vorhandener Daten"}
  "Art.5(1)(c)": {title: "Grundsätze für die Verarbeitung personenbezogener Daten: Datenminimierung", summary: "Es werden nur Daten erhoben und gespeichert, die dem Zweck angemessen, erheblich und auf das notwendige Maß beschränkt sind. Datenfelder werden gegen ihren Zweck geprüft.", evidence: "Dateninventar oder Datenlandkarte mit Begründung je Datenkategorie; Design-Reviews von Formularen und Datenmodellen"}
  "Art.5(1)(d)": {title: "Grundsätze für die Verarbeitung personenbezogener Daten: Richtigkeit", summary: "Personenbezogene Daten sind sachlich richtig und erforderlichenfalls auf dem neuesten Stand; unrichtige Daten werden unverzüglich berichtigt oder gelöscht.", evidence: "Verfahren zur Datenqualität; Selbstbedienung zur Profilpflege; Protokoll der Berichtigungsanträge"}
  "Art.5(1)(e)": {title: "Grundsätze für die Verarbeitung personenbezogener Daten: Speicherbegrenzung", summary: "Personenbezogene Daten werden in identifizierbarer Form nur so lange gespeichert, wie es der Zweck erfordert. Aufbewahrungsfristen sind festgelegt, und Daten werden nach Fristablauf gelöscht oder anonymisiert.", evidence: "Löschkonzept mit Aufbewahrungsfristen; Konfiguration und Laufprotokolle der Löschjobs; Stichproben zur Entfernung abgelaufener Datensätze"}
  "Art.5(1)(f)": {title: "Grundsätze für die Verarbeitung personenbezogener Daten: Integrität und Vertraulichkeit", summary: "Personenbezogene Daten sind durch geeignete technische und organisatorische Maßnahmen vor unbefugter oder unrechtmäßiger Verarbeitung sowie vor unbeabsichtigtem Verlust, Zerstörung oder Schädigung geschützt (näher in Art. 32).", evidence: "Informationssicherheitsrichtlinie; Dokumentation der technischen und organisatorischen Maßnahmen (TOM); Verweis auf Nachweise zu Art. 32"}
  "Art.5(2)": {title: "Grundsätze für die Verarbeitung personenbezogener Daten: Rechenschaftspflicht", summary: "Der Verantwortliche ist für die Einhaltung der Grundsätze verantwortlich und kann sie nachweisen. Ein Datenschutzmanagementsystem legt Zuständigkeiten fest und hält die Dokumentation aktuell.", evidence: "Datenschutzrichtlinie und Governance-Struktur; Datenschutzdokumentation; Berichte interner Datenschutzaudits"}
  "Art.6(1)": {title: "Rechtmäßigkeit der Verarbeitung: Rechtsgrundlage", summary: "Jede Verarbeitungstätigkeit beruht auf mindestens einer Rechtsgrundlage nach Art. 6 Abs. 1 Buchst. a bis f. Wird auf berechtigte Interessen gestützt, ist die Interessenabwägung dokumentiert.", evidence: "Rechtsgrundlage je Tätigkeit im Verzeichnis nach Art. 30; dokumentierte Interessenabwägungen"}
  "Art.6(4)": {title: "Rechtmäßigkeit der Verarbeitung: Vereinbarkeit der Weiterverarbeitung", summary: "Werden Daten ohne Einwilligung oder Rechtsvorschrift für einen neuen Zweck genutzt, prüft eine Vereinbarkeitsprüfung den Zusammenhang der Zwecke, den Kontext, die Art der Daten, die Folgen und vorhandene Garantien.", evidence: "Vereinbarkeitsprüfungen für geänderte oder neue Zwecke"}
  "Art.7(1)": {title: "Bedingungen für die Einwilligung: Nachweis der Einwilligung", summary: "Beruht die Verarbeitung auf einer Einwilligung, kann der Verantwortliche für jede betroffene Person nachweisen, wer wann welchem Text auf welchem Weg zugestimmt hat.", evidence: "Einwilligungsnachweise oder Protokolle der Consent-Management-Plattform mit Zeitstempel, Textversion und Kanal"}
  "Art.7(2)": {title: "Bedingungen für die Einwilligung: unterscheidbares Ersuchen", summary: "Ein Ersuchen um Einwilligung in einer schriftlichen Erklärung, die noch andere Sachverhalte betrifft, ist klar von diesen zu unterscheiden, verständlich, leicht zugänglich und in klarer und einfacher Sprache formuliert.", evidence: "Screenshots von Einwilligungsdialogen und Formularen; Prüfung der Einwilligungstexte"}
  "Art.7(3)": {title: "Bedingungen für die Einwilligung: Widerruf", summary: "Betroffene Personen werden vor der Einwilligung über ihr Widerrufsrecht informiert, der Widerruf ist so einfach wie die Erteilung, und die Verarbeitung endet mit dem Widerruf.", evidence: "Widerrufsmöglichkeit (Präferenzcenter, Abmeldelink); Test, dass der Widerruf wirkt"}
  "Art.7(4)": {title: "Bedingungen für die Einwilligung: Freiwilligkeit", summary: "Die Erfüllung eines Vertrags oder die Erbringung einer Dienstleistung wird nicht von einer Einwilligung in eine Verarbeitung abhängig gemacht, die für den Vertrag nicht erforderlich ist (Kopplungsverbot).", evidence: "Prüfung der Registrierungs- und Bestellprozesse; Einwilligung getrennt von der Annahme der AGB"}
  "Art.8": {title: "Bedingungen für die Einwilligung eines Kindes in Bezug auf Dienste der Informationsgesellschaft", summary: "Stützt sich ein Dienst der Informationsgesellschaft, der Kindern direkt angeboten wird, auf eine Einwilligung, wird diese bei Kindern unter 16 Jahren (oder der niedrigeren nationalen Altersgrenze, nicht unter 13) durch den Träger der elterlichen Verantwortung erteilt oder genehmigt, und dies wird mit angemessenen Anstrengungen überprüft.", evidence: "Altersabfrage und Verfahren zur elterlichen Einwilligung; Prüfmethode; anwendbare nationale Altersgrenzen"}
  "Art.9": {title: "Verarbeitung besonderer Kategorien personenbezogener Daten", summary: "Besondere Kategorien personenbezogener Daten (Gesundheit, biometrische und genetische Daten, rassische oder ethnische Herkunft, politische Meinungen, religiöse Überzeugungen, Gewerkschaftszugehörigkeit, Sexualleben oder sexuelle Orientierung) werden nur auf Grundlage einer Ausnahme nach Art. 9 Abs. 2 verarbeitet, die je Tätigkeit dokumentiert ist.", evidence: "Einträge im Verzeichnis nach Art. 30 mit Kennzeichnung besonderer Kategorien und Ausnahmetatbestand nach Art. 9 Abs. 2; Nachweise ausdrücklicher Einwilligungen"}
  "Art.10": {title: "Verarbeitung von personenbezogenen Daten über strafrechtliche Verurteilungen und Straftaten", summary: "Daten über strafrechtliche Verurteilungen und Straftaten werden nur unter behördlicher Aufsicht oder auf Grundlage einer Rechtsvorschrift mit geeigneten Garantien verarbeitet, etwa bei gesetzlich zulässigen Führungszeugnisprüfungen.", evidence: "Rechtliche Prüfung für Führungszeugnisse und Hintergrundprüfungen; Zugriffsbeschränkungen auf diese Daten"}
  "Art.11": {title: "Verarbeitung, für die eine Identifizierung der betroffenen Person nicht erforderlich ist", summary: "Der Verantwortliche erhebt oder speichert keine zusätzlichen Daten nur zur Identifizierung betroffener Personen. Kann er eine antragstellende Person nicht identifizieren, unterrichtet er sie nach Möglichkeit und berücksichtigt zusätzliche Informationen, die sie bereitstellt.", evidence: "Verfahren für Anträge zu pseudonymisierten oder nicht identifizierenden Daten; Antwortvorlagen"}

  # Kapitel III Rechte der betroffenen Person
  "Art.12(1)": {title: "Transparente Information, Kommunikation und Modalitäten für die Ausübung der Rechte der betroffenen Person: präzise und verständliche Information", summary: "Informationen und Mitteilungen an betroffene Personen sind präzise, transparent, verständlich und leicht zugänglich und in klarer und einfacher Sprache abgefasst, insbesondere wenn sie sich an Kinder richten.", evidence: "Datenschutzhinweise und deren Verständlichkeitsprüfung; Platzierung und Erreichbarkeit der Hinweise"}
  "Art.12(2)": {title: "Transparente Information, Kommunikation und Modalitäten für die Ausübung der Rechte der betroffenen Person: Erleichterung der Rechteausübung", summary: "Der Verantwortliche erleichtert die Ausübung der Rechte nach Art. 15 bis 22 durch dokumentierte Kontaktwege und ein internes Verfahren zur Bearbeitung von Anträgen.", evidence: "Verfahren für Betroffenenanfragen; Kontaktwege (Webformular, E-Mail-Adresse); Zuständigkeiten"}
  "Art.12(3)": {title: "Transparente Information, Kommunikation und Modalitäten für die Ausübung der Rechte der betroffenen Person: Frist für die Beantwortung", summary: "Anträge werden unverzüglich, spätestens innerhalb eines Monats nach Eingang beantwortet; eine Verlängerung um höchstens zwei weitere Monate wird begründet und der betroffenen Person innerhalb des ersten Monats mitgeteilt.", evidence: "Protokoll der Betroffenenanfragen mit Eingangs- und Antwortdatum; Mitteilungen über Fristverlängerungen"}
  "Art.12(4)": {title: "Transparente Information, Kommunikation und Modalitäten für die Ausübung der Rechte der betroffenen Person: Nichttätigwerden", summary: "Wird der Verantwortliche auf einen Antrag hin nicht tätig, teilt er der betroffenen Person innerhalb eines Monats die Gründe sowie die Möglichkeit einer Beschwerde bei einer Aufsichtsbehörde und eines gerichtlichen Rechtsbehelfs mit.", evidence: "Ablehnungsschreiben oder Vorlagen; Einträge abgelehnter Anträge im Protokoll"}
  "Art.12(5)": {title: "Transparente Information, Kommunikation und Modalitäten für die Ausübung der Rechte der betroffenen Person: Unentgeltlichkeit", summary: "Informationen und Maßnahmen auf Anträge sind unentgeltlich. Ein Entgelt oder eine Weigerung bei offenkundig unbegründeten oder exzessiven Anträgen wird mit Begründung dokumentiert.", evidence: "Protokoll der Anträge ohne erhobene Entgelte oder mit dokumentierter Begründung für Entgelt oder Weigerung"}
  "Art.12(6)": {title: "Transparente Information, Kommunikation und Modalitäten für die Ausübung der Rechte der betroffenen Person: Identitätsprüfung", summary: "Bestehen begründete Zweifel an der Identität der antragstellenden Person, fordert der Verantwortliche verhältnismäßige zusätzliche Informationen zur Bestätigung an, bevor er Daten herausgibt.", evidence: "Verfahren zur Identitätsprüfung; Stichproben geprüfter Anträge"}
  "Art.13": {title: "Informationspflicht bei Erhebung von personenbezogenen Daten bei der betroffenen Person", summary: "Zum Zeitpunkt der Erhebung erhalten betroffene Personen die Informationen nach Art. 13 Abs. 1 und 2: Name und Kontaktdaten, Datenschutzbeauftragter, Zwecke und Rechtsgrundlage, berechtigte Interessen, Empfänger, Drittlandübermittlungen, Speicherdauer, Rechte, Widerruf der Einwilligung, Beschwerderecht, Pflicht zur Bereitstellung und automatisierte Entscheidungsfindung. Ein neuer Zweck löst eine aktualisierte Information aus.", evidence: "Datenschutzhinweise abgeglichen mit der Checkliste nach Art. 13; Versionen und Änderungshistorie; Erhebungsstellen mit Hinweis"}
  "Art.14": {title: "Informationspflicht, wenn die personenbezogenen Daten nicht bei der betroffenen Person erhoben wurden", summary: "Stammen Daten aus anderen Quellen, erhalten betroffene Personen die Informationen nach Art. 14 einschließlich Datenkategorien und Quelle innerhalb einer angemessenen Frist, spätestens nach einem Monat, oder bei der ersten Mitteilung oder Offenlegung. Ausnahmen nach Art. 14 Abs. 5 sind dokumentiert.", evidence: "Informationen für nicht bei der betroffenen Person erhobene Daten; dokumentierte Ausnahmen nach Art. 14 Abs. 5"}
  "Art.15(1)": {title: "Auskunftsrecht der betroffenen Person: Bestätigung und Informationen", summary: "Auf Antrag bestätigt der Verantwortliche, ob er Daten der Person verarbeitet, und nennt Zwecke, Kategorien, Empfänger, Speicherdauer, Rechte, Herkunft, Angaben zu automatisierten Entscheidungen und Garantien bei Drittlandübermittlungen.", evidence: "Protokoll der Auskunftsersuchen; Stichproben von Auskünften; Auskunftsvorlage"}
  "Art.15(3)": {title: "Auskunftsrecht der betroffenen Person: Kopie der Daten", summary: "Der Verantwortliche stellt eine Kopie der verarbeiteten personenbezogenen Daten zur Verfügung, bei elektronischem Antrag in einem gängigen elektronischen Format, ohne die Rechte anderer zu beeinträchtigen.", evidence: "Verfahren oder Werkzeug zum Datenexport über alle Systeme; Stichproben von Kopien mit geschwärzten Daten Dritter"}
  "Art.16": {title: "Recht auf Berichtigung", summary: "Unrichtige personenbezogene Daten werden auf Antrag unverzüglich berichtigt und unvollständige Daten vervollständigt.", evidence: "Berichtigungsanträge im Protokoll der Betroffenenanfragen; Änderungsnachweise in den Systemen"}
  "Art.17(1)": {title: "Recht auf Löschung („Recht auf Vergessenwerden“): Löschung auf Antrag", summary: "Personenbezogene Daten werden unverzüglich gelöscht, wenn ein Grund nach Art. 17 Abs. 1 vorliegt, in allen Systemen einschließlich Sicherungen im Rahmen ihres Aufbewahrungszyklus, sofern keine dokumentierte Ausnahme nach Art. 17 Abs. 3 greift.", evidence: "Löschverfahren über alle Systeme; Protokoll der Löschanträge; Löschbestätigungen; dokumentierte Ausnahmen"}
  "Art.17(2)": {title: "Recht auf Löschung („Recht auf Vergessenwerden“): öffentlich gemachte Daten", summary: "Hat der Verantwortliche die Daten öffentlich gemacht, trifft er angemessene Maßnahmen, um andere Verantwortliche, die die Daten verarbeiten, über das Verlangen auf Löschung von Links, Kopien oder Replikationen zu informieren.", evidence: "Verfahren zur Information anderer Verantwortlicher; Nachweise versandter Mitteilungen"}
  "Art.18": {title: "Recht auf Einschränkung der Verarbeitung", summary: "Liegt ein Grund nach Art. 18 Abs. 1 vor, wird die Verarbeitung eingeschränkt (Daten werden gespeichert, aber nicht anderweitig genutzt), und die betroffene Person wird vor Aufhebung der Einschränkung unterrichtet.", evidence: "Technische Möglichkeit zur Sperrung oder Kennzeichnung eingeschränkter Datensätze; Einschränkungsanträge im Protokoll"}
  "Art.19": {title: "Mitteilungspflicht im Zusammenhang mit der Berichtigung oder Löschung personenbezogener Daten oder der Einschränkung der Verarbeitung", summary: "Allen Empfängern, denen Daten offengelegt wurden, wird jede Berichtigung, Löschung oder Einschränkung mitgeteilt, sofern dies nicht unmöglich oder unverhältnismäßig ist; auf Verlangen werden der betroffenen Person die Empfänger genannt.", evidence: "Verfahren zur Benachrichtigung von Empfängern; Nachweise der Mitteilungen an Empfänger und Auftragsverarbeiter"}
  "Art.20": {title: "Recht auf Datenübertragbarkeit", summary: "Von der Person bereitgestellte Daten, die automatisiert auf Grundlage von Einwilligung oder Vertrag verarbeitet werden, stellt der Verantwortliche in einem strukturierten, gängigen und maschinenlesbaren Format bereit und übermittelt sie, soweit technisch machbar, an einen anderen Verantwortlichen.", evidence: "Exportfunktion in maschinenlesbaren Formaten (JSON, CSV); Anträge auf Datenübertragbarkeit im Protokoll"}
  "Art.21(1)": {title: "Widerspruchsrecht: Verarbeitung auf Grundlage öffentlicher oder berechtigter Interessen", summary: "Widerspricht eine betroffene Person einer Verarbeitung nach Art. 6 Abs. 1 Buchst. e oder f, wird die Verarbeitung beendet, sofern keine zwingenden schutzwürdigen Gründe, die die Interessen der Person überwiegen, oder Rechtsansprüche nachgewiesen werden.", evidence: "Verfahren zur Bearbeitung von Widersprüchen; Widerspruchsprotokoll mit Ergebnis und dokumentierten Gründen"}
  "Art.21(3)": {title: "Widerspruchsrecht: Direktwerbung", summary: "Widerspricht eine betroffene Person der Verarbeitung für Direktwerbung einschließlich damit verbundenem Profiling, werden ihre Daten nicht mehr für diesen Zweck verarbeitet.", evidence: "Sperrliste und deren Abgleich mit Marketingwerkzeugen; Test der Wirksamkeit des Widerspruchs"}
  "Art.21(4)": {title: "Widerspruchsrecht: Hinweis auf das Recht", summary: "Die betroffene Person wird spätestens bei der ersten Kommunikation ausdrücklich auf das Widerspruchsrecht hingewiesen, verständlich und getrennt von anderen Informationen.", evidence: "Abschnitt zum Widerspruchsrecht in den Datenschutzhinweisen; Erstkontakt-Kommunikation und Werbe-E-Mails"}
  "Art.22(1)": {title: "Automatisierte Entscheidungen im Einzelfall einschließlich Profiling: zulässige Ausnahmen", summary: "Ausschließlich automatisierte Entscheidungen mit rechtlicher oder ähnlich erheblicher Wirkung sind erfasst, und jede beruht auf einer Ausnahme nach Art. 22 Abs. 2: Erforderlichkeit für einen Vertrag, Zulassung durch Rechtsvorschrift oder ausdrückliche Einwilligung.", evidence: "Übersicht automatisierter Entscheidungen und Profiling; dokumentierte Ausnahme nach Art. 22 Abs. 2 je Anwendungsfall"}
  "Art.22(3)": {title: "Automatisierte Entscheidungen im Einzelfall einschließlich Profiling: Schutzmaßnahmen", summary: "Bei automatisierten Entscheidungen auf Grundlage von Vertrag oder Einwilligung können betroffene Personen das Eingreifen einer Person erwirken, ihren Standpunkt darlegen und die Entscheidung anfechten.", evidence: "Verfahren zur menschlichen Überprüfung; Kanal zur Anfechtung; Protokolle überprüfter Entscheidungen"}

  # Kapitel IV Verantwortlicher und Auftragsverarbeiter
  "Art.24(1)": {title: "Verantwortung des für die Verarbeitung Verantwortlichen: geeignete Maßnahmen", summary: "Der Verantwortliche setzt technische und organisatorische Maßnahmen um, die der Art, dem Umfang, den Umständen und den Zwecken der Verarbeitung sowie ihren Risiken entsprechen, kann sie nachweisen und überprüft und aktualisiert sie erforderlichenfalls.", evidence: "Dokumentation des Datenschutzmanagementsystems; Risikobewertung; Nachweis der regelmäßigen Überprüfung"}
  "Art.24(2)": {title: "Verantwortung des für die Verarbeitung Verantwortlichen: Datenschutzvorkehrungen", summary: "Soweit verhältnismäßig, bestehen geeignete Datenschutzvorkehrungen (Datenschutzrichtlinien), die freigegeben, bekannt gemacht und aktuell gehalten werden.", evidence: "Freigegebene Datenschutzrichtlinie mit Version und Prüfdatum; Kenntnisnahmebestätigungen der Beschäftigten"}
  "Art.25(1)": {title: "Datenschutz durch Technikgestaltung und durch datenschutzfreundliche Voreinstellungen: Technikgestaltung", summary: "Bei Entwurf und Änderung von Systemen und Prozessen werden Maßnahmen wie Pseudonymisierung und Datenminimierung eingebaut, um die Grundsätze umzusetzen, unter Berücksichtigung von Stand der Technik, Kosten und Risiko.", evidence: "Datenschutzprüfung im Entwicklungs- oder Änderungsprozess; ausgefüllte Privacy-by-Design-Checklisten für aktuelle Projekte"}
  "Art.25(2)": {title: "Datenschutz durch Technikgestaltung und durch datenschutzfreundliche Voreinstellungen: datenschutzfreundliche Voreinstellungen", summary: "Durch Voreinstellung werden nur die für den jeweiligen Zweck erforderlichen Daten verarbeitet, bezogen auf Menge, Umfang der Verarbeitung, Speicherfrist und Zugänglichkeit; Daten werden nicht ohne Eingreifen der Person einer unbestimmten Zahl von Personen zugänglich gemacht.", evidence: "Dokumentation und Screenshots der Voreinstellungen (datenschutzfreundliche Standardwerte, Profilsichtbarkeit); Prüfung voreingestellter Speicherfristen und Zugriffe"}
  "Art.26(1)": {title: "Gemeinsam für die Verarbeitung Verantwortliche: Vereinbarung", summary: "Legen zwei oder mehr Verantwortliche gemeinsam Zwecke und Mittel fest, regelt eine transparente Vereinbarung ihre jeweiligen Pflichten, insbesondere zu Betroffenenrechten und Informationspflichten.", evidence: "Vereinbarungen über gemeinsame Verantwortlichkeit; Übersicht der Fälle gemeinsamer Verantwortlichkeit"}
  "Art.26(2)": {title: "Gemeinsam für die Verarbeitung Verantwortliche: wesentlicher Inhalt für betroffene Personen", summary: "Die Vereinbarung spiegelt die tatsächlichen Funktionen und Beziehungen wider, und ihr wesentlicher Inhalt wird der betroffenen Person zur Verfügung gestellt.", evidence: "Abschnitt in den Datenschutzhinweisen mit dem wesentlichen Inhalt der Vereinbarung"}
  "Art.27": {title: "Vertreter von nicht in der Union niedergelassenen Verantwortlichen oder Auftragsverarbeitern", summary: "Ein Verantwortlicher oder Auftragsverarbeiter außerhalb der EU, der nach Art. 3 Abs. 2 der DSGVO unterliegt, benennt schriftlich einen Vertreter in einem Mitgliedstaat, in dem sich betroffene Personen befinden, sofern keine Ausnahme nach Art. 27 Abs. 2 greift.", evidence: "Schriftliche Benennung des EU-Vertreters; Vertreter in Datenschutzhinweisen und im Verzeichnis nach Art. 30 genannt"}
  "Art.28(1)": {title: "Auftragsverarbeiter: hinreichende Garantien", summary: "Der Verantwortliche arbeitet nur mit Auftragsverarbeitern, die hinreichende Garantien für geeignete technische und organisatorische Maßnahmen bieten; dies wird vor der Beauftragung und danach regelmäßig geprüft.", evidence: "Dienstleisterprüfungen oder Sicherheitsbewertungen; Liste der Auftragsverarbeiter mit Prüfdatum; geprüfte Zertifikate oder Prüfberichte"}
  "Art.28(2)": {title: "Auftragsverarbeiter: Genehmigung weiterer Auftragsverarbeiter", summary: "Der Auftragsverarbeiter nimmt weitere Auftragsverarbeiter (Unterauftragsverarbeiter) nur mit vorheriger gesonderter oder allgemeiner schriftlicher Genehmigung des Verantwortlichen in Anspruch; bei allgemeiner Genehmigung informiert er über beabsichtigte Änderungen, damit der Verantwortliche Einspruch erheben kann.", evidence: "Liste der Unterauftragsverarbeiter; an Kunden versandte Änderungsmitteilungen; Bearbeitung von Einsprüchen"}
  "Art.28(3)": {title: "Auftragsverarbeiter: Vertrag", summary: "Die Auftragsverarbeitung beruht auf einem Vertrag oder Rechtsinstrument, der Gegenstand, Dauer, Art und Zweck, Art der Daten, Kategorien betroffener Personen sowie Pflichten und Rechte des Verantwortlichen festlegt und die Regelungen nach Art. 28 Abs. 3 Buchst. a bis h enthält.", evidence: "Auftragsverarbeitungsverträge (AVV) für jeden Auftragsverarbeiter, abgeglichen mit der Liste nach Art. 28 Abs. 3"}
  "Art.28(3)(a)": {title: "Auftragsverarbeiter: dokumentierte Weisungen", summary: "Der Auftragsverarbeiter verarbeitet Daten nur auf dokumentierte Weisung des Verantwortlichen, auch bei Drittlandübermittlungen, und informiert den Verantwortlichen unverzüglich, wenn eine Weisung seiner Auffassung nach gegen Datenschutzrecht verstößt.", evidence: "Weisungen im AVV und in der Leistungsbeschreibung; Nachweise von Hinweisen an Kunden zu Weisungen"}
  "Art.28(3)(b)": {title: "Auftragsverarbeiter: Vertraulichkeit der befugten Personen", summary: "Die zur Verarbeitung befugten Personen haben sich zur Vertraulichkeit verpflichtet oder unterliegen einer angemessenen gesetzlichen Verschwiegenheitspflicht.", evidence: "Unterzeichnete Vertraulichkeitsverpflichtungen oder Arbeitsvertragsklauseln; Liste befugter Beschäftigter"}
  "Art.28(3)(e)": {title: "Auftragsverarbeiter: Unterstützung bei Anträgen betroffener Personen", summary: "Der Auftragsverarbeiter unterstützt den Verantwortlichen mit geeigneten Maßnahmen bei der Beantwortung von Anträgen betroffener Personen und nach Buchst. f bei den Pflichten aus Art. 32 bis 36.", evidence: "Support-Verfahren oder Werkzeuge für Betroffenenanfragen der Kunden; Nachweise geleisteter Unterstützung"}
  "Art.28(3)(g)": {title: "Auftragsverarbeiter: Löschung oder Rückgabe nach Abschluss der Leistungen", summary: "Nach Abschluss der Leistungen löscht der Auftragsverarbeiter nach Wahl des Verantwortlichen alle personenbezogenen Daten oder gibt sie zurück und löscht vorhandene Kopien, sofern keine Speicherpflicht besteht.", evidence: "Offboarding-Verfahren; Löschbestätigungen oder Protokolle für beendete Kundenverhältnisse"}
  "Art.28(3)(h)": {title: "Auftragsverarbeiter: Informationen und Überprüfungen", summary: "Der Auftragsverarbeiter stellt alle Informationen zum Nachweis der Pflichten bereit und ermöglicht Überprüfungen einschließlich Inspektionen durch den Verantwortlichen oder einen beauftragten Prüfer und trägt dazu bei.", evidence: "Prüfklausel im AVV; ausgetauschte Prüfberichte oder Fragebögen; Nachweise von Kundenaudits"}
  "Art.28(4)": {title: "Auftragsverarbeiter: Pflichten weiterer Auftragsverarbeiter", summary: "Nimmt der Auftragsverarbeiter einen weiteren Auftragsverarbeiter in Anspruch, legt er ihm vertraglich dieselben Datenschutzpflichten auf wie im Vertrag mit dem Verantwortlichen und haftet für dessen Pflichterfüllung.", evidence: "Verträge mit Unterauftragsverarbeitern mit weitergegebenen Pflichten; Prüfung der Unterauftragsverarbeiter"}
  "Art.29": {title: "Verarbeitung unter der Aufsicht des Verantwortlichen oder des Auftragsverarbeiters", summary: "Der Auftragsverarbeiter und alle dem Verantwortlichen oder Auftragsverarbeiter unterstellten Personen mit Zugang zu personenbezogenen Daten verarbeiten diese nur auf Weisung des Verantwortlichen, sofern keine Rechtspflicht besteht.", evidence: "Arbeitsanweisungen und Richtlinien; rollenbasierte Zugriffe; Schulungsnachweise beim Onboarding"}
  "Art.30(1)": {title: "Verzeichnis von Verarbeitungstätigkeiten: Verzeichnis des Verantwortlichen", summary: "Der Verantwortliche führt ein schriftliches Verzeichnis von Verarbeitungstätigkeiten mit den Angaben nach Art. 30 Abs. 1 Buchst. a bis g, hält es aktuell und stellt es der Aufsichtsbehörde auf Anfrage zur Verfügung. Die Ausnahme nach Art. 30 Abs. 5 für Einrichtungen mit weniger als 250 Beschäftigten greift selten, da sie bei nicht nur gelegentlicher oder risikobehafteter Verarbeitung entfällt.", evidence: "Verzeichnis von Verarbeitungstätigkeiten (VVT nach Art. 30), aktuelle Fassung, mit Verantwortlichem und letztem Prüfdatum"}
  "Art.30(2)": {title: "Verzeichnis von Verarbeitungstätigkeiten: Verzeichnis des Auftragsverarbeiters", summary: "Der Auftragsverarbeiter führt ein schriftliches Verzeichnis aller Kategorien von im Auftrag jedes Verantwortlichen durchgeführten Verarbeitungen mit den Angaben nach Art. 30 Abs. 2 Buchst. a bis d und stellt es der Aufsichtsbehörde auf Anfrage zur Verfügung.", evidence: "Verzeichnis des Auftragsverarbeiters, aktuelle Fassung, mit Kunden (Verantwortlichen), Verarbeitungskategorien, Drittlandübermittlungen und Sicherheitsmaßnahmen"}
  "Art.31": {title: "Zusammenarbeit mit der Aufsichtsbehörde", summary: "Verantwortlicher, Auftragsverarbeiter und ihre Vertreter arbeiten auf Anfrage mit der Aufsichtsbehörde zusammen; für behördliche Anfragen bestehen eine feste Ansprechstelle und ein Verfahren.", evidence: "Verfahren für Anfragen der Aufsichtsbehörde; Korrespondenzprotokoll mit Behörden"}
  "Art.32(1)": {title: "Sicherheit der Verarbeitung: geeignete Maßnahmen", summary: "Technische und organisatorische Maßnahmen gewährleisten ein dem Risiko angemessenes Schutzniveau unter Berücksichtigung des Stands der Technik, der Implementierungskosten sowie der Art, des Umfangs, der Umstände und der Zwecke der Verarbeitung.", evidence: "Dokumentation der technischen und organisatorischen Maßnahmen (TOM); Informationssicherheitsrichtlinie; ISO-27001-Zertifikat oder SOC-2-Bericht, soweit vorhanden"}
  "Art.32(1)(a)": {title: "Sicherheit der Verarbeitung: Pseudonymisierung und Verschlüsselung", summary: "Personenbezogene Daten werden, soweit angemessen, pseudonymisiert und verschlüsselt, etwa bei der Übertragung und im Ruhezustand.", evidence: "Verschlüsselungskonfiguration (TLS, Speicher- und Datenbankverschlüsselung); Nachweise zum Schlüsselmanagement; Pseudonymisierungskonzept"}
  "Art.32(1)(b)": {title: "Sicherheit der Verarbeitung: Vertraulichkeit, Integrität, Verfügbarkeit und Belastbarkeit", summary: "Vertraulichkeit, Integrität, Verfügbarkeit und Belastbarkeit der Systeme und Dienste werden auf Dauer sichergestellt, durch Zugriffskontrolle, Überwachung und Kapazitätsmanagement.", evidence: "Konfiguration der Zugriffskontrolle und Berechtigungsprüfungen; Überwachung und Alarmierung; Verfügbarkeitskennzahlen"}
  "Art.32(1)(c)": {title: "Sicherheit der Verarbeitung: Wiederherstellung der Verfügbarkeit", summary: "Verfügbarkeit von und Zugang zu personenbezogenen Daten können nach einem physischen oder technischen Zwischenfall rasch wiederhergestellt werden.", evidence: "Backup-Konfiguration und -Protokolle; Ergebnisse von Wiederherstellungstests; Notfall- und Wiederanlaufplan"}
  "Art.32(1)(d)": {title: "Sicherheit der Verarbeitung: regelmäßige Überprüfung", summary: "Die Wirksamkeit der Sicherheitsmaßnahmen wird regelmäßig überprüft, bewertet und evaluiert.", evidence: "Penetrationstestberichte; Ergebnisse von Schwachstellenscans; Kontrollprüfungen oder interne Audits"}
  "Art.32(2)": {title: "Sicherheit der Verarbeitung: Risikobewertung", summary: "Das angemessene Schutzniveau wird anhand der Risiken der Verarbeitung bestimmt, insbesondere Vernichtung, Verlust, Veränderung, unbefugte Offenlegung von oder unbefugter Zugang zu personenbezogenen Daten.", evidence: "Informationssicherheits-Risikobewertung für personenbezogene Daten; Risikoregister"}
  "Art.32(4)": {title: "Sicherheit der Verarbeitung: unterstellte Personen", summary: "Es wird sichergestellt, dass Personen mit Zugang zu personenbezogenen Daten diese nur auf Anweisung verarbeiten, etwa durch Vertraulichkeitsverpflichtungen und Schulungen.", evidence: "Vertraulichkeitsverpflichtungen; Nachweise zu Datenschutz- und Sicherheitsschulungen"}
  "Art.33(1)": {title: "Meldung von Verletzungen des Schutzes personenbezogener Daten an die Aufsichtsbehörde: Meldung binnen 72 Stunden", summary: "Eine Verletzung des Schutzes personenbezogener Daten wird der zuständigen Aufsichtsbehörde unverzüglich und möglichst binnen 72 Stunden nach Bekanntwerden mit den Angaben nach Art. 33 Abs. 3 gemeldet, es sei denn, sie führt voraussichtlich nicht zu einem Risiko; verspätete Meldungen werden begründet.", evidence: "Verfahren zur Behandlung von Datenschutzverletzungen; eingereichte Meldungen mit Zeitpunkt des Bekanntwerdens und der Meldung; Risikobewertung je Vorfall"}
  "Art.33(2)": {title: "Meldung von Verletzungen des Schutzes personenbezogener Daten an die Aufsichtsbehörde: Meldung des Auftragsverarbeiters an den Verantwortlichen", summary: "Der Auftragsverarbeiter meldet dem Verantwortlichen eine Verletzung des Schutzes personenbezogener Daten unverzüglich, nachdem sie ihm bekannt wurde.", evidence: "Verfahren zur Meldung an Kunden und vertragliche Meldefrist; an Kunden versandte Meldungen"}
  "Art.33(5)": {title: "Meldung von Verletzungen des Schutzes personenbezogener Daten an die Aufsichtsbehörde: Dokumentation von Verletzungen", summary: "Alle Verletzungen des Schutzes personenbezogener Daten, auch nicht gemeldete, werden mit Fakten, Auswirkungen und ergriffenen Abhilfemaßnahmen dokumentiert, sodass die Aufsichtsbehörde die Einhaltung prüfen kann.", evidence: "Register der Datenschutzverletzungen mit Sachverhalt, Auswirkungen, Risikobewertung, Meldeentscheidung und Abhilfemaßnahmen je Vorfall"}
  "Art.34": {title: "Benachrichtigung der von einer Verletzung des Schutzes personenbezogener Daten betroffenen Person", summary: "Hat eine Verletzung voraussichtlich ein hohes Risiko für Personen zur Folge, werden die betroffenen Personen unverzüglich in klarer und einfacher Sprache mit den Angaben nach Art. 34 Abs. 2 benachrichtigt, sofern keine dokumentierte Bedingung nach Art. 34 Abs. 3 vorliegt.", evidence: "Vorlagen für Benachrichtigungen; versandte Benachrichtigungen; dokumentierte Gründe, wenn keine Benachrichtigung erfolgte"}
  "Art.35(1)": {title: "Datenschutz-Folgenabschätzung: Erforderlichkeit", summary: "Vor Beginn einer Verarbeitung mit voraussichtlich hohem Risiko wird eine Datenschutz-Folgenabschätzung durchgeführt. Eine Vorprüfung anhand von Art. 35 Abs. 3 und der Listen der Aufsichtsbehörde entscheidet, ob sie erforderlich ist.", evidence: "Dokumentierte Schwellwertanalysen für neue oder geänderte Verarbeitungen; durchgeführte DSFA; DSFA-Übersicht"}
  "Art.35(2)": {title: "Datenschutz-Folgenabschätzung: Rat des Datenschutzbeauftragten", summary: "Ist ein Datenschutzbeauftragter benannt, holt der Verantwortliche bei der Durchführung einer DSFA dessen Rat ein und dokumentiert ihn.", evidence: "Stellungnahme des Datenschutzbeauftragten in jeder DSFA"}
  "Art.35(7)": {title: "Datenschutz-Folgenabschätzung: Mindestinhalt", summary: "Jede DSFA enthält eine systematische Beschreibung der Verarbeitung und ihrer Zwecke, eine Bewertung von Notwendigkeit und Verhältnismäßigkeit, eine Bewertung der Risiken für die betroffenen Personen und die geplanten Abhilfemaßnahmen.", evidence: "DSFA-Vorlage und durchgeführte DSFA, geprüft auf die vier Pflichtbestandteile"}
  "Art.35(11)": {title: "Datenschutz-Folgenabschätzung: Überprüfung", summary: "DSFA werden daraufhin überprüft, ob die Verarbeitung gemäß der Folgenabschätzung erfolgt, zumindest wenn sich das Risiko der Verarbeitung ändert.", evidence: "Prüfdaten und Änderungshistorie der DSFA"}
  "Art.36(1)": {title: "Vorherige Konsultation: Konsultation der Aufsichtsbehörde", summary: "Zeigt eine DSFA ein hohes Restrisiko, das der Verantwortliche nicht eindämmen kann, wird die Aufsichtsbehörde vor der Verarbeitung mit den Angaben nach Art. 36 Abs. 3 konsultiert.", evidence: "Konsultationsunterlagen und Antworten der Aufsichtsbehörde oder DSFA-Ergebnisse, die die Eindämmung des Restrisikos belegen"}
  "Art.37(1)": {title: "Benennung eines Datenschutzbeauftragten: Benennungspflicht", summary: "Ein Datenschutzbeauftragter wird benannt, wo Art. 37 Abs. 1 oder nationales Recht es verlangt (Behörde, umfangreiche regelmäßige und systematische Überwachung, umfangreiche Verarbeitung besonderer Kategorien oder strafrechtlicher Daten; in Deutschland zusätzlich nach § 38 BDSG). Ohne Benennung ist die Prüfung dokumentiert. Der Datenschutzbeauftragte hat die Fachkunde nach Art. 37 Abs. 5.", evidence: "Benennungsschreiben oder Vertrag des Datenschutzbeauftragten; dokumentierte Prüfung der Benennungspflicht; Nachweise der Fachkunde"}
  "Art.37(7)": {title: "Benennung eines Datenschutzbeauftragten: Kontaktdaten", summary: "Die Kontaktdaten des Datenschutzbeauftragten sind veröffentlicht und der Aufsichtsbehörde mitgeteilt.", evidence: "Datenschutzhinweise mit Kontaktdaten des Datenschutzbeauftragten; Bestätigung der Meldung an die Aufsichtsbehörde"}
  "Art.38(1)": {title: "Stellung des Datenschutzbeauftragten: Einbindung", summary: "Der Datenschutzbeauftragte wird ordnungsgemäß und frühzeitig in alle Fragen eingebunden, die mit dem Schutz personenbezogener Daten zusammenhängen.", evidence: "Beteiligung des Datenschutzbeauftragten an Projektprüfungen, DSFA und Vorfallbehandlung; Besprechungsprotokolle"}
  "Art.38(2)": {title: "Stellung des Datenschutzbeauftragten: Ressourcen", summary: "Der Datenschutzbeauftragte erhält die erforderlichen Ressourcen, Zugang zu personenbezogenen Daten und Verarbeitungsvorgängen sowie Fortbildung zur Erhaltung seines Fachwissens.", evidence: "Budget und Zeitkontingent des Datenschutzbeauftragten; Fortbildungsnachweise"}
  "Art.38(3)": {title: "Stellung des Datenschutzbeauftragten: Weisungsfreiheit und Berichtsweg", summary: "Der Datenschutzbeauftragte erhält keine Anweisungen zur Ausübung seiner Aufgaben, wird wegen ihrer Erfüllung nicht abberufen oder benachteiligt und berichtet unmittelbar der höchsten Managementebene.", evidence: "Organigramm; Berichte des Datenschutzbeauftragten an die Geschäftsleitung; Benennungsbedingungen zur Unabhängigkeit"}
  "Art.38(6)": {title: "Stellung des Datenschutzbeauftragten: Interessenkonflikte", summary: "Andere Aufgaben und Pflichten des Datenschutzbeauftragten führen nicht zu einem Interessenkonflikt.", evidence: "Prüfung von Interessenkonflikten für die Rolle; Stellenbeschreibung"}
  "Art.39(1)": {title: "Aufgaben des Datenschutzbeauftragten", summary: "Der Datenschutzbeauftragte unterrichtet und berät die Organisation und die Beschäftigten, überwacht die Einhaltung einschließlich Sensibilisierung, Schulung und Überprüfungen, berät zur DSFA und ist Anlaufstelle für die Aufsichtsbehörde.", evidence: "Tätigkeits- oder Jahresbericht des Datenschutzbeauftragten; Nachweise zu Überwachung und Audits; Schulungsplan"}
  "Art.40": {title: "Verhaltensregeln", summary: "Hält sich die Organisation an genehmigte Verhaltensregeln, erfüllt sie deren Anforderungen und kann dies nachweisen, einschließlich verbindlicher Verpflichtungen, wenn die Verhaltensregeln als Garantie für Drittlandübermittlungen dienen.", evidence: "Beitrittserklärung; Selbstbewertung zur Einhaltung der Verhaltensregeln"}
  "Art.41": {title: "Überwachung der genehmigten Verhaltensregeln", summary: "Hält sich die Organisation an genehmigte Verhaltensregeln, wird sie von der akkreditierten Überwachungsstelle überwacht und setzt deren Feststellungen um.", evidence: "Berichte und Feststellungen der Überwachungsstelle; Korrekturmaßnahmen"}
  "Art.42": {title: "Zertifizierung", summary: "Hält oder beantragt die Organisation eine Datenschutz-Zertifizierung, stellt sie der Zertifizierungsstelle die nötigen Informationen und Zugänge bereit; das Zertifikat ist gültig (höchstens drei Jahre) und sein Geltungsbereich deckt die beanspruchte Verarbeitung ab.", evidence: "Zertifikat mit Geltungsbereich und Gültigkeit; Zertifizierungsprüfberichte"}
  "Art.43": {title: "Zertifizierungsstellen", summary: "Stützt sich die Organisation auf eine Zertifizierung, ist die ausstellende Stelle nach Art. 43 von der Aufsichtsbehörde oder der nationalen Akkreditierungsstelle akkreditiert.", evidence: "Akkreditierungsnachweis der Zertifizierungsstelle"}

  # Kapitel V Übermittlungen personenbezogener Daten an Drittländer oder an internationale Organisationen
  "Art.44": {title: "Allgemeine Grundsätze der Datenübermittlung", summary: "Jede Übermittlung personenbezogener Daten an ein Drittland oder eine internationale Organisation, einschließlich Weiterübermittlungen und Fernzugriffen, ist erfasst und beruht auf einem Übermittlungsinstrument nach Kapitel V.", evidence: "Übersicht der Drittlandübermittlungen (aus dem Verzeichnis nach Art. 30 und der Liste der Unterauftragsverarbeiter) mit Instrument je Übermittlung"}
  "Art.45": {title: "Datenübermittlung auf der Grundlage eines Angemessenheitsbeschlusses", summary: "Übermittlungen auf Grundlage der Angemessenheit gehen in ein Land, Gebiet oder einen Sektor mit gültigem Angemessenheitsbeschluss der Kommission; Bedingungen wie die Selbstzertifizierung des Empfängers nach dem EU-US Data Privacy Framework werden geprüft.", evidence: "Angemessenheitsbeschluss je Übermittlung; Prüfung der Zertifizierung des Empfängers"}
  "Art.46(1)": {title: "Datenübermittlung vorbehaltlich geeigneter Garantien: Garantien und durchsetzbare Rechte", summary: "Ohne Angemessenheitsbeschluss erfolgen Übermittlungen nur mit geeigneten Garantien nach Art. 46 Abs. 2 oder 3, durchsetzbaren Rechten und wirksamen Rechtsbehelfen für betroffene Personen. Eine Transfer-Folgenabschätzung (Transfer Impact Assessment) und ergänzende Maßnahmen berücksichtigen die Rechtslage im Zielland.", evidence: "Garantie je Übermittlung; Transfer-Folgenabschätzungen; ergänzende Maßnahmen"}
  "Art.46(2)(c)": {title: "Datenübermittlung vorbehaltlich geeigneter Garantien: Standarddatenschutzklauseln", summary: "Übermittlungen auf Grundlage von Standardvertragsklauseln verwenden die aktuellen Klauseln der Kommission mit dem richtigen Modul, ausgefüllten Anhängen und ohne widersprechende Änderungen.", evidence: "Abgeschlossene Standardvertragsklauseln mit Anhängen je Empfänger"}
  "Art.47": {title: "Verbindliche interne Datenschutzvorschriften", summary: "Stützen sich konzerninterne Übermittlungen auf verbindliche interne Datenschutzvorschriften (Binding Corporate Rules), sind diese von der zuständigen Aufsichtsbehörde genehmigt, für die Konzernmitglieder rechtlich bindend und werden in der Praxis angewandt.", evidence: "Genehmigungsbeschluss der BCR; konzerninterne Vereinbarung; Prüfungen zur Einhaltung der BCR"}
  "Art.48": {title: "Nach dem Unionsrecht nicht zulässige Übermittlung oder Offenlegung", summary: "Ersuchen von Gerichten oder Behörden aus Drittländern auf Offenlegung personenbezogener Daten werden nur auf Grundlage einer internationalen Übereinkunft wie eines Rechtshilfeabkommens und nach einem dokumentierten Verfahren beantwortet.", evidence: "Verfahren für behördliche Zugriffsersuchen; Protokoll der Ersuchen; Transparenzberichte"}
  "Art.49(1)": {title: "Ausnahmen für bestimmte Fälle: Anwendung der Ausnahmen", summary: "Übermittlungen auf Grundlage einer Ausnahme (ausdrückliche Einwilligung, Vertragserfüllung, öffentliches Interesse, Rechtsansprüche, lebenswichtige Interessen, öffentliches Register) erfolgen nur gelegentlich, die Ausnahme ist je Übermittlung dokumentiert, und der Auffangtatbestand zwingender berechtigter Interessen wird der Aufsichtsbehörde und der betroffenen Person mitgeteilt.", evidence: "Dokumentierte Ausnahme je Übermittlung; Nachweise ausdrücklicher Einwilligungen"}
