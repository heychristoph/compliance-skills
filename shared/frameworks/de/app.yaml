# Deutsche Texte zu shared/frameworks/app.yaml, gleiche IDs.
#
# Eigene Formulierungen. Fachbegriffe folgen der deutschen Fassung der DSGVO und
# der NIS-2-Richtlinie, wie in de/gdpr.yaml und de/nis2.yaml: Verantwortlicher,
# Auftragsverarbeiter, weitere Auftragsverarbeiter (Unterauftragsverarbeiter),
# Auftragsverarbeitungsvertrag (AVV), technische und organisatorische Maßnahmen
# (TOM), Verzeichnis von Verarbeitungstätigkeiten, Verletzung des Schutzes
# personenbezogener Daten. Produkt- und Konfigurationsnamen bleiben englisch.

language: de
framework: {name: App-Bewertung, title: "Sicherheit und Datenverarbeitung einer Anwendung"}
groups: {"SEC-AC": Zugriffskontrolle und Autorisierung, "SEC-AUTH": Authentifizierung und Sitzungen, "SEC-DATA": Schutz der Daten bei Speicherung und Übertragung, "SEC-CODE": "Sicherer Code, Secrets und Abhängigkeiten", "SEC-OPS": "Betrieb: Protokollierung, Datensicherung, Umgebungen, Änderungen", "DP-INV": Dateninventar und Zwecke, "DP-SUP": "Weitere Auftragsverarbeiter, Verträge und Übermittlungen", "DP-LIFE": "Aufbewahrung, Löschung und Rückgabe", "DP-INC": Sicherheitsvorfälle und Meldung von Datenschutzverletzungen, "DP-AI": KI und automatisierte Verarbeitung}

items:
  # SEC-AC Zugriffskontrolle und Autorisierung
  "SEC-AC-01": {title: "Zeilenbasierte Zugriffsrichtlinien (Row Level Security) sind für jede erreichbare Tabelle aktiv", summary: "Jede Tabelle, View oder Collection, die über die Client-API erreichbar ist (anonyme oder angemeldete Rolle, Firestore, Realtime Database), hat Row Level Security oder Security Rules aktiviert. Keine Tabelle mit Nutzerdaten ist standardmäßig offen.", evidence: "RLS-Status je Tabelle in den freigegebenen Schemas aus dem Security Advisor der Datenbank oder `pg_tables.rowsecurity`; Liste der Tabellen ohne RLS mit Begründung; bereitgestellte Security Rules für Firestore, Realtime Database und Storage", question: "Haben alle Tabellen, die die Client-API der App erreichen kann, Row Level Security (oder Firebase Security Rules) aktiviert?"}
  "SEC-AC-02": {title: "Zugriffsrichtlinien beschränken Zeilen auf Eigentümer, Team oder Mandanten", summary: "Jede zeilenbasierte Richtlinie oder Security Rule bindet Lese- und Schreibzugriffe an die angemeldete Person, ihr Team oder ihren Mandanten. Keine Richtlinie gewährt Zugriff mit einer stets wahren Bedingung, und angemeldete Nutzer können Zeilen anderer Nutzer oder Mandanten weder lesen noch ändern.", evidence: "Richtliniendefinitionen aus `pg_policies` oder Migrationen (USING- und WITH-CHECK-Klauseln auf Basis von `auth.uid()` oder einer Mitgliedschaftstabelle); Firebase Rules ohne `if true` oder bloßes `request.auth != null`; Test mit zwei Konten, der zeigt, dass eines die Zeilen des anderen weder lesen noch ändern kann; Mandantenspalte und Richtlinie je mandantenfähiger Tabelle", question: "Beschränken die Zugriffsrichtlinien jeden Nutzer auf seine eigenen Zeilen (oder die seines Teams oder Mandanten), beim Lesen wie beim Schreiben, ohne eine Richtlinie, die allen Zugriff gewährt?"}
  "SEC-AC-03": {title: "Autorisierung wird auf dem Server durchgesetzt, nicht nur in der Oberfläche", summary: "Rollen und Berechtigungen (Admin, Mitarbeiter, Kunde) werden bei jeder Anfrage durch Datenbankrichtlinien oder Servercode geprüft. Das Ausblenden von Schaltflächen, Routen oder Seiten im Frontend ist nicht der einzige Schutz, und einer Rolle, die der Nutzer selbst ändern kann (etwa in User-Metadaten oder im Browser-Speicher), wird nicht vertraut.", evidence: "Richtlinien und Servercode, die Rollen aus einer serverseitig kontrollierten Quelle lesen (Rollentabelle, Custom Claims, `app_metadata`) und nicht aus `user_metadata` oder dem Browser-Speicher; Admin-Routen und ihre serverseitigen Prüfungen; Test, bei dem eine Admin-Funktion oder -Tabelle mit dem Token eines normalen Nutzers direkt aufgerufen wird", question: "Würde der Server ablehnen, wenn ein normaler Nutzer die Admin-Funktionen oder -Tabellen unter Umgehung der Oberfläche direkt aufruft?"}
  "SEC-AC-04": {title: "Serverfunktionen, API-Routen und Webhooks authentifizieren den Aufrufer", summary: "Jede Edge Function, Serverless Function und API-Route prüft entweder das Token des Nutzers oder bei maschinellen Aufrufern wie Zahlungs-Webhooks und geplanten Jobs eine Signatur oder ein gemeinsames Geheimnis. Funktionen, bei denen die Token-Prüfung der Plattform abgeschaltet ist, haben eine eigene Prüfung.", evidence: "Funktionskonfiguration (etwa `verify_jwt` in `supabase/config.toml`); Routencode, der Tokens mit dem SDK der Plattform prüft statt sie nur zu dekodieren; Prüfung von Webhook-Signaturen; Liste bewusst öffentlicher Endpunkte mit Begründung", question: "Prüft jede Serverfunktion und jeder API-Endpunkt, wer ihn aufruft, auch bei Webhooks und geplanten Jobs?"}
  "SEC-AC-05": {title: "Datenbankfunktionen, Views und freigegebene Schemas umgehen keine Zugriffsregeln", summary: "Views, Datenbankfunktionen und RPC-Endpunkte, die mit erhöhten Rechten laufen (Security Definer), sind für anonyme oder normale Nutzer nicht aufrufbar, es sei denn, sie setzen dieselben Prüfungen durch. Die automatisch erzeugte API gibt nur die Schemas frei, die die App braucht.", evidence: "Befunde des Security Advisors der Datenbank (Security-Definer-Views, veränderlicher Suchpfad von Funktionen, offengelegte Auth-Tabellen); `EXECUTE`-Rechte auf Funktionen für die anonyme und die angemeldete Rolle; Views mit `security_invoker`; Einstellung der freigegebenen Schemas; GraphQL-Endpunkt und Introspection-Einstellung", question: "Gibt es Views oder Datenbankfunktionen mit erhöhten Rechten, über die Nutzer Daten sehen könnten, die die zeilenbasierten Richtlinien sperren würden?"}
  "SEC-AC-06": {title: "Storage-Buckets sind privat und zugriffsgeschützt", summary: "Buckets mit Dateien von Nutzern sind privat, und Storage-Richtlinien binden jedes Objekt an seinen Eigentümer. Öffentliche Buckets enthalten nur Inhalte, die für alle bestimmt sind, und private Dateien werden über kurzlebige signierte URLs geteilt.", evidence: "Liste der Buckets mit Öffentlich-Kennzeichen (Supabase Storage, Firebase Storage, S3, Vercel Blob und ähnliche); Storage-Richtlinien oder Rules je Bucket; Gültigkeitsdauer signierter URLs im Code; Prüfung, dass ein öffentlicher Bucket nicht aufgelistet werden kann, um Nutzerdateien zu finden", question: "Sind alle Buckets mit Nutzerdateien privat und ist der Zugriff auf den Eigentümer der Datei beschränkt?"}
  "SEC-AC-07": {title: "Zugriff des Teams auf die Produktion ist namentlich, minimal und aktuell", summary: "Nur namentlich benannte Personen, die es brauchen, sind Mitglieder im Produktionsprojekt, Hosting-Team, in der Datenbank, im Repository und im Workspace des KI-Builders, jeweils mit der niedrigsten ausreichenden Rolle. Gemeinsame Logins werden nicht genutzt, und Personen, die ausgeschieden sind oder die Rolle gewechselt haben, wurden entfernt. Support-Zugriffe auf Produktionsdaten sind begrenzt und nachvollziehbar.", evidence: "Export der Mitglieder und Rollen der BaaS-Organisation, des Hosting-Teams, des Cloud-Projekts, des Repositorys und des KI-Builder-Workspace; Liste der Personen mit Dashboard- oder direktem Datenbankzugriff auf Produktionsdaten und Begründung; Datum der letzten Berechtigungsprüfung; Nachweise zum Offboarding", question: "Wer bei Ihnen kann auf die Produktionsdaten oder ihre Verwaltungskonsolen zugreifen, und ist diese Liste aktuell und auf die nötigen Personen beschränkt?"}

  # SEC-AUTH Authentifizierung und Sitzungen
  "SEC-AUTH-01": {title: "E-Mail-Adressen werden bestätigt, bevor ein Konto aktiv ist", summary: "Neue Konten müssen ihre E-Mail-Adresse oder Telefonnummer bestätigen, bevor sie sich anmelden oder auf Nutzerdaten zugreifen können, damit sich niemand mit der Adresse einer anderen Person registriert. Auch eine Änderung der E-Mail-Adresse wird bestätigt.", evidence: "Einstellungen des Auth-Anbieters (bei Supabase E-Mail-Bestätigung und sichere E-Mail-Änderung; bei Firebase Prüfung von `email_verified` in Rules oder Code); Registrierungstest mit unbestätigter Adresse", question: "Müssen neue Nutzer ihre E-Mail-Adresse bestätigen, bevor sie die App nutzen können?"}
  "SEC-AUTH-02": {title: "Die Passwortrichtlinie folgt aktuellen Empfehlungen", summary: "Passwörter haben eine Mindestlänge von mindestens 8 Zeichen (länger ist besser), lange Passwörter sind erlaubt, und neue Passwörter werden gegen bekannte kompromittierte Passwörter geprüft. Erzwungene Zeichenregeln und regelmäßige Passwortwechsel werden nicht verlangt.", evidence: "Passworteinstellungen des Auth-Anbieters (Mindestlänge, geforderte Zeichen, Schutz vor geleakten Passwörtern); Passwortrichtlinie in Firebase; eigene Prüfung im Registrierungscode", question: "Welche Mindestlänge für Passwörter erzwingt die App, und lehnt sie Passwörter ab, die aus Datenlecks bekannt sind?"}
  "SEC-AUTH-03": {title: "Anmeldung, Registrierung und Passwortrücksetzung sind ratenbegrenzt", summary: "Endpunkte für Anmeldung, Registrierung, Passwortrücksetzung, Magic Links und Einmalcodes begrenzen Versuche je Konto und je IP-Adresse. Wo die Registrierung öffentlich offen ist, ist ein Bot-Schutz wie ein CAPTCHA eingerichtet.", evidence: "Einstellungen zur Ratenbegrenzung im Auth-Anbieter; Konfiguration von CAPTCHA oder Bot-Schutz (Turnstile, hCaptcha, reCAPTCHA, Firebase App Check); eigene Ratenbegrenzung in API-Routen", question: "Begrenzt die App wiederholte Anmelde-, Registrierungs- und Rücksetzversuche?"}
  "SEC-AUTH-04": {title: "Administratoren der App nutzen Multifaktor-Authentifizierung", summary: "Nutzer mit Admin- oder Mitarbeiterrolle in der App müssen einen zweiten Faktor (Authenticator-App, Passkey oder Sicherheitsschlüssel) verwenden, um Admin-Funktionen zu erreichen, und der Server prüft das Authentifizierungsniveau, bevor er sie freigibt.", evidence: "MFA-Einstellungen des Auth-Anbieters; serverseitige Prüfung des Authentifizierungsniveaus (etwa des Claims `aal2` in Richtlinien oder Route-Handlern); Liste der Admin-Nutzer mit ihrem MFA-Status", question: "Müssen sich Nutzer mit Admin-Rechten in der App mit einem zweiten Faktor anmelden?"}
  "SEC-AUTH-05": {title: "Konten für Hosting und Verwaltungskonsolen nutzen Multifaktor-Authentifizierung", summary: "Jedes Konto, das das Produktivsystem erreichen kann (BaaS-Dashboard, Hosting, Cloud-Konsole, Repository, KI-Builder, Domain-Registrar und DNS), hat Multifaktor-Authentifizierung aktiviert, auf Organisationsebene erzwungen, wo die Plattform das erlaubt.", evidence: "Einstellungen zur MFA-Pflicht der Organisation oder MFA-Status der Mitglieder je Plattform; Single-Sign-on-Konfiguration, soweit genutzt", question: "Nutzen alle Konten mit Zugriff auf die Produktionskonsolen, das Repository und das DNS Multifaktor-Authentifizierung?"}
  "SEC-AUTH-06": {title: "Sitzungen laufen ab und können widerrufen werden", summary: "Zugriffstokens sind kurzlebig, Refresh-Tokens werden mit Erkennung von Wiederverwendung rotiert und haben eine Höchstlaufzeit, und Abmeldung, Passwortänderung und Kontolöschung beenden die betroffenen Sitzungen.", evidence: "Auth-Einstellungen zu Ablauf der Zugriffstokens, Rotation und Wiederverwendungsintervall der Refresh-Tokens, Inaktivitäts- und Höchstdauer der Sitzung; Abmeldecode und sein Geltungsbereich; Attribute der Sitzungs-Cookies", question: "Wie lange dauern Nutzersitzungen, und werden sie bei Abmeldung, Passwortänderung und Kontolöschung beendet?"}
  "SEC-AUTH-07": {title: "Nur benötigte Anmeldeverfahren sind aktiv und Weiterleitungs-URLs sind beschränkt", summary: "Anmeldeanbieter, anonyme Anmeldung sowie Standard- oder Testkonten, die die App nicht braucht, sind in der Produktion deaktiviert. OAuth-Weiterleitungs- und Site-URLs sind eine exakte Liste der eigenen Domains der App, ohne breite Platzhalter.", evidence: "Aktivierte Anbieter in den Auth-Einstellungen; Einstellung zur anonymen Anmeldung; Allow List der Weiterleitungs-URLs und Site-URL; autorisierte Domains in Firebase; Nutzerliste der Produktion auf Standard- und Testkonten geprüft", question: "Sind ungenutzte Anmeldeverfahren und Testkonten abgeschaltet, und sind Weiterleitungs-URLs auf Ihre eigenen Domains beschränkt?"}

  # SEC-DATA Schutz der Daten bei Speicherung und Übertragung
  "SEC-DATA-01": {title: "Personenbezogene Daten werden in der EU gespeichert und verarbeitet", summary: "Datenbank, Dateispeicher, Serverless Functions, Backups und Protokolle mit personenbezogenen Daten laufen in einer Region in der EU oder im EWR. Jede Komponente außerhalb des EWR ist dokumentiert und durch ein Übermittlungsinstrument abgedeckt.", evidence: "Region in den BaaS- und Hosting-Einstellungen (Datenbankregion, Funktionsregion, Standort von Storage und Firestore); Standort von Protokollen und Backups laut Anbieterdokumentation; Liste der Komponenten außerhalb des EWR mit Übermittlungsgrundlage", question: "In welcher Region laufen Datenbank, Dateispeicher, Funktionen und Backups?"}
  "SEC-DATA-02": {title: "Daten werden verschlüsselt übertragen und die Datenbank ist nicht offen erreichbar", summary: "Die App wird nur über HTTPS mit HSTS und TLS 1.2 oder höher ausgeliefert. Verbindungen zur Datenbank und zwischen Diensten nutzen TLS, und direkter Datenbankzugriff ist auf die Netze oder Clients beschränkt, die ihn brauchen.", evidence: "TLS-Scan der Domains der App; HSTS-Header; Einstellung zur SSL-Pflicht der Datenbank; Netzwerkbeschränkungen oder IP-Allow-List der Datenbank; Verbindungszeichenfolgen mit TLS-Pflicht", question: "Ist der gesamte Verkehr zur App und zur Datenbank verschlüsselt, und ist direkter Datenbankzugriff beschränkt?"}
  "SEC-DATA-03": {title: "Gespeicherte Daten sind verschlüsselt", summary: "Datenbank, Dateispeicher und Backups sind vom Anbieter im Ruhezustand verschlüsselt. Besonders schutzbedürftige Felder (Gesundheitsdaten, Ausweisdokumente, Tokens für andere Dienste) werden zusätzlich auf Spalten- oder Anwendungsebene verschlüsselt, wo das Risiko es erfordert.", evidence: "Anbieterdokumentation oder Einstellungen, die die Verschlüsselung im Ruhezustand für Datenbank, Speicher und Backups belegen; Liste schutzbedürftiger Spalten und ihres Schutzes (etwa eine Vault-Erweiterung oder verschlüsselte Spalten); Inhaber der Schlüssel", question: "Sind Datenbank, Dateien und Backups im Ruhezustand verschlüsselt, und sind besonders schutzbedürftige Felder zusätzlich geschützt?"}
  "SEC-DATA-04": {title: "Der Client erhält nur die Daten, die er braucht", summary: "Abfragen und API-Antworten liefern nur die Felder, die eine Ansicht braucht, keine ganzen Datensätze und keine Daten anderer Nutzer. Personenbezogene Daten stehen nicht in URLs oder Query-Strings, und der Browser-Speicher enthält außer dem Sitzungstoken keine schutzbedürftigen Daten.", evidence: "Abfragen im Client (`select('*')` auf Tabellen mit personenbezogenen Daten, Lesen ganzer Dokumente); Netzwerkmitschnitt wichtiger Ansichten; URL-Muster; Inhalt von localStorage, sessionStorage und IndexedDB nach der Anmeldung", question: "Lädt das Frontend nur die Felder, die es anzeigt, und hält es personenbezogene Daten aus URLs und dem Browser-Speicher heraus?"}
  "SEC-DATA-05": {title: "Drittanbieter-Skripte und Tracker erhalten keine undokumentierten personenbezogenen Daten", summary: "Skripte für Analyse, Session Replay, Fehlerüberwachung und Werbung erhalten nur die personenbezogenen Daten, die dokumentiert und, wo nötig, durch Einwilligung gedeckt sind. Session Replay maskiert Formulareingaben, und kein Tracker lädt vor der Einwilligung, wo eine Einwilligung nötig ist.", evidence: "Von der App geladene Drittanbieter-Skripte (Netzwerkmitschnitt, Tag Manager); Einstellungen zu Analyse und Replay (Maskierung von Eingaben, IP-Kürzung, Hosting in der EU); Datenbereinigung im Fehler-Tracker; Verhalten des Consent-Banners vor der Einwilligung", question: "Welche Analyse-, Replay- oder Tracking-Werkzeuge laufen in der App, und welche personenbezogenen Daten erhalten sie?"}

  # SEC-CODE Sicherer Code, Secrets und Abhängigkeiten
  "SEC-CODE-01": {title: "Keine privilegierten Schlüssel im Frontend-Code", summary: "Das Frontend-Bundle und die mobile App enthalten nur Schlüssel, die öffentlich sein dürfen, etwa den anonymen oder Publishable Key und die Firebase-Web-Konfiguration. Service-Role-Schlüssel, Zugangsdaten des Admin-SDK, geheime API-Schlüssel und Schlüssel von KI-Anbietern werden nur auf dem Server verwendet.", evidence: "Suche im Quellcode und im gebauten Bundle nach Service-Role-Schlüsseln, Mustern geheimer Schlüssel, Admin-Zugangsdaten und KI-API-Schlüsseln; Umgebungsvariablen mit öffentlichen Präfixen (`NEXT_PUBLIC_`, `VITE_`, `EXPO_PUBLIC_`) und ihr Inhalt; Ort der Initialisierung des Admin-SDK", question: "Wird ein Service-Role-, Admin- oder geheimer API-Schlüssel in Code verwendet, der im Browser oder in der mobilen App läuft?"}
  "SEC-CODE-02": {title: "Secrets liegen in einem Secret Store, nicht im Repository", summary: "API-Schlüssel, Datenbankpasswörter und Signaturgeheimnisse liegen in den Umgebungsvariablen oder im Secret Store der Plattform, getrennt je Umgebung, und nie im Repository oder seiner Historie. Secret Scanning ist aktiv, und jedes jemals eingecheckte Secret wurde rotiert.", evidence: "Secret-Scan des Repositorys einschließlich Historie (etwa mit gitleaks oder trufflehog); Einstellungen zu Secret Scanning und Push Protection; `.gitignore` für `.env`-Dateien; Umgebungsvariablen je Umgebung auf Hosting- und BaaS-Plattform; Nachweis der Rotation offengelegter Secrets", question: "Wurden jemals Schlüssel oder Passwörter in das Repository eingecheckt, und falls ja, wurden sie rotiert?"}
  "SEC-CODE-03": {title: "Abhängigkeiten haben keine bekannten kritischen oder hohen Schwachstellen", summary: "Zum Bewertungsstichtag weisen die direkten und transitiven Abhängigkeiten der App keine bekannten kritischen oder hohen Schwachstellen ohne dokumentierte Begründung auf, eine eingecheckte Lockfile legt die Versionen fest, und kein Framework und keine Laufzeitumgebung ist außerhalb des Supports.", evidence: "Ausgabe von `npm audit`, `pnpm audit`, `pip-audit` oder eines Software-Composition-Scans gegen die Lockfile; Lockfile im Repository; Versionen von Framework und Laufzeitumgebung im Abgleich mit ihrem Supportstatus", question: "Wann haben Sie die Bibliotheken der App zuletzt auf bekannte Schwachstellen geprüft, und sind kritische oder hohe Befunde offen?"}
  "SEC-CODE-04": {title: "Schwachstellenmeldungen werden überwacht und fristgerecht behoben", summary: "Automatische Meldungen zu Abhängigkeiten und Sicherheit sind aktiviert, eine benannte Person bewertet sie, und Behebungen folgen festgelegten Fristen je Schweregrad. Sicherheitshinweise der Plattformen und Befunde des Advisors werden ebenfalls geprüft.", evidence: "Konfiguration von Dependabot oder Renovate und Verlauf der Meldungen; Behebungsfristen je Schweregrad; geschlossene Meldungen mit Datum; Prüfung des Security Advisors der BaaS-Plattform", question: "Wer erhält Meldungen zu Abhängigkeiten und Sicherheit der App, und wie schnell werden kritische behoben?"}
  "SEC-CODE-05": {title: "Eingaben werden serverseitig validiert und Ausgaben kodiert", summary: "Servercode und Datenbankfunktionen prüfen Eingaben gegen erwartete Typen und Grenzen, bilden Abfragen mit Parametern statt durch Verkettung von Zeichenketten und geben Nutzerinhalte aus, ohne rohes HTML einzuschleusen. Serverseitige Anfragen an vom Nutzer gelieferte URLs sind beschränkt.", evidence: "Validierungsschemas in API-Routen und Funktionen; aus Zeichenketten zusammengesetztes SQL; Verwendung von `dangerouslySetInnerHTML`, `v-html` oder `innerHTML` mit Nutzerdaten; HTML-Sanitizer für Rich Text; Allow List für serverseitige Abrufe; Ergebnisse statischer Analyse", question: "Prüft der Server alle Eingaben, und werden Nutzerinhalte ohne rohes HTML angezeigt?"}
  "SEC-CODE-06": {title: "Die Produktionskonfiguration ist gehärtet", summary: "Antworten der Produktion enthalten Sicherheits-Header (eine Content-Security-Policy mit frame-ancestors, X-Content-Type-Options), CORS lässt bei Endpunkten mit Anmeldedaten nur die eigenen Origins der App zu, Debug-Modi sind aus, und Fehlermeldungen an Nutzer zeigen keine Stacktraces oder Interna.", evidence: "Antwort-Header der Hauptseiten und der API (Header-Scan); CORS-Header von Funktionen und API-Routen (kein Platzhalter-Origin bei authentifizierten Endpunkten); Header-Konfiguration des Hostings; Fehlerantworten der Produktion; kein `.git`, keine `.env` und keine Source Maps mit Secrets auf der öffentlichen Seite", question: "Sendet die Produktionsseite Sicherheits-Header, beschränkt sie CORS auf Ihre eigenen Domains und verbirgt sie interne Fehlerdetails?"}
  "SEC-CODE-07": {title: "Die App wurde vor der Freigabe auf Sicherheit getestet", summary: "Vor dem Go-live und nach größeren Änderungen wurde die App auf Sicherheit getestet, mindestens mit dem Security Advisor der Plattform und einem automatischen Scan, bei schutzbedürftigen Daten auch mit einem Penetrationstest. Befunde sind behoben oder mit Begründung akzeptiert.", evidence: "Ausgabe von Security Advisor oder Linter; Berichte statischer oder dynamischer Scans; Penetrationstestbericht mit Datum; Befundliste mit Status", question: "Wurde die App mit einem Scan oder Penetrationstest auf Sicherheit geprüft, und was ist mit den Befunden geschehen?"}

  # SEC-OPS Betrieb: Protokollierung, Datensicherung, Umgebungen, Änderungen
  "SEC-OPS-01": {title: "Backups und Point-in-Time-Recovery sind aktiviert", summary: "Die Produktionsdatenbank wird automatisch gesichert, mit einer Aufbewahrung, die den vereinbarten Wiederherstellungspunkt erfüllt, und mit Point-in-Time-Recovery, wo der Tarif sie bietet. Gespeicherte Dateien und Auth-Nutzer, die Datenbank-Backups womöglich nicht erfassen, werden ebenfalls gesichert.", evidence: "Einstellungen zu Backups und Point-in-Time-Recovery und Liste der letzten Sicherungen; Aufbewahrungsdauer; Sicherungsverfahren für Storage-Buckets und Auth-Daten; geplante Firestore-Exporte oder Point-in-Time-Recovery; vereinbarte Ziele für Wiederherstellungspunkt und Wiederherstellungszeit", question: "Wie werden Produktionsdaten gesichert, wie lange werden Backups aufbewahrt, und sind hochgeladene Dateien enthalten?"}
  "SEC-OPS-02": {title: "Die Wiederherstellung aus dem Backup wurde getestet", summary: "Innerhalb der letzten zwölf Monate wurden Datenbank und Dateien in ein separates Projekt wiederhergestellt, die Dauer wurde festgehalten, und die Schritte sind dokumentiert.", evidence: "Nachweis des letzten Wiederherstellungstests mit Datum, Umfang, Dauer und Ergebnis; Runbook für die Wiederherstellung", question: "Wann haben Sie die App zuletzt aus einem Backup wiederhergestellt, und wie lange hat es gedauert?"}
  "SEC-OPS-03": {title: "Sicherheitsereignisse werden protokolliert und lösen Alarme aus", summary: "Authentifizierungsereignisse, Fehler in API und Funktionen sowie administrative Änderungen werden protokolliert, für eine festgelegte Dauer aufbewahrt und vor Veränderung geschützt. Alarme bei Fehlern, auffälligen Anmeldungen und Kontingentgrenzen erreichen eine benannte Person.", evidence: "Protokolleinstellungen und Aufbewahrung von BaaS, Hosting und Funktionen (Auth-Protokolle, API-Protokolle, Datenbank-Audit-Protokolle wie pgAudit); Log Drain oder Export; Alarmregeln und Empfänger; Leserechte auf die Protokolle", question: "Welche Protokolle führt die App, wie lange, und wer wird alarmiert, wenn etwas Ungewöhnliches passiert?"}
  "SEC-OPS-04": {title: "Protokolle enthalten keine Secrets und keine unnötigen personenbezogenen Daten", summary: "Protokolle der Anwendung und der Funktionen erfassen keine Passwörter, Tokens, API-Schlüssel oder vollständigen Anfrageinhalte mit personenbezogenen Daten. Personenbezogene Daten in Protokollen sind auf das für den Zweck Nötige beschränkt und werden mit den Protokollen nach Ablauf der Aufbewahrungsfrist gelöscht.", evidence: "Suche im Code nach Protokollierung von Anfrageinhalten, Nutzerobjekten, Tokens und Headern; Stichprobe von Protokolleinträgen der Produktion; Aufbewahrungseinstellung der Protokolle; Datenbereinigung im Fehler-Tracker", question: "Könnten die Protokolle der App Passwörter, Tokens oder personenbezogene Daten wie Namen, E-Mail-Adressen oder Nachrichteninhalte enthalten?"}
  "SEC-OPS-05": {title: "Produktion ist von Entwicklung und Test getrennt", summary: "Entwicklungs-, Vorschau- und Testumgebungen nutzen eigene Projekte und Datenbanken, nicht die der Produktion. Personenbezogene Produktionsdaten werden nicht ohne Anonymisierung dorthin kopiert, und Vorschau-Deployments und lokale Umgebungen haben keine Produktionsschlüssel.", evidence: "Liste der Umgebungen mit ihrem BaaS-Projekt und ihrer Datenbank; Umgebungsvariablen von Vorschau- und Entwicklungs-Deployments; Herkunft von Seed- und Testdaten; etwaige Kopien von Produktionsdaten und ihre Anonymisierung", question: "Nutzen Entwicklung und Test eine von der Produktion getrennte Datenbank, und gelangen Produktionsdaten dorthin?"}
  "SEC-OPS-06": {title: "Änderungen werden geprüft und versioniert, bevor sie in die Produktion gelangen", summary: "Der Hauptbranch ist geschützt: Änderungen kommen per Pull Request mit Review und bestandenen Prüfungen, und niemand pusht oder force-pusht direkt darauf. Schema und Zugriffsrichtlinien liegen als Migrationen im Repository, und die Produktion wird aus dem geprüften Branch bereitgestellt, nicht von Hand geändert oder direkt aus einem KI-Builder übertragen.", evidence: "Branch Protection oder Ruleset des Hauptbranches (Pflicht-Reviews, Statusprüfungen, kein Force Push); zusammengeführte Pull Requests mit Reviews; Migrationsordner im Abgleich mit dem Live-Schema; Einstellung der Deployment-Quelle auf der Hosting-Plattform", question: "Ist der Hauptbranch so geschützt, dass Änderungen ein Review brauchen, und werden Datenbankänderungen über versionierte Migrationen vorgenommen?"}
  "SEC-OPS-07": {title: "Hosting-Tarif und Limits tragen die vereinbarte Verfügbarkeit", summary: "Das Produktionsprojekt läuft in einem Tarif ohne automatisches Pausieren oder harte Limits, die die App vom Netz nehmen würden, Ausgaben- und Kontingentgrenzen sind bewusst gesetzt, und die Verfügbarkeitszusagen der Anbieter passen zu dem, was dem Kunden zugesagt wurde.", evidence: "Tarif der BaaS- und Hosting-Projekte; Verhalten bei Pausierung und Inaktivität; Einstellungen zu Kontingenten, Ausgabenlimit und Nutzung; Service-Level-Bedingungen der Anbieter; Verfügbarkeitsüberwachung", question: "Läuft das Produktivsystem in einem Tarif mit Verfügbarkeitszusage, und könnten Nutzungslimits oder Inaktivität es pausieren?"}
  "SEC-OPS-08": {title: "Technische und organisatorische Maßnahmen (TOM) sind dokumentiert", summary: "Eine aktuelle Beschreibung der technischen und organisatorischen Maßnahmen (TOM) für diese App deckt Zugriffskontrolle, Verschlüsselung, Backups, Protokollierung, Vorfallbehandlung, weitere Auftragsverarbeiter und Tests ab. Sie entspricht der vorgefundenen Konfiguration und ist Anlage zum Auftragsverarbeitungsvertrag.", evidence: "TOM-Dokument mit Datum und Version; Abgleich mit der in dieser Bewertung geprüften Konfiguration; Anlage zum AVV mit Verweis darauf", question: "Haben Sie ein aktuelles TOM-Dokument für diese App, und beschreibt es, was tatsächlich konfiguriert ist?"}
  "SEC-OPS-09": {title: "Sicherheitsrelevante Dokumentation wurde übergeben", summary: "Der Kunde hat erhalten, was er für den sicheren Betrieb der App braucht: Architektur und Datenflüsse, Drittanbieterdienste, Umgebungsvariablen und zu rotierende Secrets, Zugriffsrichtlinien, Schritte zu Backup und Wiederherstellung sowie bekannte Einschränkungen oder offene Befunde.", evidence: "Übergabedokumentation und Datum der Übergabe; README oder Runbook im Repository; Liste der übergebenen offenen Sicherheitsbefunde", question: "Welche Dokumentation zu Architektur, Secrets, Zugriffsregeln und Betrieb der App haben Sie dem Kunden übergeben?"}

  # DP-INV Dateninventar und Zwecke
  "DP-INV-01": {title: "Personenbezogene Daten in der App sind inventarisiert", summary: "Eine Liste nennt die Tabellen, Collections, Buckets und externen Dienste mit personenbezogenen Daten, mit den Datenkategorien, den betroffenen Personen (Nutzer, Kunden des Kunden, Beschäftigte) und etwaigen besonderen Kategorien wie Gesundheitsdaten.", evidence: "Dateninventar oder Datenlandkarte; Schema-Export im Abgleich mit dem Inventar (Spalten mit Namen, E-Mail-Adressen, Telefonnummern, Anschriften, Freitext, Dateien); Kennzeichnung besonderer Kategorien", question: "Welche personenbezogenen Daten speichert die App, über wen und wo?"}
  "DP-INV-02": {title: "Das Datenmodell erhebt nur, was der Zweck erfordert", summary: "Formulare, Tabellen und Tracking erheben nur die Felder, die die vereinbarten Funktionen brauchen, freiwillige Felder sind als solche gekennzeichnet, und es gibt keine ungenutzten Spalten oder vorsorglichen Kopien personenbezogener Daten.", evidence: "Registrierungs- und Profilformulare; Schema im Abgleich mit den Funktionen und dem Inventar; ungenutzte Spalten mit personenbezogenen Daten; Voreinstellungen für freiwillige Angaben", question: "Erhebt die App personenbezogene Daten, die keine Funktion tatsächlich nutzt?"}
  "DP-INV-03": {title: "Daten werden nur auf dokumentierte Weisung des Verantwortlichen verarbeitet", summary: "Der Dienstleister nutzt die Daten des Kunden nur, um die App weisungsgemäß zu betreiben, nicht für eigene Analysen, Demos, Tests mit echten Daten oder das Training von Modellen. Weisungen über den Vertrag hinaus werden dokumentiert.", evidence: "AVV-Klausel zu Weisungen; Dokumentation zusätzlicher Weisungen; Prüfung, dass keine Produktanalyse, Demo, kein Test und kein KI-Training Kundendaten nutzt; Support-Verfahren", question: "Nutzen Sie die Daten des Kunden für etwas anderes als den Betrieb der App für ihn, etwa für Demos, Tests oder eigene Analysen?"}
  "DP-INV-04": {title: "Der Auftragsverarbeiter führt ein Verzeichnis von Verarbeitungstätigkeiten", summary: "Der Dienstleister führt ein Verzeichnis nach Art. 30 Abs. 2 DSGVO für die Verarbeitung, die er für diesen Kunden durchführt: Verantwortlicher und Kontaktdaten, Kategorien von Verarbeitungen, Übermittlungen in Drittländer mit ihren Garantien und eine allgemeine Beschreibung der Sicherheitsmaßnahmen.", evidence: "Verzeichnis von Verarbeitungstätigkeiten des Auftragsverarbeiters mit dem Eintrag für diesen Kunden; Datum der letzten Aktualisierung", question: "Führen Sie als Auftragsverarbeiter ein Verzeichnis von Verarbeitungstätigkeiten mit einem Eintrag für diesen Kunden?"}

  # DP-SUP Weitere Auftragsverarbeiter, Verträge und Übermittlungen
  "DP-SUP-01": {title: "Jeder von der App genutzte Drittanbieterdienst ist bekannt", summary: "Alle externen Dienste, die Daten der App erhalten oder speichern, sind aus Code und Konfiguration bekannt: Hosting, BaaS, KI-Builder, KI-APIs, E-Mail und SMS, Zahlung, Analyse, Fehlerüberwachung, Karten, Schriften und CDNs.", evidence: "SDKs und Pakete in den Manifesten; ausgehende Domains im Code und in einem Netzwerkmitschnitt; Umgebungsvariablen mit Drittanbieterdiensten; Webhooks und Integrationen; daraus erstellte Dienstliste mit den Daten, die jeder Dienst erhält", question: "An welche externen Dienste sendet die App Daten oder bei welchen speichert sie Daten?"}
  "DP-SUP-02": {title: "Der Verantwortliche hat die weiteren Auftragsverarbeiter genehmigt", summary: "Die Liste der weiteren Auftragsverarbeiter mit Dienst, Daten, Standort und Übermittlungsgrundlage wurde dem Kunden übergeben und nach dem AVV genehmigt, sie entspricht den tatsächlich genutzten Diensten, und der Kunde wird vorab über Änderungen informiert, damit er widersprechen kann.", evidence: "An den Kunden übermittelte Liste der Unterauftragsverarbeiter mit Datum; Genehmigungsklausel im AVV (gesondert oder allgemein); Abgleich mit der Dienstliste aus dem Code; versandte Änderungsmitteilungen", question: "Hat der Kunde Ihre Liste der Unterauftragsverarbeiter erhalten und genehmigt, und stimmt sie mit dem überein, was die App tatsächlich nutzt?"}
  "DP-SUP-03": {title: "Jeder weitere Auftragsverarbeiter ist durch einen Auftragsverarbeitungsvertrag gebunden", summary: "Jeder weitere Auftragsverarbeiter, auch BaaS-, Hosting-, E-Mail- und KI-Anbieter, ist durch einen Auftragsverarbeitungsvertrag mit denselben Datenschutzpflichten gebunden, die der Dienstleister gegenüber dem Kunden hat. Der Dienstleister hat deren Sicherheitsnachweise geprüft, etwa ISO-27001-Zertifikate oder SOC-2-Berichte.", evidence: "Unterzeichneter oder akzeptierter AVV je Unterauftragsverarbeiter (oft in den Kontoeinstellungen akzeptiert); vorliegende Zertifikate oder Prüfberichte; Datum der letzten Prüfung", question: "Haben Sie mit jedem Unterauftragsverarbeiter einen Auftragsverarbeitungsvertrag, auch mit den Hosting-, Datenbank- und KI-Anbietern?"}
  "DP-SUP-04": {title: "Übermittlungen außerhalb des EWR stützen sich auf ein gültiges Instrument", summary: "Für jeden weiteren Auftragsverarbeiter, der personenbezogene Daten außerhalb des EWR verarbeitet oder darauf zugreifen kann, stützt sich die Übermittlung auf einen Angemessenheitsbeschluss (für die USA die aktuelle Zertifizierung des Empfängers nach dem Data Privacy Framework) oder auf Standardvertragsklauseln, bei Bedarf mit einem Transfer Impact Assessment.", evidence: "Übermittlungsgrundlage je Unterauftragsverarbeiter; geprüfte Einträge in der Data-Privacy-Framework-Liste mit Datum; Standardvertragsklauseln mit Modul und Anhängen; Transfer Impact Assessments", question: "Welche Dienste verarbeiten Daten außerhalb der EU, und auf welcher Rechtsgrundlage erfolgen diese Übermittlungen?"}
  "DP-SUP-05": {title: "Ein Auftragsverarbeitungsvertrag mit dem Kunden deckt die App ab", summary: "Dienstleister und Kunde haben einen Auftragsverarbeitungsvertrag für diese App mit den Inhalten nach Art. 28 Abs. 3 DSGVO geschlossen: Gegenstand, Dauer, Daten und betroffene Personen, Weisungen, Vertraulichkeit, Sicherheit, weitere Auftragsverarbeiter, Unterstützung, Löschung oder Rückgabe und Überprüfungen.", evidence: "Unterzeichneter AVV mit dem Kunden und seinen Anlagen (TOM, Liste der Unterauftragsverarbeiter); Abgleich mit den Inhalten nach Art. 28 Abs. 3", question: "Gibt es einen unterzeichneten Auftragsverarbeitungsvertrag zwischen Ihnen und dem Kunden für diese App?"}
  "DP-SUP-06": {title: "Personen mit Zugriff sind zur Vertraulichkeit verpflichtet", summary: "Alle beim Dienstleister, auch freie Mitarbeiter, die auf personenbezogene Daten des Kunden zugreifen können, haben sich schriftlich zur Vertraulichkeit verpflichtet und wurden zum Umgang mit den Daten unterwiesen.", evidence: "Unterzeichnete Vertraulichkeitsvereinbarungen oder Vertragsklauseln für Beschäftigte und freie Mitarbeiter; Nachweise über Datenschutzunterweisungen oder Schulungen", question: "Hat jede Person bei Ihnen, die auf Daten des Kunden zugreifen kann, eine Vertraulichkeitsverpflichtung unterzeichnet?"}

  # DP-LIFE Aufbewahrung, Löschung und Rückgabe
  "DP-LIFE-01": {title: "Aufbewahrungsfristen sind festgelegt und werden durchgesetzt", summary: "Jede Kategorie personenbezogener Daten hat eine mit dem Kunden vereinbarte Aufbewahrungsfrist, und die App löscht oder anonymisiert Daten nach Fristablauf automatisch, etwa inaktive Konten, alte Nachrichten, Protokolle und hochgeladene Dateien.", evidence: "Löschkonzept mit Aufbewahrungsfristen je Datenkategorie; geplante Jobs oder Ablaufregeln (pg_cron, geplante Funktionen, Firestore-TTL-Richtlinien, Lifecycle-Regeln des Speichers) und ihre letzten Läufe; Stichprobe, die die Entfernung abgelaufener Daten zeigt", question: "Wie lange speichert die App jede Art personenbezogener Daten, und wird nach Ablauf dieser Frist automatisch gelöscht?"}
  "DP-LIFE-02": {title: "Die Daten einer Person können überall gelöscht werden", summary: "Ist eine Person zu löschen, entfernt die App ihre Daten an allen Stellen: Datenbankzeilen einschließlich abhängiger Zeilen, den Auth-Nutzer, gespeicherte Dateien, Suchindizes und Vektorspeicher sowie Drittanbieterdienste wie E-Mail-Listen und Analyse.", evidence: "Funktion zur Konto- oder Datenlöschung und was sie erfasst; Fremdschlüssel mit Kaskade oder ausdrücklicher Bereinigung; Bereinigung des Speichers; Aufrufe der Lösch-APIs von Drittanbietern; Test, bei dem ein Testnutzer gelöscht und jeder Speicherort geprüft wird", question: "Wenn eine Person ihre Löschung verlangt, können alle ihre Daten entfernt werden, auch Dateien und Daten bei Drittanbieterdiensten?"}
  "DP-LIFE-03": {title: "Die Daten einer Person können exportiert werden", summary: "Der Kunde kann alle personenbezogenen Daten einer Person in einem strukturierten, maschinenlesbaren Format erhalten, um Auskunfts- und Übertragbarkeitsanträge zu beantworten, ohne dass der Dienstleister jedes Mal von Hand in der Datenbank arbeiten muss.", evidence: "Exportfunktion oder dokumentierte Abfrage über alle Tabellen und Dateien einer Person; Beispielexport; Verfahren zur Weitergabe von Anträgen vom Kunden an den Dienstleister", question: "Kann der Kunde einen vollständigen Export der Daten einer Person erhalten, wenn diese Person das verlangt?"}
  "DP-LIFE-04": {title: "Daten werden bei Vertragsende zurückgegeben und gelöscht", summary: "Bei Vertragsende gibt der Dienstleister die Daten in einem nutzbaren Format zurück, wenn der Kunde das wünscht, löscht dann Produktionsdaten, Backups, Kopien und Zugänge innerhalb einer genannten Frist und bestätigt die Löschung schriftlich.", evidence: "Exit-Verfahren oder AVV-Klausel mit Format und Fristen; Aufbewahrung von Backups beim Anbieter nach Löschung eines Projekts; Vorlage oder frühere Löschbestätigungen", question: "Was geschieht mit den Daten des Kunden bei Vertragsende: Wie werden sie zurückgegeben, und wann ist alles gelöscht?"}
  "DP-LIFE-05": {title: "Gelöschte Daten verschwinden auch aus Backups, Protokollen und Arbeitskopien", summary: "In der Produktion gelöschte Daten verschwinden mit deren Ablauf aus Backups und Protokollen, innerhalb einer dokumentierten Frist, und der Dienstleister behält keine verstreuten Kopien wie CSV-Exporte, Datenbank-Dumps auf Laptops, Screenshots oder KI-Chatverläufe mit Kundendaten.", evidence: "Aufbewahrungsfristen von Backups und Protokollen; Regelung zu lokalen Kopien und Exporten; Prüfung gemeinsamer Laufwerke und Entwicklerrechner auf Dumps; Workspaces und Chatverläufe von KI-Werkzeugen", question: "Bewahren Sie oder Ihr Team Kopien der Kundendaten außerhalb des Produktivsystems auf, etwa Exporte, Dumps oder Dateien auf Laptops?"}

  # DP-INC Sicherheitsvorfälle und Meldung von Datenschutzverletzungen
  "DP-INC-01": {title: "Sicherheitsvorfälle werden behandelt und dokumentiert", summary: "Ein kurzes schriftliches Verfahren legt fest, wie Vorfälle bei der App erkannt, eingedämmt und behoben werden: wer entscheidet, wie Schlüssel rotiert, Sitzungen widerrufen und Registrierungen gestoppt werden und wie Vorfälle bei weiteren Auftragsverarbeitern den Dienstleister erreichen. Jeder Vorfall und jede vermutete Verletzung wird mit ihrer Behandlung dokumentiert.", evidence: "Verfahren oder Runbook zur Vorfallreaktion mit Kontakten; Abonnements der Statusseiten und Sicherheitshinweise der Anbieter; Vorfallprotokoll mit Datum, Beschreibung, betroffenen Daten und Maßnahmen, auch für nicht gemeldete Vorfälle", question: "Wenn die App morgen angegriffen würde: Wer würde was tun, und wo werden Vorfälle dokumentiert?"}
  "DP-INC-02": {title: "Der Verantwortliche wird unverzüglich über eine Verletzung informiert", summary: "Der Dienstleister meldet dem Kunden eine Verletzung des Schutzes personenbezogener Daten unverzüglich, nachdem sie ihm bekannt wurde, innerhalb der vertraglich vereinbarten Frist und mit den Angaben, die der Kunde für seine eigene Meldung an die Aufsichtsbehörde binnen 72 Stunden und, wenn er unter NIS2 fällt, für seine Frühwarnung binnen 24 Stunden braucht.", evidence: "AVV-Klausel zur Meldung von Verletzungen mit Frist und Meldeweg; Kontakt des Kunden für Sicherheitsmeldungen; Meldevorlage (Art der Verletzung, betroffene Daten und Personen, wahrscheinliche Folgen, ergriffene Maßnahmen); frühere Meldungen mit Zeitstempel", question: "Wie schnell und über welchen Weg würden Sie den Kunden über eine Datenschutzverletzung informieren, und ist das im Vertrag geregelt?"}

  # DP-AI KI und automatisierte Verarbeitung
  "DP-AI-01": {title: "Datenflüsse zu KI-Diensten sind dokumentiert", summary: "Für jede Funktion, die ein KI-Modell aufruft, ist dokumentiert, welcher Anbieter, welches Modell, welcher Endpunkt und welche Region welche Daten erhalten, ob personenbezogene Daten enthalten sind und ob Ausgaben oder Embeddings gespeichert werden.", evidence: "Code, der KI-APIs oder KI-Gateways aufruft, und die Erstellung der Prompts; Liste der KI-Funktionen mit gesendeten Daten, Anbieter, Region und Speicherung von Ausgaben oder Embeddings", question: "Welche KI-Dienste ruft die App auf, und welche Daten sendet jede Funktion an sie?"}
  "DP-AI-02": {title: "KI-Anbieter trainieren nicht mit den Daten und speichern sie nur kurz", summary: "KI-Dienste werden zu geschäftlichen API-Bedingungen genutzt, unter denen Eingaben und Ausgaben nicht zum Training verwendet werden, mit der kürzesten verfügbaren Aufbewahrung (Zero Data Retention oder ein kurzes Zeitfenster zur Missbrauchsüberwachung) und Verarbeitung in der EU, wo angeboten. Private KI-Konten werden nicht für Kundendaten verwendet.", evidence: "Anbieterbedingungen und Organisationseinstellungen zu Trainingsnutzung und Datenaufbewahrung; Freigabe für Zero Data Retention, soweit genutzt; Konfiguration von Datenresidenz oder regionalem Endpunkt; beim Anbieter gespeicherte Dateien, Threads oder Assistenten und ihre Löschung", question: "Nutzen die KI-Anbieter die Daten der App zum Training, und wie lange speichern sie sie?"}
  "DP-AI-03": {title: "KI-Anbieter sind durch einen AVV und ein Übermittlungsinstrument abgedeckt", summary: "Jeder KI-Anbieter, der personenbezogene Daten erhält, steht auf der Liste der weiteren Auftragsverarbeiter, ist durch einen Auftragsverarbeitungsvertrag gebunden, und jede Übermittlung außerhalb des EWR stützt sich auf einen Angemessenheitsbeschluss oder Standardvertragsklauseln.", evidence: "AVV des Anbieters (oft in den Kontoeinstellungen akzeptiert) mit Datum; Eintrag in der Liste der Unterauftragsverarbeiter; Eintrag im Data Privacy Framework oder Standardvertragsklauseln", question: "Gibt es mit jedem KI-Anbieter einen Auftragsverarbeitungsvertrag, und steht der Anbieter auf der dem Kunden übergebenen Liste der Unterauftragsverarbeiter?"}
  "DP-AI-04": {title: "An KI-Modelle werden nur nötige personenbezogene Daten gesendet", summary: "Prompts enthalten nur die Felder, die eine Funktion braucht. Kennungen werden entfernt oder pseudonymisiert, wo die Aufgabe es zulässt, und besondere Kategorien personenbezogener Daten, Secrets und Daten anderer Nutzer werden nur gesendet, wenn die Funktion es erfordert und dies dokumentiert ist.", evidence: "Code zur Erstellung der Prompts und Beispiel-Prompts aus Protokollen oder Testläufen; Schritt zur Schwärzung oder Pseudonymisierung; Regeln für besondere Kategorien", question: "Enthalten die an KI-Dienste gesendeten Prompts mehr personenbezogene Daten, als die Funktion braucht?"}
  "DP-AI-05": {title: "KI-Aufrufe laufen auf dem Server und sind begrenzt", summary: "KI-Anbieter werden aus Servercode mit dort hinterlegten Schlüsseln aufgerufen, nie aus dem Browser. Aufrufe sind je Nutzer und für die App insgesamt begrenzt, damit Missbrauch keine Kosten in die Höhe treibt und keine Kontingente erschöpft.", evidence: "Ort der KI-API-Schlüssel und -Aufrufe (Serverfunktionen oder Client-Bundle); Ratenbegrenzung oder Kontingente je Nutzer; Ausgabenlimits beim Anbieter; Nutzungsalarme", question: "Werden KI-Dienste nur von Ihrem Server aufgerufen, mit Limits je Nutzer und einer Ausgabengrenze?"}
  "DP-AI-06": {title: "Modellausgaben und KI-Werkzeuge gehen nicht über die Rechte des Nutzers hinaus", summary: "Modellausgaben gelten als nicht vertrauenswürdig: Sie werden vor der Anzeige bereinigt und nie direkt in Abfragen oder Befehlen verwendet. Werkzeuge und Datenabrufe, die das Modell nutzen kann, handeln mit den Rechten der angemeldeten Person, nicht mit einem Service-Role-Schlüssel, damit eine Prompt Injection keine Daten anderer Nutzer erreicht.", evidence: "Darstellung der Modellausgaben (Bereinigung von Markdown und HTML); Definitionen von Werkzeugen oder Function Calling und die dabei genutzten Zugangsdaten; Datenabrufe gefiltert nach den Rechten des Nutzers; Tests auf Prompt Injection", question: "Wenn die KI Werkzeuge aufrufen oder Daten lesen kann, ist sie auf das beschränkt, worauf die angemeldete Person zugreifen darf?"}
  "DP-AI-07": {title: "Automatisierte Entscheidungen über Personen werden von einem Menschen geprüft", summary: "Führt eine KI-Ausgabe zu Entscheidungen mit rechtlicher oder ähnlich erheblicher Wirkung für eine Person (Annahme, Ablehnung, Preisgestaltung, Reihung von Bewerbern), prüft ein Mensch die Entscheidung, die Person kann sie anfechten, und die Logik ist für den Kunden beschrieben.", evidence: "Funktionen, bei denen KI-Ausgaben Personen betreffen; menschlicher Prüfschritt im Ablauf; dem Kunden übergebene Beschreibung der Logik; Möglichkeit der Betroffenen, eine Entscheidung anzufechten", question: "Trifft die App mit KI Entscheidungen über Personen, und wenn ja, prüft ein Mensch diese?"}
  "DP-AI-08": {title: "KI-Builder und Programmierassistenten haben keinen Zugriff auf personenbezogene Produktionsdaten", summary: "KI-App-Builder und Programmierassistenten sind mit Entwicklungsprojekten verbunden, nicht mit Produktionsdaten, es sei denn, der Kunde hat zugestimmt und das Werkzeug ist als weiterer Auftragsverarbeiter abgedeckt. Ihre Integrationen haben nur die nötigsten Rechte, und es werden keine Produktionsdaten in Prompts eingefügt.", evidence: "Integrationen des KI-Builders mit BaaS und Repository (verbundene Projekte, Berechtigungsumfang, Schlüssel); Mitglieder des Workspace; Datenbank- oder MCP-Verbindungen von Programmierassistenten; Regelung des Dienstleisters zum Einfügen von Daten in KI-Werkzeuge", question: "Können der KI-Builder oder die Programmierassistenten, die Sie nutzen, die Produktionsdatenbank oder andere Produktionsdaten lesen?"}
