# NIS 2 Directive, Directive (EU) 2022/2555, and Commission Implementing
# Regulation (EU) 2024/2690: requirement identifiers, titles and short
# paraphrases for navigation and reporting.
#
# The summaries below are paraphrases, not the official wording. EU legal texts
# published on EUR-Lex may be reused with acknowledgement of the source
# (Commission Decision 2011/833/EU on the reuse of Commission documents); only
# the Official Journal version is authentic. Any requirement may carry a `text:`
# field with the official wording; the report prints `text` when present and
# falls back to `summary`.
#
# Sources checked: the Official Journal texts of Directive (EU) 2022/2555 and
# Implementing Regulation (EU) 2024/2690 in English and German, retrieved from
# the Publications Office (CELEX 32022L2555 and 32024R2690).
#
# kind: article - obligation of the Directive on the entity itself.
# kind: scoping - determines whether and where the Directive applies. Assessed
#                 once at the start of an engagement and when the entity changes.
# kind: annex   - section of the Annex to Implementing Regulation (EU) 2024/2690,
#                 which details the Art. 21(2) measures for certain providers.
# applies_to:
#   essential, important - essential and important entities (Art. 3).
#   digital-providers    - DNS service providers, TLD name registries, cloud
#       computing service providers, data centre service providers, content
#       delivery network providers, managed service providers, managed security
#       service providers, providers of online marketplaces, of online search
#       engines and of social networking services platforms, and trust service
#       providers (Art. 21(5) and Art. 1 of Regulation 2024/2690). For these
#       entities the Annex sections replace the generic reading of Art. 21(2).
#       Art. 27 uses an overlapping list: it adds entities providing domain name
#       registration services and leaves out trust service providers.
# plan: default frequency and nature for a requirement audited directly (a
#       REQ- unit). The auditor confirms them in testplan.csv.
# evidence: typical evidence an auditor asks for. Not exhaustive.
#
# Sections 7 and 9 of the Annex have numbered points but no headings; the titles
# of IR.7.x and IR.9.x are descriptive and not taken from the Regulation.

framework: {id: nis2, name: NIS2, title: "NIS 2 Directive", reference: "Directive (EU) 2022/2555", url: "https://eur-lex.europa.eu/eli/dir/2022/2555/oj"}

note: "NIS2 is a directive. Member states transpose it into national law, which adds national details: competent authority, reporting channel, registration procedure, deadlines, terminology and sometimes stricter rules. This catalog follows the Directive. Notable national deviations are listed in the national block at the end. Check the national law of every member state whose jurisdiction applies (Art. 26)."

groups:
  "SCOPE": Scope and classification
  "GOV": Governance
  "RM": Cybersecurity risk-management measures
  "REP": Reporting obligations
  "REG": Registration and supervision
  "IR": "Implementing Regulation (EU) 2024/2690"

requirements:
  # Scope (Art. 3 and Art. 26)
  - {id: "Art.3", kind: scoping, group: "SCOPE", applies_to: [essential, important], plan: [annual, manual], title: "Essential and important entities", summary: "The entity has determined whether it is an essential or important entity, based on its sector and type under Annex I or II, its size, and any designation by a member state. The classification is documented and reassessed when the business changes.", evidence: "Classification memo with sector, subsector and entity type; size calculation (headcount, turnover, balance sheet, linked and partner enterprises); any authority designation letter; date of last reassessment"}
  - {id: "Art.26", kind: scoping, group: "SCOPE", applies_to: [essential, important], plan: [annual, manual], title: "Jurisdiction and territoriality", summary: "The entity knows which member state or states have jurisdiction over it: normally the state of establishment, the state of main establishment for digital providers, or the state of service for public electronic communications. A digital provider not established in the Union has designated a representative in the Union.", evidence: "Jurisdiction analysis listing establishments and where cybersecurity risk-management decisions are taken; list of member states where services are provided; representative appointment where applicable"}

  # Governance (Art. 20)
  - {id: "Art.20(1)", kind: article, group: "GOV", applies_to: [essential, important], plan: [annual, manual], title: "Management body approval, oversight and liability", summary: "The management body approves the cybersecurity risk-management measures taken under Art. 21 and oversees their implementation. Its members can be held liable for infringements of Art. 21, so approval and oversight must be demonstrable.", evidence: "Board or management resolution approving the measures and the security policy; minutes showing regular security reporting to the management body; documented decisions on risk acceptance; assignment of responsibilities"}
  - {id: "Art.20(2)", kind: article, group: "GOV", applies_to: [essential, important], plan: [annual, manual], title: "Training of management body members", summary: "Members of the management body follow training that gives them enough knowledge and skills to identify risks and assess cybersecurity risk-management practices and their impact on the entity's services. Similar training is offered to employees on a regular basis.", evidence: "Training records and certificates for each management body member; training content and dates; employee training programme and completion rates"}

  # Cybersecurity risk-management measures (Art. 21 and Art. 24)
  - {id: "Art.21(1)", kind: article, group: "RM", applies_to: [essential, important], plan: [annual, manual], title: "Appropriate and proportionate measures", summary: "The entity takes appropriate and proportionate technical, operational and organisational measures to manage risks to its network and information systems and to prevent or minimise the impact of incidents. The measures reflect the state of the art, relevant standards, cost, the entity's exposure and size, and the likelihood and severity of incidents.", evidence: "Information security management framework or ISMS scope; risk assessment showing how measures were chosen; mapping of measures to Art. 21(2); reference to standards applied (for example ISO/IEC 27001)"}
  - {id: "Art.21(2)(a)", kind: article, group: "RM", applies_to: [essential, important], plan: [annual, manual], title: "Policies on risk analysis and information system security", summary: "The entity has an approved information system security policy and a documented risk analysis approach, based on an all-hazards approach that also covers the physical environment of the systems.", evidence: "Information security policy with approval date; risk management methodology; current risk register and risk treatment plan; review records"}
  - {id: "Art.21(2)(b)", kind: article, group: "RM", applies_to: [essential, important], plan: [annual, manual], title: "Incident handling", summary: "The entity can detect, analyse, contain, respond to and recover from incidents under a documented incident handling process.", evidence: "Incident response policy and playbooks; incident log or ticket history; on-call and escalation lists; incident response test or exercise reports"}
  - {id: "Art.21(2)(c)", kind: article, group: "RM", applies_to: [essential, important], plan: [annual, manual], title: "Business continuity and crisis management", summary: "The entity maintains business continuity, including backup management and disaster recovery, and has a crisis management process.", evidence: "Business impact analysis; business continuity and disaster recovery plans; backup policy and restore test results; crisis management plan and exercise reports"}
  - {id: "Art.21(2)(d)", kind: article, group: "RM", applies_to: [essential, important], plan: [annual, manual], title: "Supply chain security", summary: "The entity manages security risks in its relationships with direct suppliers and service providers, including security requirements in contracts.", evidence: "Supplier security policy; inventory of direct suppliers and service providers; supplier risk assessments; contract clauses on security, incident notification and audit rights"}
  - {id: "Art.21(2)(e)", kind: article, group: "RM", applies_to: [essential, important], plan: [quarterly, manual], title: "Security in acquisition, development and maintenance, including vulnerability handling and disclosure", summary: "Security is built into the acquisition, development and maintenance of network and information systems, and vulnerabilities are handled and disclosed under a defined process.", evidence: "Secure development and procurement requirements; change management records; vulnerability management procedure and scan results; patch records; coordinated vulnerability disclosure policy"}
  - {id: "Art.21(2)(f)", kind: article, group: "RM", applies_to: [essential, important], plan: [annual, manual], title: "Assessing the effectiveness of cybersecurity risk-management measures", summary: "The entity has policies and procedures to assess whether its cybersecurity risk-management measures are effective.", evidence: "Security metrics or KPI reports; internal audit reports; independent review or penetration test reports; management review minutes; tracked corrective actions"}
  - {id: "Art.21(2)(g)", kind: article, group: "RM", applies_to: [essential, important], plan: [annual, manual], title: "Basic cyber hygiene practices and cybersecurity training", summary: "Staff apply basic cyber hygiene practices and receive cybersecurity awareness and training suited to their roles.", evidence: "Awareness programme and materials; training completion records; phishing simulation results; cyber hygiene baseline (for example password, update and device rules)"}
  - {id: "Art.21(2)(h)", kind: article, group: "RM", applies_to: [essential, important], plan: [annual, manual], title: "Cryptography and encryption", summary: "The entity has policies and procedures on the use of cryptography and, where appropriate, encryption.", evidence: "Cryptography policy with approved algorithms and key lengths; key management procedure; configuration evidence of encryption at rest and in transit; certificate inventory"}
  - {id: "Art.21(2)(i)", kind: article, group: "RM", applies_to: [essential, important], plan: [quarterly, manual], title: "Human resources security, access control and asset management", summary: "The entity applies human resources security, access control policies and asset management.", evidence: "Onboarding, offboarding and background check procedures; access control policy; user access reviews; joiner, mover and leaver records; asset inventory"}
  - {id: "Art.21(2)(j)", kind: article, group: "RM", applies_to: [essential, important], plan: [continuous, automated], title: "Multi-factor authentication, secured communications and secured emergency communications", summary: "Where appropriate, the entity uses multi-factor or continuous authentication, secured voice, video and text communications, and secured emergency communication systems.", evidence: "Identity provider MFA enforcement settings and coverage report; exceptions list; approved secure communication tools; emergency communication plan and test record"}
  - {id: "Art.21(3)", kind: article, group: "RM", applies_to: [essential, important], plan: [annual, manual], title: "Supply chain considerations", summary: "When choosing supply chain measures, the entity takes into account each direct supplier's specific vulnerabilities, the overall quality of their products and cybersecurity practices including secure development, and the results of Union coordinated risk assessments of critical supply chains under Art. 22(1).", evidence: "Supplier assessments covering vulnerabilities, product quality and secure development; supplier certifications or audit reports; record of how Union coordinated risk assessments of critical supply chains were considered"}
  - {id: "Art.21(4)", kind: article, group: "RM", applies_to: [essential, important], plan: [event, manual], title: "Corrective measures", summary: "When the entity finds that it does not comply with the Art. 21(2) measures, it takes all necessary, appropriate and proportionate corrective measures without undue delay.", evidence: "Nonconformity and finding register; corrective action plans with owners and due dates; closure evidence; management reporting on overdue actions"}
  - {id: "Art.24", kind: article, group: "RM", applies_to: [essential, important], plan: [annual, manual], title: "Use of certified ICT products, services and processes", summary: "Where a member state or a Commission delegated act requires it, the entity uses ICT products, services and processes certified under European cybersecurity certification schemes (Regulation (EU) 2019/881). Member states also encourage the use of qualified trust services.", evidence: "Analysis of whether a national or delegated certification requirement applies; inventory of affected ICT products and services; certificates under the relevant EU scheme (for example EUCC)"}

  # Reporting obligations (Art. 23)
  - {id: "Art.23(3)", kind: article, group: "REP", applies_to: [essential, important], plan: [event, manual], title: "Determining significant incidents", summary: "The entity assesses each incident against the significance criteria: severe operational disruption or financial loss for the entity, or considerable material or non-material damage to others. Digital providers apply the criteria in Art. 3 to 14 of Regulation 2024/2690.", evidence: "Incident classification procedure with significance criteria and thresholds; classification decision recorded per incident; quarterly assessment of recurring incidents for digital providers"}
  - {id: "Art.23(4)(a)", kind: article, group: "REP", applies_to: [essential, important], plan: [event, manual], title: "Early warning within 24 hours", summary: "Without undue delay and within 24 hours of becoming aware of a significant incident, the entity sends an early warning to the CSIRT or competent authority, stating where applicable whether unlawful or malicious acts are suspected and whether there could be a cross-border impact.", evidence: "Reporting procedure with authority contacts and channel; timestamps of awareness and submission; submitted early warnings; reporting exercise records"}
  - {id: "Art.23(4)(b)", kind: article, group: "REP", applies_to: [essential, important], plan: [event, manual], title: "Incident notification within 72 hours", summary: "Without undue delay and within 72 hours of becoming aware of a significant incident, the entity submits an incident notification that updates the early warning and gives an initial assessment of severity and impact and, where available, indicators of compromise. Trust service providers must notify within 24 hours for incidents affecting their trust services.", evidence: "Submitted incident notifications with timestamps; initial severity and impact assessment; indicators of compromise shared"}
  - {id: "Art.23(4)(c)", kind: article, group: "REP", applies_to: [essential, important], plan: [event, manual], title: "Intermediate report on request", summary: "On request of the CSIRT or competent authority, the entity provides an intermediate report with relevant status updates.", evidence: "Authority requests and the intermediate reports sent in response, with dates"}
  - {id: "Art.23(4)(d)", kind: article, group: "REP", applies_to: [essential, important], plan: [event, manual], title: "Final report within one month", summary: "No later than one month after the incident notification, the entity submits a final report with a detailed description, severity and impact, the likely threat type or root cause, applied and ongoing mitigation, and any cross-border impact. If the incident is still ongoing, it submits a progress report then and the final report within one month of handling the incident (Art. 23(4)(e)).", evidence: "Final or progress reports with submission dates; root cause analysis; post-incident review records"}
  - {id: "Art.23(1)", kind: article, group: "REP", applies_to: [essential, important], plan: [event, manual], title: "Notifying recipients of significant incidents", summary: "Where appropriate, the entity notifies the recipients of its services without undue delay of significant incidents that are likely to adversely affect the provision of those services.", evidence: "Customer communication procedure and templates; records of notifications sent (status page posts, emails) with timestamps; decision record where no notification was sent"}
  - {id: "Art.23(2)", kind: article, group: "REP", applies_to: [essential, important], plan: [event, manual], title: "Communicating significant cyber threats to recipients", summary: "Where applicable, the entity tells recipients potentially affected by a significant cyber threat, without undue delay, which measures or remedies they can take, and where appropriate informs them about the threat itself.", evidence: "Threat communication procedure; security advisories or customer notices issued; threat intelligence intake records that triggered them"}

  # Registration (Art. 3(4) and Art. 27)
  - {id: "Art.3(4)", kind: article, group: "REG", applies_to: [essential, important], plan: [annual, manual], title: "Submitting entity information to the competent authority", summary: "The entity submits its name, address and contact details, IP ranges, sector and subsector, and the member states where it provides in-scope services to the competent authority, and reports changes without delay and within two weeks.", evidence: "Registration confirmation from the authority or national portal; copy of submitted data; change log showing updates within two weeks"}
  - {id: "Art.27", kind: article, group: "REG", applies_to: [digital-providers], plan: [annual, manual], title: "Registry of entities for digital providers", summary: "DNS service providers, TLD name registries, domain name registration service providers, cloud, data centre, CDN, managed and managed security service providers, online marketplaces, search engines and social networks submit their name, sector and type, main and other EU establishments or representative, contact details, the member states served and IP ranges, for the ENISA registry. Changes are notified within three months.", evidence: "Registration confirmation; submitted data set including main establishment and IP ranges; change notifications with dates"}

  # Implementing Regulation (EU) 2024/2690, Annex
  # 1 Policy on the security of network and information systems (Art. 21(2)(a))
  - {id: "IR.1.1", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Policy on the security of network and information systems", summary: "A security policy sets out the approach, objectives, commitment to improvement and resources, roles, documentation and retention, topic-specific policies and monitoring indicators. It is approved by the management bodies, communicated, and reviewed at least annually and after significant incidents or changes.", evidence: "Approved policy with approval date; list of topic-specific policies; acknowledgement records; annual review record"}
  - {id: "IR.1.2", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Roles, responsibilities and authorities", summary: "Security responsibilities and authorities are assigned to roles and communicated to the management bodies. At least one person reports directly to the management bodies on security, conflicting duties are segregated, and roles are reviewed at planned intervals.", evidence: "Role and responsibility matrix; appointment of the security lead with direct reporting line; segregation of duties analysis; review record"}
  # 2 Risk management policy (Art. 21(2)(a))
  - {id: "IR.2.1", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Risk management framework", summary: "A documented risk management process sets risk tolerance and criteria, identifies, analyses and evaluates risks on an all-hazards basis including single points of failure, and produces a risk treatment plan. Management bodies accept residual risks, and assessments are reviewed at least annually.", evidence: "Risk methodology; risk register; risk treatment plan with owners and dates; residual risk acceptance by management; annual review evidence"}
  - {id: "IR.2.2", kind: annex, group: "IR", applies_to: [digital-providers], plan: [quarterly, manual], title: "Compliance monitoring", summary: "Compliance with security policies, rules and standards is reviewed at planned intervals, and the management bodies are regularly informed through a compliance reporting system.", evidence: "Compliance review schedule and results; management security status reports"}
  - {id: "IR.2.3", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Independent review of information and network security", summary: "The approach to security and its implementation are reviewed independently by people with audit competence outside the line of authority of the reviewed area. Results go to the management bodies and lead to corrective action or risk acceptance.", evidence: "Independent review or internal audit reports; auditor independence and competence evidence; management reporting; corrective action tracking"}
  # 3 Incident handling (Art. 21(2)(b))
  - {id: "IR.3.1", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Incident handling policy", summary: "An incident handling policy defines roles and procedures for detecting, analysing, containing, recovering from, documenting and reporting incidents, with a categorisation system, communication and escalation plans and supporting documents. It is tested and reviewed at planned intervals.", evidence: "Incident handling policy; categorisation scheme; escalation charts and contact lists; test and review records"}
  - {id: "IR.3.2", kind: annex, group: "IR", applies_to: [digital-providers], plan: [continuous, automated], title: "Monitoring and logging", summary: "Activities on network and information systems are monitored and logged, automated where feasible, covering the log types listed in the Annex. Logs are reviewed, alarm thresholds trigger timely response, logs are protected and retained, time sources are synchronised, and logging systems are redundant.", evidence: "Logging standard and list of logged assets; SIEM configuration and alert rules; log retention and integrity settings; NTP configuration; monitoring of logging availability"}
  - {id: "IR.3.3", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Event reporting", summary: "Employees, suppliers and customers have a simple mechanism to report suspicious events, and employees are regularly trained to use it.", evidence: "Reporting channel (mailbox, form, hotline); communication to suppliers and customers; training records"}
  - {id: "IR.3.4", kind: annex, group: "IR", applies_to: [digital-providers], plan: [event, manual], title: "Event assessment and classification", summary: "Suspicious events are assessed against predefined criteria and triaged to decide whether they are incidents and how severe. Recurring incidents are assessed quarterly, logs are correlated, and events are reclassified when new information arrives.", evidence: "Triage criteria; classified event records; quarterly recurring-incident assessment; log correlation rules"}
  - {id: "IR.3.5", kind: annex, group: "IR", applies_to: [digital-providers], plan: [event, manual], title: "Incident response", summary: "Incidents are handled through documented containment, eradication and recovery procedures, with communication plans for the CSIRT or authority, staff and external stakeholders. Response activities are logged and procedures are tested at planned intervals.", evidence: "Response procedures; incident tickets with timeline and evidence; communication plan; exercise reports"}
  - {id: "IR.3.6", kind: annex, group: "IR", applies_to: [digital-providers], plan: [event, manual], title: "Post-incident reviews", summary: "Where appropriate, post-incident reviews identify root causes and documented lessons learned that feed back into security, risk treatment and incident procedures. The entity checks at planned intervals whether incidents led to reviews.", evidence: "Post-incident review reports; lessons learned and resulting changes; periodic check of review coverage"}
  # 4 Business continuity and crisis management (Art. 21(2)(c))
  - {id: "IR.4.1", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Business continuity and disaster recovery plan", summary: "A business continuity and disaster recovery plan based on the risk assessment and a business impact analysis defines roles, contacts, activation conditions, recovery order and objectives, and required resources. It is tested and updated with lessons learned.", evidence: "Business impact analysis; BC and DR plans; recovery objectives (RTO, RPO); test reports and updates"}
  - {id: "IR.4.2", kind: annex, group: "IR", applies_to: [digital-providers], plan: [daily, automated], title: "Backup and redundancy management", summary: "Backups are complete, stored separately at sufficient distance, access controlled and retained according to requirements, with regular integrity checks and restore tests. Systems, assets, personnel and communication channels have at least partial redundancy.", evidence: "Backup plan and job reports; offsite or offline storage evidence; integrity check and restore test results; redundancy design"}
  - {id: "IR.4.3", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Crisis management", summary: "A crisis management process defines roles, including for suppliers, communication with competent authorities and security in crisis situations. Information from CSIRTs and authorities is processed, and the plan is tested and updated.", evidence: "Crisis management plan; crisis team roster; authority communication channels; crisis exercise reports; CSIRT advisory intake records"}
  # 5 Supply chain security (Art. 21(2)(d))
  - {id: "IR.5.1", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Supply chain security policy", summary: "A supply chain security policy sets supplier selection criteria (security practices, ability to meet specifications, product quality, diversification) and contract requirements such as incident notification, audit rights, vulnerability handling, subcontracting and exit. Suppliers are monitored and the policy is reviewed.", evidence: "Supply chain security policy; supplier selection criteria; contracts and SLAs with security clauses; supplier monitoring and review records"}
  - {id: "IR.5.2", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Directory of suppliers and service providers", summary: "An up-to-date register lists direct suppliers and service providers with contact points and the ICT products, services and processes each provides.", evidence: "Supplier register export with contact points and supplied ICT products and services; last update date"}
  # 6 Security in acquisition, development and maintenance (Art. 21(2)(e))
  - {id: "IR.6.1", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Security in acquisition of ICT services or ICT products", summary: "Processes manage risks from acquiring critical ICT services or products over their life cycle: security requirements, security updates or replacement at end of support, component and security-function information, and validation of delivered products.", evidence: "Procurement security requirements; supplier security documentation; acceptance or validation records; end-of-support tracking"}
  - {id: "IR.6.2", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Secure development life cycle", summary: "Secure development rules cover all phases for in-house and outsourced development: security requirements analysis, secure engineering and coding principles, secure development environments, security testing and protected, sanitised test data.", evidence: "Secure development policy; security requirements in design documents; code review and SAST or DAST results; test data handling rules"}
  - {id: "IR.6.3", kind: annex, group: "IR", applies_to: [digital-providers], plan: [continuous, automated], title: "Configuration management", summary: "Secure configurations for hardware, software, services and networks are defined, documented, enforced by processes and tools, and monitored for new and operating systems.", evidence: "Hardening baselines; configuration management tooling; drift or compliance reports"}
  - {id: "IR.6.4", kind: annex, group: "IR", applies_to: [digital-providers], plan: [continuous, manual], title: "Change management, repairs and maintenance", summary: "Changes, releases and emergency changes are documented, tested and assessed for impact before implementation. Emergency deviations are documented with their reason.", evidence: "Change management procedure; change tickets with approval, test and impact assessment; emergency change records"}
  - {id: "IR.6.5", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Security testing", summary: "A security testing policy sets the need, scope, frequency and type of tests based on risk. Tests follow a documented methodology, results and criticality are recorded, and critical findings are mitigated.", evidence: "Security testing policy; test plan; penetration test and scan reports; finding remediation records"}
  - {id: "IR.6.6", kind: annex, group: "IR", applies_to: [digital-providers], plan: [monthly, automated], title: "Security patch management", summary: "Security patches from trusted sources are tested and applied within a reasonable time. Where a patch is not applied, additional measures are taken, residual risk is accepted and the decision is documented.", evidence: "Patch management procedure; patch compliance reports; patch exception register with justification"}
  - {id: "IR.6.7", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Network security", summary: "Networks are protected by a documented architecture, controls on internal domains and remote access, deactivated unneeded services, authorised devices, time-limited supplier connections and trusted channels. Plans exist for moving to latest-generation network protocols and modern email security standards, and DNS and routing security best practices are applied.", evidence: "Network architecture diagrams; firewall and remote access rules; supplier access approvals; IPv6 and email security (for example DMARC, DNSSEC) implementation plans"}
  - {id: "IR.6.8", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Network segmentation", summary: "Systems are segmented into zones based on risk, separated from third-party networks, with critical systems in secured zones, a DMZ, restricted inter-zone traffic, a separate administration network and separation of production from development and testing.", evidence: "Zone model and segmentation diagrams; firewall rule reviews; evidence of separate admin network and environments"}
  - {id: "IR.6.9", kind: annex, group: "IR", applies_to: [digital-providers], plan: [continuous, automated], title: "Protection against malicious and unauthorised software", summary: "Measures detect or prevent malicious and unauthorised software, including regularly updated detection and response software where appropriate.", evidence: "EDR or antimalware coverage report; signature and agent update status; application allowlisting configuration"}
  - {id: "IR.6.10", kind: annex, group: "IR", applies_to: [digital-providers], plan: [monthly, automated], title: "Vulnerability handling and disclosure", summary: "The entity monitors vulnerability information, scans at planned intervals, fixes critical vulnerabilities without undue delay, aligns vulnerability handling with change, patch, risk and incident management, and has a disclosure procedure in line with the national coordinated vulnerability disclosure policy.", evidence: "Vulnerability management procedure; scan reports; remediation tickets and SLAs; documented non-remediation decisions; disclosure policy (for example security.txt)"}
  # 7 Assessing the effectiveness of cybersecurity risk-management measures (Art. 21(2)(f))
  - {id: "IR.7.1", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Effectiveness assessment policy and procedures", summary: "A policy and procedures assess whether the cybersecurity risk-management measures are effectively implemented and maintained.", evidence: "Effectiveness assessment policy; assessment procedures"}
  - {id: "IR.7.2", kind: annex, group: "IR", applies_to: [digital-providers], plan: [quarterly, manual], title: "What, how, when and by whom to measure", summary: "Taking account of the risk assessment and past significant incidents, the entity determines which measures are monitored and measured, the methods, when measurement and evaluation happen, and who is responsible.", evidence: "Metrics catalogue with owners, methods and frequencies; measurement results; evaluation reports"}
  - {id: "IR.7.3", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Review of the effectiveness assessment policy", summary: "The effectiveness policy and procedures are reviewed and updated at planned intervals and after significant incidents or changes.", evidence: "Review records and version history"}
  # 8 Basic cyber hygiene practices and security training (Art. 21(2)(g))
  - {id: "IR.8.1", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Awareness raising and basic cyber hygiene practices", summary: "Employees, including management body members, and where appropriate direct suppliers follow a recurring awareness programme on threats, measures in place and cyber hygiene. Its effectiveness is tested where appropriate and it is updated for the current threat landscape.", evidence: "Awareness programme plan; materials; participation records including management and new joiners; effectiveness tests such as phishing simulations"}
  - {id: "IR.8.2", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Security training", summary: "Roles needing security skills are identified and receive regular, role-relevant training on secure configuration and operation, known threats and behaviour during security events. Effectiveness is assessed, and staff moving into such roles are trained.", evidence: "Training needs analysis by role; training programme; completion and assessment records"}
  # 9 Cryptography (Art. 21(2)(h))
  - {id: "IR.9.1", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Cryptography policy and procedures", summary: "A policy and procedures ensure adequate and effective use of cryptography to protect confidentiality, authenticity and integrity of data, in line with asset classification and the risk assessment.", evidence: "Cryptography policy; mapping to asset classification"}
  - {id: "IR.9.2", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Cryptographic measures, protocols and key management", summary: "The policy sets the type, strength and quality of cryptographic measures for data at rest and in transit, approved protocols, algorithms and cipher strengths with crypto agility, and a key management approach covering generation, distribution, storage, rotation, compromise, revocation, recovery, backup, destruction, logging and validity periods.", evidence: "Approved algorithm and protocol list; key management procedure; KMS or HSM configuration; key rotation and certificate expiry records"}
  - {id: "IR.9.3", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Review of cryptography policy", summary: "The cryptography policy and procedures are reviewed at planned intervals, taking into account the state of the art in cryptography.", evidence: "Review record; changes made in response to cryptographic developments"}
  # 10 Human resources security (Art. 21(2)(i))
  - {id: "IR.10.1", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Human resources security", summary: "Employees and, where applicable, suppliers understand and commit to their security responsibilities, privileged users and management body members act according to their roles, and qualified personnel are hired. Role assignments are reviewed at least annually.", evidence: "Signed security responsibilities or code of conduct; hiring checks; annual review of role assignments"}
  - {id: "IR.10.2", kind: annex, group: "IR", applies_to: [digital-providers], plan: [event, manual], title: "Verification of background", summary: "Criteria define which roles require background verification, and verification is done before people take up those roles, in line with law and proportionate to risk.", evidence: "Background check policy and role criteria; check records for sampled hires"}
  - {id: "IR.10.3", kind: annex, group: "IR", applies_to: [digital-providers], plan: [event, manual], title: "Termination or change of employment procedures", summary: "Security duties that remain valid after termination or change of employment, such as confidentiality, are in contracts and enforced.", evidence: "Employment contract and NDA templates; leaver and mover records"}
  - {id: "IR.10.4", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Disciplinary process", summary: "A disciplinary process for security policy violations is established, communicated and reviewed.", evidence: "Disciplinary procedure; communication to staff; review record"}
  # 11 Access control (Art. 21(2)(i) and (j))
  - {id: "IR.11.1", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Access control policy", summary: "Logical and physical access control policies cover access by persons (staff, visitors, suppliers) and by systems, and grant access only to adequately authenticated users.", evidence: "Access control policy; review record"}
  - {id: "IR.11.2", kind: annex, group: "IR", applies_to: [digital-providers], plan: [quarterly, manual], title: "Management of access rights", summary: "Access rights are granted, modified and revoked on need-to-know, least privilege and separation of duties, authorised, limited for third parties, recorded in a register, logged and reviewed at planned intervals.", evidence: "Access request and approval records; access rights register; periodic access review results; leaver deprovisioning evidence"}
  - {id: "IR.11.3", kind: annex, group: "IR", applies_to: [digital-providers], plan: [quarterly, manual], title: "Privileged accounts and system administration accounts", summary: "Privileged and administration accounts use strong authentication such as MFA, are dedicated to administration, individualised and restricted, used only to connect to administration systems, and reviewed at planned intervals.", evidence: "Privileged access policy; PAM configuration; list of admin accounts; privileged access review results"}
  - {id: "IR.11.4", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Administration systems", summary: "System administration systems are used only for administration, logically separated from other application software, and protected by authentication and encryption.", evidence: "Admin workstation or jump host design; access and encryption configuration"}
  - {id: "IR.11.5", kind: annex, group: "IR", applies_to: [digital-providers], plan: [quarterly, automated], title: "Identification", summary: "Unique identities are managed over their life cycle and linked to a single person. Shared identities are allowed only with documented approval and taken into account in risk management, and unused identities are deactivated without delay.", evidence: "Identity lifecycle procedure; IdP or directory export; shared account register with approvals; dormant account reports"}
  - {id: "IR.11.6", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, automated], title: "Authentication", summary: "Authentication strength fits the asset classification, secret authentication information is handled confidentially, credentials are changed initially and on suspected compromise, accounts lock after failed attempts, inactive sessions end, and privileged access uses separate credentials.", evidence: "Authentication standard; IdP password, lockout and session settings; review record"}
  - {id: "IR.11.7", kind: annex, group: "IR", applies_to: [digital-providers], plan: [continuous, automated], title: "Multi-factor authentication", summary: "Users authenticate with multiple factors or continuous authentication where appropriate for the classification of the asset accessed.", evidence: "MFA enforcement policies; MFA coverage report; documented exceptions"}
  # 12 Asset management (Art. 21(2)(i))
  - {id: "IR.12.1", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Asset classification", summary: "All in-scope assets, including information, are assigned classification levels based on confidentiality, integrity, authenticity and availability needs, aligned with continuity objectives, and reviewed periodically.", evidence: "Classification scheme; classified asset inventory; review record"}
  - {id: "IR.12.2", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Handling of assets", summary: "An asset handling policy covers the full life cycle, including safe use, storage, transport, secure transfer and irretrievable deletion or destruction, and is communicated to users.", evidence: "Asset handling policy; disposal and destruction certificates; communication records"}
  - {id: "IR.12.3", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, automated], title: "Removable media policy", summary: "A removable media policy technically blocks removable media unless needed, disables autorun and scans media, protects media in transit and storage, and uses encryption where appropriate.", evidence: "Removable media policy; endpoint device control configuration; exception approvals"}
  - {id: "IR.12.4", kind: annex, group: "IR", applies_to: [digital-providers], plan: [quarterly, automated], title: "Asset inventory", summary: "A complete, accurate and current inventory lists operations and services and the systems and assets supporting them, with traceable change history.", evidence: "Asset inventory or CMDB export; change history; reconciliation with discovery tools"}
  - {id: "IR.12.5", kind: annex, group: "IR", applies_to: [digital-providers], plan: [event, manual], title: "Deposit, return or deletion of assets upon termination of employment", summary: "Assets in personnel custody are returned, deposited or deleted at termination of employment and this is documented. Where that is impossible, the assets are prevented from accessing the entity's systems.", evidence: "Offboarding checklists; asset return records; remote wipe or block records"}
  # 13 Environmental and physical security (Art. 21(2)(c), (e) and (i))
  - {id: "IR.13.1", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Supporting utilities", summary: "Facilities are protected against failures of supporting utilities such as power, telecommunications, water and cooling, with redundancy considered, utility lines protected, utilities monitored against thresholds, emergency supply contracts in place and supply tested.", evidence: "UPS and generator test records; emergency fuel contracts; utility monitoring and alarm records; redundancy design"}
  - {id: "IR.13.2", kind: annex, group: "IR", applies_to: [digital-providers], plan: [annual, manual], title: "Protection against physical and environmental threats", summary: "Based on the risk assessment, protection measures against physical and environmental threats such as natural disasters are designed and implemented, with control thresholds and monitoring of environmental parameters.", evidence: "Physical risk assessment; fire, flood and climate protection documentation; environmental monitoring thresholds and alarm logs"}
  - {id: "IR.13.3", kind: annex, group: "IR", applies_to: [digital-providers], plan: [continuous, manual], title: "Perimeter and physical access control", summary: "Security perimeters with entry controls protect areas holding systems and assets, physical security is designed for offices and facilities, and premises are continuously monitored for unauthorised access.", evidence: "Site security plan; badge access logs and reviews; visitor logs; CCTV or alarm monitoring evidence"}

# National transposition. Short and selective: only verified, audit-relevant
# deviations from the Directive. Check the current national text before use.
national:
  de:
    law: "NIS-2-Umsetzungs- und Cybersicherheitsstärkungsgesetz (NIS2UmsuCG), BGBl. 2025 I Nr. 301; enacts the new BSI-Gesetz (BSIG)"
    status: "In force since 6 December 2025, without a transition period. The BSI-Portal for registration opened on 6 January 2026."
    sources: ["https://www.recht.bund.de/bgbl/1/2025/301", "https://www.gesetze-im-internet.de/bsig_2025/", "https://www.bsi.bund.de/DE/Service-Navi/Presse/Pressemitteilungen/Presse2025/251205_NIS-2-Umsetzungsgesetz_in_Kraft.html"]
    differences:
      - {topic: terminology, ref: "§ 28 BSIG", summary: "Essential entities are called besonders wichtige Einrichtungen. Operators of critical facilities (Betreiber kritischer Anlagen) are always besonders wichtige Einrichtungen and have additional duties."}
      - {topic: registration, ref: "§ 33, § 34 BSIG", maps_to: ["Art.3(4)", "Art.27"], summary: "Register with the BSI within three months of first or renewed qualification, through the joint BSI and BBK registration facility: an ELSTER-based Mein Unternehmenskonto (MUK) first, then the BSI-Portal. The data set adds legal form, commercial register number and the competent federal and state supervisory authorities. Changes within two weeks. Digital providers under § 34 report additional data, with changes within three months."}
      - {topic: management, ref: "§ 38 BSIG", maps_to: ["Art.20(1)", "Art.20(2)"], summary: "Geschäftsleitungen must implement the § 30 risk-management measures and oversee their implementation (the Directive says approve). Liability toward the entity follows company law. Geschäftsleitungen must attend training regularly."}
      - {topic: reporting, ref: "§ 32 BSIG", maps_to: ["Art.23(4)(a)", "Art.23(4)(b)", "Art.23(4)(c)", "Art.23(4)(d)"], summary: "Reports go to the joint BSI and BBK reporting office, in practice through the BSI-Portal: frühe Erstmeldung within 24 hours, Meldung within 72 hours, Zwischenmeldung on request, Abschlussmeldung within one month, or a Fortschrittsmeldung if the incident is ongoing. KRITIS operators keep using their existing channel for now."}
  at:
    law: "Netz- und Informationssystemsicherheitsgesetz 2026 (NISG 2026), BGBl. I Nr. 94/2025"
    status: "The NISG 2024 bill failed in the Nationalrat in 2024 for lack of a two-thirds majority. The NISG 2026 was adopted on 12 December 2025, promulgated on 23 December 2025 and in force since 1 October 2026; it replaces the NISG 2018."
    sources: ["https://www.ris.bka.gv.at/eli/bgbl/I/2025/94", "https://www.parlament.gv.at/aktuelles/pk/jahr_2025/pk1189"]
